// ============================================================================================
// MOH Trilogy Coop - open PROTOTYPE C ("Minimal").  PROTOTYPE ONLY.
//
//     exec ui/proto/coop_proto_c_open.cfg
//
// Run it from the MAIN MENU.  C was the only one of the three prototypes without a loader, so
// it had to be opened by hand - three console lines that skipped two things this file does.
//
// WHY "pushmenu main" IS IN THE MIDDLE - the same reason as prototype B, and it is not
// decoration.  UI_LoadMenu calls uWinMan.CreateMenus(), which begins with
// menuManager.DeleteAllMenus() (uilib/uimenu.cpp) and CLEARS the menu stack.  From the first
// loadmenu onward the real main menu is no longer underneath, so BACK (popmenu 0) would land on
// a cleared black screen with a cursor.  Re-seating "main" first restores the normal state.
//
// WHY THE THREE CHROME CVARS ARE BLANKED - ui/proto/coop_proto_chrome.inc draws an optional
// title, strapline and full-screen backdrop from coop_protoTitle / coop_protoSub /
// coop_protoArt.  Prototype C draws its own wordmark in the body and wants no backdrop at all,
// so if you had opened prototype A first, C would come up wearing A's leftover art.  "0" is not
// a shader name, so the backdrop registers no material and simply draws nothing.
//
// The dedup in uiwinman.cpp:640-658 means re-running this cfg is safe: a second scan's duplicate
// container is dropped and the first copy kept.  That also means EDITS to the .urc will not show
// up on a re-run - layout iteration needs a client restart.
// ============================================================================================

loadmenu proto/coop_proto_c_main
loadmenu proto/coop_proto_c_play

set coop_protoTitle ""
set coop_protoSub ""
set coop_protoArt 0

// Proto-private page state.  Both pages are correct with neither set; this is a reset.
set coop_protoHint 0
set coop_protoHint2 0
set coop_protoPick ""

pushmenu main
pushmenu coop_proto_c_main
