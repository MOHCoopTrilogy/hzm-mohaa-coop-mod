// ============================================================================================
// MOH Trilogy Coop - PROTOTYPE A "CINEMATIC" - loader.           PROTOTYPE. NOT A SHIPPING MENU.
//
// Opens the prototype and nothing else.  From the in-game console (~):
//
//     exec ui/proto/coop_proto_a.cfg
//
// Close it with the BACK button at the bottom left, or with `popmenu 0` - either way you land
// back on whatever menu was underneath, normally the real main menu.  Nothing shipped is
// modified, shadowed or replaced by any of this.
//
// WHY A LOADER IS NEEDED AT ALL
//   The engine's menu sweep is FS_ListFiles("ui/", "urc", qfalse, ...) at client/cl_ui.cpp:5634,
//   and wantSubs=qfalse rejects any pak entry whose path depth is not 1 (qcommon/files.cpp:2426).
//   ui/proto/*.urc is therefore never auto-registered: a prototype does not exist until an
//   explicit `loadmenu` asks for it.  That is the safety property - these files are inert on
//   disk and cost nothing at startup.
//
//   `pushmenu`, never `showmenu`: UI_ShowMenu skips the focus call that turns the mouse on
//   (cl_ui.cpp:5524 vs :5529), which gives you a menu you cannot click.
//
// EVERY CVAR HERE USES `set`, NOT `seta`
//   set is session-only.  seta would archive these prototype cvars into the player's real
//   config and leave them there after the prototype is long gone.
// ============================================================================================

// --- resting state --------------------------------------------------------------------------
// The hover marks are enabledcvar-gated, and UI_GetCvarInt(name, 0) reads an unset cvar as 0
// (uilib/uiwidget.cpp:1709), so they are already hidden before this runs.  Zeroing them
// explicitly makes a re-exec after a session of poking around land on a clean page.
set coop_protoAH1 0
set coop_protoAH2 0
set coop_protoAH3 0
set coop_protoAH4 0
set coop_protoAH5 0
set coop_protoBH1 0
set coop_protoBH2 0
set coop_protoBH3 0
set coop_protoBH4 0
set coop_protoACap ""
set coop_protoAPick ""

// --- the backdrop ---------------------------------------------------------------------------
// coop_protoAArt is THE swappable backdrop: one cvar feeding the one plate widget on each page
// (linkcvar + linkcvartoshader).  Empty means no material is registered and the plate shows its
// own colour field - which is the intended default, because none of the shipped menu art was
// authored to sit behind a menu column.
//
// To try one, from the console while the prototype is open - it swaps live, no reload:
//     set coop_protoAArt main_a                              (retail main-menu plate, Pak0)
//     set coop_protoAArt bigmap_h                            (retail map art, Pak0)
//     set coop_protoAArt textures/mohmenu/briefingroom_a.tga (briefing room, in this mod)
//     set coop_protoAArt ""                                  (back to the colour field)
// Every one of those names already resolves; nothing new is declared, which is deliberate -
// bug-922 is the standing rule that new menu art needs a coop_-prefixed shader over a
// coop-private texture path, and a prototype has no business minting one.
set coop_protoAArt ""

// --- the chrome's own title cvars stay EMPTY --------------------------------------------
// Prototype A declares its own fixed title and strapline over the chrome's sign plate.  If
// these were set as well, both would draw, stacked, in the same rect.
set coop_protoTitle ""
set coop_protoSub ""

// --- register and open ----------------------------------------------------------------------
// The ops page is loaded first so the main page's CONTINUE and OPERATIONS items have somewhere
// to land the moment the menu appears.
loadmenu proto/coop_proto_a_ops
loadmenu proto/coop_proto_a_main
pushmenu coop_proto_a_main
