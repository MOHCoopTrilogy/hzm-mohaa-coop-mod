// ============================================================================================
// MOH Trilogy Coop - open PROTOTYPE B ("Operations board").  PROTOTYPE ONLY.
//
//     exec ui/proto/coop_proto_b_open.cfg
//
// Run it from the MAIN MENU.  It registers the two prototype pages, clears the shared chrome's
// optional title/art cvars, resets the board to its first theatre page, and opens the board.
// Nothing here starts a map, joins a server, or touches a shipped menu file.
//
// WHY "pushmenu main" IS IN THE MIDDLE - this is not decoration.
// UI_LoadMenu calls uWinMan.CreateMenus(), which begins with menuManager.DeleteAllMenus()
// (uilib/uimenu.cpp), and that frees every Menu and CLEARS the menu stack.  So the moment the
// first loadmenu runs, the real main menu is no longer on the stack: pushing the board straight
// afterwards would leave BACK (popmenu 0) with nothing underneath to return to, and you would be
// looking at a cleared black screen with a cursor.  Re-seating "main" first restores the normal
// state - board on top, main menu underneath, BACK returns to it.
//
// The dedup added in uiwinman.cpp:640-658 means re-running this cfg is safe: a second scan's
// duplicate container is dropped and the first copy kept.
//
// If you run this while connected to a game instead, "main" is still what BACK returns to;
// press ESC once more from there to get back to the session.
// ============================================================================================

loadmenu proto/coop_proto_b_board
loadmenu proto/coop_proto_b_brief

// The shared chrome draws an optional title/strapline/backdrop from these three cvars.  Prototype
// B hard-codes its own title over the top, so blank them or a leftover from another prototype
// would draw underneath it.  "0" is not a shader name, so the backdrop registers no material and
// simply draws nothing.
set coop_protoTitle ""
set coop_protoSub ""
set coop_protoArt 0

// Board state.  All four are proto-private and all four are safe to leave lying around.
// The board is designed to be correct with NONE of them set - page 1 is gated on
// "!coop_protoBhide1", which reads 0 when the cvar does not exist - so this block is a reset,
// not a requirement.
set coop_protoBhide1 0
set coop_protoBp2 0
set coop_protoBp3 0
set coop_protoBsel ""
set coop_protoBshot 0
set coop_protoBord 0

pushmenu main
pushmenu coop_proto_b_board
