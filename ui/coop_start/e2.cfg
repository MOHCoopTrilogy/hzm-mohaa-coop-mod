//chrissstrahl - this sets the bt mission 2 maps properties on the menu

exec ui/coop_start/disableInfo.cfg

globalwidgetcommand coop_missionName title "2 Sicily, Operation Husky"

//[user 08-02] Breakthrough Mission 2 briefing - slot 1, mirroring the m-series board (ui/coop_start/m1.cfg).
//NOTE placeholder art: SH/BT shipped FMV briefings and no tile images, so this reuses the
//generic retail briefing-room shader. Dedicated tiles can be dropped in at
//textures/mohmenu/dmloading/briefing/briefinge2.jpg without touching this file again.
globalwidgetcommand coop_startMap1 title "Briefing"
globalwidgetcommand coop_startMap1 shader textures/mohmenu/dmloading/briefing/briefing1
globalwidgetcommand coop_startMap1 stuffcommand "set ui_dmmap briefing/briefinge2;seta coop_mapcmd map briefing/briefinge2"

globalwidgetcommand coop_startMap2 title "e2l1 Sicily"
globalwidgetcommand coop_startMap2 shader textures/mohmenu/dmloading/e2l1
globalwidgetcommand coop_startMap2 stuffcommand "set ui_dmmap e2l1;seta coop_mapcmd map e2l1"

globalwidgetcommand coop_startMap3 title "e2l2"
globalwidgetcommand coop_startMap3 shader textures/mohmenu/dmloading/e2l2
globalwidgetcommand coop_startMap3 stuffcommand "set ui_dmmap e2l2;seta coop_mapcmd map e2l2"

globalwidgetcommand coop_startMap4 title "e2l3"
globalwidgetcommand coop_startMap4 shader textures/mohmenu/dmloading/e2l3
globalwidgetcommand coop_startMap4 stuffcommand "set ui_dmmap e2l3;seta coop_mapcmd map e2l3"

globalwidgetcommand coop_startMap5 shader menu_button_trans
globalwidgetcommand coop_startMap5 stuffcommand ""

