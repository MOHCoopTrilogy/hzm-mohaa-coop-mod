//HZM coop - sets the SH (Spearhead) mission 2 maps on the menu (Phase 3 rollout)
//Only coop-integrated on-foot maps are selectable. t2l2 (halftrack drive) and t2l4
//(KillThePlayer death zones) are NOT yet coop-integrated -> shown disabled.

exec ui/coop_start/disableInfo.cfg

globalwidgetcommand coop_missionName title "Spearhead 2 - The Bridge"

globalwidgetcommand coop_startMap1 title "t2l1 Ardennes"
globalwidgetcommand coop_startMap1 shader textures/mohmenu/dmloading/t2l1
globalwidgetcommand coop_startMap1 stuffcommand "set ui_dmmap t2l1;seta coop_mapcmd map t2l1"

//t2l2 - ENABLED for coop testing (halftrack-drive intro not yet coop-safe; observe then fix)
globalwidgetcommand coop_startMap2 title "t2l2 Halftrack"
globalwidgetcommand coop_startMap2 shader textures/mohmenu/dmloading/t2l2
globalwidgetcommand coop_startMap2 stuffcommand "set ui_dmmap t2l2;seta coop_mapcmd map t2l2"

globalwidgetcommand coop_startMap3 title "t2l3 Bastogne"
globalwidgetcommand coop_startMap3 shader textures/mohmenu/dmloading/t2l3
globalwidgetcommand coop_startMap3 stuffcommand "set ui_dmmap t2l3;seta coop_mapcmd map t2l3"

//t2l4 - ENABLED for coop testing (stuka/death-zone intro not yet coop-safe; observe then fix)
globalwidgetcommand coop_startMap4 title "t2l4 Death Zones"
globalwidgetcommand coop_startMap4 shader textures/mohmenu/dmloading/t2l4
globalwidgetcommand coop_startMap4 stuffcommand "set ui_dmmap t2l4;seta coop_mapcmd map t2l4"

globalwidgetcommand coop_startMap5 title ""
globalwidgetcommand coop_startMap5 shader menu_button_trans
globalwidgetcommand coop_startMap5 stuffcommand ""
