//HZM coop - sets the SH (Spearhead) mission 2 maps on the menu (Phase 3 rollout)
//Only coop-integrated on-foot maps are selectable. t2l2 (halftrack drive) and t2l4
//(KillThePlayer death zones) are NOT yet coop-integrated -> shown disabled.

exec ui/coop_start/disableInfo.cfg

globalwidgetcommand coop_missionName title "Spearhead 2 - The Bridge"

//[user 08-02] Spearhead Mission 2 briefing - slot 1, mirroring the m-series board (ui/coop_start/m1.cfg).
//NOTE placeholder art: SH/BT shipped FMV briefings and no tile images, so this reuses the
//generic retail briefing-room shader. Dedicated tiles can be dropped in at
//textures/mohmenu/dmloading/briefing/briefingt2.jpg without touching this file again.
globalwidgetcommand coop_startMap1 title "Briefing"
globalwidgetcommand coop_startMap1 shader textures/mohmenu/dmloading/briefing/briefing1
globalwidgetcommand coop_startMap1 stuffcommand "set ui_dmmap briefing/briefingt2;seta coop_mapcmd map briefing/briefingt2"

globalwidgetcommand coop_startMap2 title "t2l1 Ardennes"
globalwidgetcommand coop_startMap2 shader ui/coop_tiles/t2l1
globalwidgetcommand coop_startMap2 stuffcommand "set ui_dmmap t2l1;seta coop_mapcmd map t2l1"

//t2l2 - ENABLED for coop testing (halftrack-drive intro not yet coop-safe; observe then fix)
globalwidgetcommand coop_startMap3 title "t2l2 Halftrack"
globalwidgetcommand coop_startMap3 shader ui/coop_tiles/t2l2
globalwidgetcommand coop_startMap3 stuffcommand "set ui_dmmap t2l2;seta coop_mapcmd map t2l2"

globalwidgetcommand coop_startMap4 title "t2l3 Bastogne"
globalwidgetcommand coop_startMap4 shader ui/coop_tiles/t2l3
globalwidgetcommand coop_startMap4 stuffcommand "set ui_dmmap t2l3;seta coop_mapcmd map t2l3"

//t2l4 - ENABLED for coop testing (stuka/death-zone intro not yet coop-safe; observe then fix)
globalwidgetcommand coop_startMap5 title "t2l4 Death Zones"
globalwidgetcommand coop_startMap5 shader ui/coop_tiles/t2l4
globalwidgetcommand coop_startMap5 stuffcommand "set ui_dmmap t2l4;seta coop_mapcmd map t2l4"

globalwidgetcommand coop_startMap6 title ""
globalwidgetcommand coop_startMap6 shader menu_button_trans
globalwidgetcommand coop_startMap6 stuffcommand ""
