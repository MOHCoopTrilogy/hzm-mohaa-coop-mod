//chrissstrahl - this sets the bt mission 1 maps properties on the menu

exec ui/coop_start/disableInfo.cfg

globalwidgetcommand coop_missionName title "1 Battle of Kasserine Pass & Operation Torch"

//[user 08-02] Breakthrough Mission 1 briefing - slot 1, mirroring the m-series board (ui/coop_start/m1.cfg).
//NOTE placeholder art: SH/BT shipped FMV briefings and no tile images, so this reuses the
//generic retail briefing-room shader. Dedicated tiles can be dropped in at
//textures/mohmenu/dmloading/briefing/briefinge1.jpg without touching this file again.
globalwidgetcommand coop_startMap1 title "Briefing"
globalwidgetcommand coop_startMap1 shader textures/mohmenu/dmloading/briefing/briefing1
globalwidgetcommand coop_startMap1 stuffcommand "set ui_dmmap briefing/briefinge1;seta coop_mapcmd map briefing/briefinge1"

