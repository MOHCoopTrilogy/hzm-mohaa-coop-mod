//HZM coop - sets the SH (Spearhead) mission 3 maps on the menu (Phase 3 rollout)
//Both t3 maps carry the coop hook (coop_mod/main.scr::main); selectable.

exec ui/coop_start/disableInfo.cfg

globalwidgetcommand coop_missionName title "Spearhead 3 - The Great Escape"

//[user 08-02] Spearhead Mission 3 briefing - slot 1, mirroring the m-series board (ui/coop_start/m1.cfg).
//NOTE placeholder art: SH/BT shipped FMV briefings and no tile images, so this reuses the
//generic retail briefing-room shader. Dedicated tiles can be dropped in at
//textures/mohmenu/dmloading/briefing/briefingt3.jpg without touching this file again.
globalwidgetcommand coop_startMap1 title "Briefing"
globalwidgetcommand coop_startMap1 shader textures/mohmenu/dmloading/briefing/briefing1
globalwidgetcommand coop_startMap1 stuffcommand "set ui_dmmap briefing/briefingt3;seta coop_mapcmd map briefing/briefingt3"

globalwidgetcommand coop_startMap2 title "t3l1 Barracks"
globalwidgetcommand coop_startMap2 shader ui/coop_tiles/t3l1
globalwidgetcommand coop_startMap2 stuffcommand "set ui_dmmap t3l1;seta coop_mapcmd map t3l1"

globalwidgetcommand coop_startMap3 title "t3l2 Sub Pens"
globalwidgetcommand coop_startMap3 shader ui/coop_tiles/t3l2
globalwidgetcommand coop_startMap3 stuffcommand "set ui_dmmap t3l2;seta coop_mapcmd map t3l2"

globalwidgetcommand coop_startMap4 title ""
globalwidgetcommand coop_startMap4 shader menu_button_trans
globalwidgetcommand coop_startMap4 stuffcommand ""

