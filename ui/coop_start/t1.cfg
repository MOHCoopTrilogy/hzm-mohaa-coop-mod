//HZM coop - sets the SH (Spearhead) mission 1 maps on the menu (Phase 3 rollout)
//Only coop-integrated on-foot maps are selectable. t1l1 (plane-ride cinematic intro) is
//NOT yet coop-integrated -> shown disabled.

exec ui/coop_start/disableInfo.cfg

globalwidgetcommand coop_missionName title "Spearhead 1 - A Storm in the Port"

//[user 08-02] Spearhead Mission 1 briefing - slot 1, mirroring the m-series board (ui/coop_start/m1.cfg).
//NOTE placeholder art: SH/BT shipped FMV briefings and no tile images, so this reuses the
//generic retail briefing-room shader. Dedicated tiles can be dropped in at
//textures/mohmenu/dmloading/briefing/briefingt1.jpg without touching this file again.
globalwidgetcommand coop_startMap1 title "Briefing"
globalwidgetcommand coop_startMap1 shader textures/mohmenu/dmloading/briefing/briefing1
globalwidgetcommand coop_startMap1 stuffcommand "set ui_dmmap briefing/briefingt1;seta coop_mapcmd map briefing/briefingt1"

//t1l1 - coop paratroop drop (coop-safe plane-ride: all players ride + jump, host does the barn crash)
globalwidgetcommand coop_startMap2 title "t1l1 Night Drop"
globalwidgetcommand coop_startMap2 shader ui/coop_tiles/t1l1
globalwidgetcommand coop_startMap2 stuffcommand "set ui_dmmap t1l1;seta coop_mapcmd map t1l1"

globalwidgetcommand coop_startMap3 title "t1l2 Verviers"
globalwidgetcommand coop_startMap3 shader ui/coop_tiles/t1l2
globalwidgetcommand coop_startMap3 stuffcommand "set ui_dmmap t1l2;seta coop_mapcmd map t1l2"

globalwidgetcommand coop_startMap4 title "t1l3 Malmedy"
globalwidgetcommand coop_startMap4 shader ui/coop_tiles/t1l3
globalwidgetcommand coop_startMap4 stuffcommand "set ui_dmmap t1l3;seta coop_mapcmd map t1l3"

globalwidgetcommand coop_startMap5 title ""
globalwidgetcommand coop_startMap5 shader menu_button_trans
globalwidgetcommand coop_startMap5 stuffcommand ""

globalwidgetcommand coop_startMap6 title ""
globalwidgetcommand coop_startMap6 shader menu_button_trans
globalwidgetcommand coop_startMap6 stuffcommand ""
