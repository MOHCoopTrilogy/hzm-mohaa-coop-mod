//HZM coop - sets the SH (Spearhead) mission 1 maps on the menu (Phase 3 rollout)
//Only coop-integrated on-foot maps are selectable. t1l1 (plane-ride cinematic intro) is
//NOT yet coop-integrated -> shown disabled.

exec ui/coop_start/disableInfo.cfg

globalwidgetcommand coop_missionName title "Spearhead 1 - A Storm in the Port"

//t1l1 - coop paratroop drop (coop-safe plane-ride: all players ride + jump, host does the barn crash)
globalwidgetcommand coop_startMap1 title "t1l1 Night Drop"
globalwidgetcommand coop_startMap1 shader ui/coop_tiles/t1l1
globalwidgetcommand coop_startMap1 stuffcommand "set ui_dmmap t1l1;seta coop_mapcmd map t1l1"

globalwidgetcommand coop_startMap2 title "t1l2 Verviers"
globalwidgetcommand coop_startMap2 shader ui/coop_tiles/t1l2
globalwidgetcommand coop_startMap2 stuffcommand "set ui_dmmap t1l2;seta coop_mapcmd map t1l2"

globalwidgetcommand coop_startMap3 title "t1l3 Malmedy"
globalwidgetcommand coop_startMap3 shader ui/coop_tiles/t1l3
globalwidgetcommand coop_startMap3 stuffcommand "set ui_dmmap t1l3;seta coop_mapcmd map t1l3"

globalwidgetcommand coop_startMap4 title ""
globalwidgetcommand coop_startMap4 shader menu_button_trans
globalwidgetcommand coop_startMap4 stuffcommand ""

globalwidgetcommand coop_startMap5 title ""
globalwidgetcommand coop_startMap5 shader menu_button_trans
globalwidgetcommand coop_startMap5 stuffcommand ""
