// Clear the FIT-TUNE fast-nudge key binds (developer tool) and disarm the Armory DONE hook.  [bug-3299]
// Reached only through alias coop_fitUnbind, which ui/loadout/fitbinds.cfg arms; ui/loadout/fitunbind.cfg (run by
// the Armory's DONE button every time) calls that alias, so DONE only unbinds keys the fit panel actually bound.
unbind LEFTARROW
unbind RIGHTARROW
unbind UPARROW
unbind DOWNARROW
unbind KP_PGUP
unbind KP_PGDN
unbind "="
unbind "-"
unbind "["
unbind "]"
unbind ";"
unbind "'"
unbind ","
unbind "."
unbind \
alias coop_fitUnbind ""
