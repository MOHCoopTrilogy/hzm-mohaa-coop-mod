// GENERATED - open the armory: seed view state, push the menu, ping the bus.
// [bug-2080] seed the GLOVES row cvars so the label and prev/next execs exist the
// first time the armory opens. The server re-pushes the archived pick right after;
// without this the row would render blank until the player touched it.
exec ui/loadout/glove/g00.cfg
// [loadout review 2026-10-15] the glove seed runs FIRST so the shared EQUIPPED/LOCKED caption ends on the uniform/helmet page init.cfg replays,
// not on the glove seed page (the caption used to read "GLOVES EQUIPPED" on every open).
exec ui/loadout/init.cfg
// [done gate 2026-10-15] start the DONE verdict clean; the server re-asserts a locked pick right after the open token.
set coop_loDnShow 0
set coop_loDnNop 0
set coop_loDnSv "set coop_loDnNop 0"
pushmenu coop_loadout
append name ,w0o

