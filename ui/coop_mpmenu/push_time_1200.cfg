// HZM MP bridge cfg - MP-OWNED (ui/coop_mp*/**), so it may set coop_mp* cvars. Named from a COOP-classified
// stock-format setup screen only via the legal "coop_mpmenu" path token (check_mp_isolation clause 7). It sets
// the coop_mp* host cvar AND its ui_mp* readout mirrors together (the board's linkcvar reads a mirror; ui_mp* is
// not a coop_mp* token). Written ONLY here, together, so the board always shows the real value. No vstr (clause 18).
set coop_mpPushTime 1200
set ui_mpPushTime 1200
set ui_mpPushMin 20
