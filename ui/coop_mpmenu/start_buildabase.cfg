// HZM MP - open the stock-format ART_TEAM board (mod override, same menu id) with buildabase preselected.
// MP-OWNED; named from the coop screen only via "coop_mpmenu". Sets ONLY the mode + the ui_mpIs* gating
// flags + a default map + the arena gate. It does NOT reset coop_mpPreset / coop_mpHardcore / coop_mpBotFill
// or the mode-specific coop_mp* cvars, so a host's settings persist across setup visits. Team build-and-fight (gt2).
set coop_mpMode buildabase
set ui_mpIsGungame 0
set ui_mpIsKoth 0
set ui_mpIsLms 0
set ui_mpIsFreezetag 0
set ui_mpIsPush 0
set ui_mpIsDemolition 0
set ui_mpIsCtf 0
set ui_mpIsBuildabase 1
set ui_mpIsBaseassault 0
// [2026-09-16] Build-A-Base loads the REAL alienx basebuild mod, whose station data is authored for the
// mohdm* deathmatch maps + SP campaign maps - NOT the dm/mp_* Spearhead maps the stock browser lists (those
// carry no station data, so the old dm/mp_* default spawned nothing: bug-2668). It runs those maps as
// script-less MP arenas via sv_mpForceArena. ui_mpIsArena lights the "Campaign Maps" button -> the shared
// 18-map picker hzm_arenamaps. Default to mohdm1 (a deathmatch map with its own bsp spawns) + arm the arena
// gate, so Start Game works immediately; the picker re-arms + changes the map.
set ui_mpIsArena 1
set sv_mpForceArena 1
set ui_dmmap mohdm1
pushmenu multiplayerstart_team
