// HZM MP - open the stock-format ART_TEAM board (mod override, same menu id) with koth preselected.
// MP-OWNED; named from the coop screen only via "coop_mpmenu". Sets ONLY the mode + the ui_mpIs* gating
// flags (exactly one set) + a default map/rotation. It does NOT reset coop_mpPreset / coop_mpHardcore /
// coop_mpBotFill or the mode-specific coop_mp* cvars, so a host's settings persist across setup visits; the
// board reads the ui_mp* mirrors (or the engine-default readout titles when never set). Team-based (gt2); the board shows KOTH Score Limit + Imperative.
set coop_mpMode koth
set ui_mpIsGungame 0
set ui_mpIsKoth 1
set ui_mpIsLms 0
set ui_mpIsFreezetag 0
set ui_mpIsPush 0
set ui_mpIsDemolition 0
set ui_mpIsCtf 0
set ui_dmmap dm/mohdm2
set ui_maplist_team "dm/mohdm2 dm/mohdm4 dm/mohdm6 obj/mp_bologna_obj"
pushmenu multiplayerstart_team
