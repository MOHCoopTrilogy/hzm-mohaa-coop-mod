// HZM MP - open the stock-format ART_TEAM board (mod override, same menu id) with push preselected.
// MP-OWNED; named from the coop screen only via "coop_mpmenu". Sets ONLY the mode + the ui_mpIs* gating
// flags (exactly one set) + a default map/rotation. It does NOT reset coop_mpPreset / coop_mpHardcore /
// coop_mpBotFill or the mode-specific coop_mp* cvars, so a host's settings persist across setup visits; the
// board reads the ui_mp* mirrors (or the engine-default readout titles when never set). Push (gt2); the board shows Capture Time. Runs on generic gt2 maps for now.
set coop_mpMode push
set ui_mpIsArena 0
// [2026-09-15] Push can run on the 7 converted SP campaign maps (arm via the map picker's Push section);
// start clean so a stale arena flag never carries in (it is consumed at map load anyway).
set sv_mpForceArena 0
set ui_mpIsGungame 0
set ui_mpIsKoth 0
set ui_mpIsLms 0
set ui_mpIsFreezetag 0
set ui_mpIsPush 1
set ui_mpIsDemolition 0
set ui_mpIsCtf 0
set ui_mpIsBuildabase 0
set ui_mpIsBaseassault 0
set ui_dmmap dm/mp_bazaar_dm
set ui_maplist_team "dm/mp_bazaar_dm dm/mp_brest_dm dm/mp_stadt_dm dm/mp_holland_dm dm/mp_bahnhof_dm dm/mp_gewitter_dm dm/mp_malta_dm dm/mp_unterseite_dm dm/mp_verschneit_dm"
pushmenu multiplayerstart_team
