// HZM MP - open the stock-format ART_TEAM board (mod override, same menu id) with prophunt preselected.
// MP-OWNED; named from the coop screen only via "coop_mpmenu". Sets ONLY the mode + zeroes the other
// modes' ui_mpIs* gating flags (so a Push / Base Assault campaign-maps button left enabled by a previous
// selection is cleared) + a default map/rotation. Prop Hunt has no board rows of its own, so it needs no
// ui_mpIs flag; it plays on standard team maps (AXIS = props, ALLIES = hunters). It does NOT reset
// coop_mpPreset / coop_mpHardcore / coop_mpBotFill or the mode-specific coop_mp* cvars, so a host's
// settings persist across setup visits.
set coop_mpMode prophunt
set ui_mpIsArena 0
set ui_mpIsGungame 0
set ui_mpIsKoth 0
set ui_mpIsLms 0
set ui_mpIsFreezetag 0
set ui_mpIsPush 0
set ui_mpIsDemolition 0
set ui_mpIsCtf 0
set ui_mpIsBuildabase 0
set ui_mpIsBaseassault 0
set ui_dmmap dm/mp_bazaar_dm
set ui_maplist_team "dm/mp_bazaar_dm dm/mp_brest_dm dm/mp_stadt_dm dm/mp_holland_dm dm/mp_bahnhof_dm dm/mp_gewitter_dm dm/mp_malta_dm dm/mp_unterseite_dm dm/mp_verschneit_dm"
pushmenu multiplayerstart_team
