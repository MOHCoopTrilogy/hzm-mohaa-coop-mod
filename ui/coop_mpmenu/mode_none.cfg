// HZM MP - reset the MP game mode to none (plain stock behaviour). Exec'd by the STANDARD MULTIPLAYER buttons
// on ui/multiplayerstart.urc before they push a stock-format board. Clears ALL ui_mpIs* gating flags so the
// shared boards show no mode-specific HZM rows. Does NOT reset the Weapon Preset (it applies to standard modes
// too). MP-OWNED; named from the coop file only via "coop_mpmenu".
set coop_mpMode none
set ui_mpIsGungame 0
set ui_mpIsKoth 0
set ui_mpIsLms 0
set ui_mpIsFreezetag 0
set ui_mpIsPush 0
set ui_mpIsDemolition 0
set ui_mpIsCtf 0
