// HZM MP - reset the MP game mode to none (plain Deathmatch / stock behaviour). Exec'd by the STANDARD
// MULTIPLAYER (vanilla) buttons on ui/multiplayerstart.urc before they push a stock server-setup screen, so a
// prior HZM-mode pick (coop_mpMode) does not carry into a vanilla launch. MP-OWNED, so it may set coop_mpMode;
// named from the coop file only via the legal "coop_mpmenu" token (isolation clause 7). Mode-only - the vanilla
// screens own g_gametype via their own ui_startdmmap.
set coop_mpMode none
