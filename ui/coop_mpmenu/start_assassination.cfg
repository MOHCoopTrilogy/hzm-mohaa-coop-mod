// HZM MP - open the stock-format ART_TEAM board (mod override, same menu id) with Assassination preselected.
// MP-OWNED; named from the coop screen only via "coop_mpmenu". Sets ONLY the mode + the ui_mpIs* gating
// flags + a default map/rotation. It does NOT reset coop_mpPreset / coop_mpHardcore / coop_mpBotFill.
// [2026-09-16] Assassination (gt2) - one team has a marked VIP (compass points to them); the other hunts and
// eliminates them. Hunters score on each VIP kill; the VIP side scores for keeping the VIP alive. Built on
// our framework (VIP survival), inspired by Mefy's Assassination. Runs on the standard gt2 team maps.
set coop_mpMode assassination
set ui_mpIsArena 0
set ui_mpIsGungame 0
set ui_mpIsKoth 0
set ui_mpIsLms 0
set ui_mpIsFreezetag 0
set ui_mpIsPush 0
set ui_mpIsDemolition 0
set ui_mpIsCtf 0
set ui_mpIsBuildabase 0
set ui_mpIsBaseassault 0
set ui_dmmap dm/mp_bazaar_dm
set ui_maplist_team "dm/mp_bazaar_dm dm/mp_brest_dm dm/mp_stadt_dm dm/mp_holland_dm dm/mp_bahnhof_dm dm/mp_gewitter_dm dm/mp_malta_dm dm/mp_unterseite_dm dm/mp_verschneit_dm"
pushmenu multiplayerstart_team
