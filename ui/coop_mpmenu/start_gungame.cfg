// HZM MP - open the shared setup screen with Gun Game preselected. MP-OWNED (ui/coop_mp*/**), so it may
// set coop_mpMode. Named from the COOP file ui/multiplayerstart.urc, whose only coop_mp* token there is the
// legal "coop_mpmenu" (check_mp_isolation clause 7). Gun Game runs FFA -> launch gametype 1.
set coop_mpMode gungame
set ui_dmmap dm/mohdm1
set ui_mpGt1 1
set ui_mpGt2 0
set ui_mpGt4 0
pushmenu coop_mpmenu
