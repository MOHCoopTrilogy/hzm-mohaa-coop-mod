// HZM MP - open the stock-format ART_FFA board (mod override, same menu id) with gungame preselected.
// MP-OWNED; named from the coop screen only via "coop_mpmenu". Sets ONLY the mode + the ui_mpIs* gating
// flags (exactly one set) + a default map/rotation. It does NOT reset coop_mpPreset / coop_mpHardcore /
// coop_mpBotFill or the mode-specific coop_mp* cvars, so a host's settings persist across setup visits; the
// board reads the ui_mp* mirrors (or the engine-default readout titles when never set). Gun Game runs FFA (gt1); the board hides Weapon Preset and shows Kills/Tier.
set coop_mpMode gungame
set ui_mpIsGungame 1
set ui_mpIsKoth 0
set ui_mpIsLms 0
set ui_mpIsFreezetag 0
set ui_mpIsPush 0
set ui_mpIsDemolition 0
set ui_mpIsCtf 0
set ui_dmmap dm/mohdm1
set ui_maplist_ffa "dm/mohdm1 dm/mohdm2 dm/mohdm3 dm/mohdm4 dm/mohdm6"
pushmenu multiplayerstart_ffa
