// HZM MP bridge cfg - MP-OWNED (ui/coop_mp*/**), so it may set coop_mp* cvars. Named from a COOP-classified
// stock-format setup screen (ui/multiplayerstart_*.urc) only via the legal "coop_mpmenu" path token
// (check_mp_isolation clause 7). It sets the coop_mp* host cvar AND a ui_mp* mirror the coop screen reads back
// with linkcvar/enabledcvar (ui_mp* is not a coop_mp* token, so a coop file may name it). No vstr (clause 18).
set coop_mpPreset rifles
set ui_mpPreset rifles
