// HZM MP - open the stock-format ART_TEAM board (mod override, same menu id) with Search & Destroy
// preselected. MP-OWNED; named from the coop screen only via "coop_mpmenu". Sets ONLY the mode + the
// ui_mpIs* gating flags + a default map + the arena gate. It does NOT reset coop_mpPreset / coop_mpHardcore /
// coop_mpBotFill.
// [2026-09-16, bug-2668] S&D now LOADS the real UberMod Search & Destroy (ubermode/cybersnd.scr) - a gt2
// team bomb mode - on its authored bomb maps (mohdm* + reused-spawn SP campaign maps), run as script-less MP
// arenas via sv_mpForceArena. It used to open the gt4 obj board with dataless dm/mp_* maps; that stock-gt4
// reimplementation was replaced. ui_mpIsArena lights the shared "Campaign Maps" picker (hzm_arenamaps).
set coop_mpMode snd
set ui_mpIsGungame 0
set ui_mpIsKoth 0
set ui_mpIsLms 0
set ui_mpIsFreezetag 0
set ui_mpIsPush 0
set ui_mpIsDemolition 0
set ui_mpIsCtf 0
set ui_mpIsBuildabase 0
set ui_mpIsBaseassault 0
set ui_mpIsArena 1
set sv_mpForceArena 1
set ui_dmmap mohdm1
pushmenu multiplayerstart_team
