// HZM MP - LAUNCH an FFA server (g_gametype 1). coop_mpMode was set by the mode button and persists to the
// map load, where mp.scr reads it; ui_dmmap holds the chosen stock MP map. ui_startdmmap (cl_ui.cpp
// UI_StartDMMap_f) takes the gametype as arg 1, seeds dedicated/maxclients/hostname/teamdamage from these ui_
// cvars, sets g_gametype, then issues `map <ui_dmmap>` - the proven MP listen-server launch (no vstr, clause 18).
set ui_dedicated 0
set ui_maxclients 12
set ui_hostname "HZM Multiplayer"
ui_startdmmap 1
