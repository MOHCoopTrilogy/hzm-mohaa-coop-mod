// HZM MP - open the stock-format ART_OBJ board (mod override, same menu id) with demolition preselected.
// MP-OWNED; named from the coop screen only via "coop_mpmenu". Sets ONLY the mode + the ui_mpIs* gating
// flags (exactly one set) + a default map/rotation. It does NOT reset coop_mpPreset / coop_mpHardcore /
// coop_mpBotFill or the mode-specific coop_mp* cvars, so a host's settings persist across setup visits; the
// board reads the ui_mp* mirrors (or the engine-default readout titles when never set). Objective bomb rounds (gt4); the board shows Round Time.
set coop_mpMode demolition
set ui_mpIsGungame 0
set ui_mpIsKoth 0
set ui_mpIsLms 0
set ui_mpIsFreezetag 0
set ui_mpIsPush 0
set ui_mpIsDemolition 1
set ui_mpIsCtf 0
set ui_dmmap obj/mp_bologna_obj
set ui_maplist_obj "obj/mp_bologna_obj obj/mp_palermo_obj obj/mp_castello_obj"
pushmenu multiplayerstart_obj
