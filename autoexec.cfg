// HZM Extended Coop Mod
// All coop keybinds are configured through Options > Controls
// [user 07-18] coop_active is a coop-session flag other systems read. The in-game ESC menu was
// REVERTED to the stock MP menu for all sessions (the coop_dm_main override caused an unresolved
// doubled/garbled ESC-menu bug over 6 rounds; ui/coop_dm_main.urc deleted, engine routing removed).
// Loadout access lives on the main-menu ARMORY button + the lobby LOADOUT button. This flag stays
// (detect.cfg still sets it 1 on coop join) for non-menu consumers. Runtime `set` (NOT archived).
set coop_active 0
set coop_mpmenu 1
// ===== DEV CONSOLE ACCESS (rcon) - localhost only; autoexec is untracked so this stays out of the public repo =====
// Lets the dev tooling drive this listen server (send console commands + read qconsole.log) instead of asking
// the host to type debug cvars by hand. rcon target = 127.0.0.1:12203 (net_port default). Session-only (set).
set rconpassword "hzmdev"
// Dev diagnostics for the mission-item / gear-loss hunt: RETIRED 07-19 (gear fixes confirmed live).
// The KITHOLD/verdict probes issue `use` commands right after respawn - needless churn in the
// post-blast entity storm (bug-919 context). Re-enable only for a fresh gear investigation.
set coop_missionItemDebug 0
// Player run speed multiplier. 1.0 = vanilla MP (too fast for coop). 0.6 = a calmer, more tactical pace.
// Live-tunable: type `set sv_dmspeedmult 0.6` in the console to test without relaunching.
set sv_dmspeedmult 0.6
// Down-But-Not-Out ON. Forced here because the map-test cfgs used to `seta coop_dbno 0` (archived), which
// stuck DBNO off in omconfig; autoexec runs after the config so this re-enables it every launch. Maptest
// cfgs now use session-only `set` so they no longer pollute the saved config. 0 = off (instant death).
seta coop_dbno 1
// CONSOLE AT LAUNCH FIX: the engine auto-closes the console during the loading screen ONLY when engine
// `developer` is 0 (cl_ui.cpp UI_DrawHud). A stuck `seta developer "1"` in the profile config left the
// console dropped over the Field Report at every launch. Force it off here (autoexec runs after the profile
// config, same trick as coop_dbno above). Coop's own dev tools use the SEPARATE `coop_dev` cvar, so nothing
// coop-related is lost; if you ever need engine developer spew for a test, `set developer 1` in-console for
// that session.
seta developer 0
// [TEMP debug session 2026-07-19] developer 1 so script `println` / ^~^~^ checkpoints reach qconsole.log
// (ScriptThread::Println is developer-gated - scriptthread.cpp:2869 returns early when developer==0, which is
// why every coop debug/checkpoint print was invisible). `set` (not seta) = NOT saved to omconfig; REVERT by
// deleting this line once debugging is done. Side effect: the console drops over the loading screen while on.
set developer 1
// [wall-probe v5 2026-07-21] HUD echo for every wall detection (2 = detect + on-screen
// confirmation; 1 = log-only; 0 = off). markwall / killwall are bindable console commands:
//   bind b "markwall"   - forensic report of whatever you aim at (safe, report-only)
//   bind n "killwall"   - KILL the aimed invisible wall live + persist (refuses visible geometry)
// If a visible wall ever goes ghost after a kill: cm_restorebrush <brushnum> (number is on the HUD line).
seta coop_wallProbe 0
// SKIP EA/2015/legal STARTUP INTRO: cl_playintro defaults to "1" and is NOT archived, so it resets to 1
// every launch and CL_TryStartIntro (cl_ui.cpp) replays EAlogo.RoQ + 2015intro.RoQ + intro.RoQ each time.
// Forcing it 0 here (autoexec runs before UI_Init) makes launch go straight to the main menu. No rebuild.
seta cl_playintro 0
// REPORT A BUG: load the Discord webhook (kept OUT of the public pk3 - it's a loose maintt/ file the
// installer/updater writes from updater.ini). Missing file = the in-game reporter just says "not configured".
exec coop_reportwebhook.cfg
// SCREENSHOT FIX: Windows PrintScreen captures the DISPLAYED (front) buffer, which is ~1 frame behind the
// frame the game is actively rendering (back buffer) - so a PrintScreen right after a menu change grabs the
// PRIOR screen. The game's own screenshot reads the current (back) buffer, so it's always correct. Bind the
// PrintScreen key to the game's screenshot: pressing PrtScn now also saves a CORRECT capture to
// <homepath>/maintt/screenshots/shotNNNN.jpg (use that file; the Windows clipboard copy stays stale).
bind PRINT "screenshotJPEG"
seta r_screenshotJpegQuality 95
// [user 07-12] ENGINE-NATIVE VIDEO RECORDING (demo -> AVI). Workflow:
//   F9  = toggle DEMO recording while you play (tiny file, ~zero perf cost; overwrites demos/lastclip)
//   F10 = render that demo to an AVI: replays it and auto-starts the dump on its first frame
//         (activeAction fires once playback is live). NOTE: F10 leaves your current game to play the demo -
//         render AFTER the session. Output auto-numbers videos/videoNNNN.avi (never overwrites).
//   F11 = finish the render (stopvideo) and return to the menu.
// 60fps Motion-JPEG; the engine locks the sim to cl_aviFrameRate during the dump, so the AVI is
// glass-smooth even if rendering is slow. AVIs are LARGE - transcode to mp4 after (e.g. HandBrake).
// cl_forceavidemo stays 0 so loading-screen frames are skipped (capture gates on CA_ACTIVE).
seta cl_aviFrameRate 60
seta cl_aviMotionJpeg 1
seta cl_forceavidemo 0
set clip_start "record lastclip; set clip_toggle vstr clip_stop; echo ^2[REC] recording demo -> demos/lastclip  (F9 again to stop)"
set clip_stop  "stoprecord; set clip_toggle vstr clip_start; echo ^1[REC] demo recording STOPPED  (F10 renders it to AVI)"
set clip_toggle "vstr clip_start"
bind F9  "vstr clip_toggle"
bind F10 "set activeAction video; demo lastclip; echo ^3[REC] rendering lastclip -> videos/videoNNNN.avi  (F11 to finish)"
bind F11 "stopvideo; disconnect; echo ^2[REC] AVI saved to homepath maintt/videos/"
// 3D GRASS (renderergl1): procedural blades scattered on grass-flagged/named ground (terrain heightmap
// patches + BSP faces), drawn within r_grassRadius with wind sway + a distance fade. On by default, with an
// on/off box in Options > Video; toggling it applies live (no map reload needed). r_grassRadius = draw
// distance; r_grassDensity = blades/area; r_grassHeight; r_grassWind = sway; r_grassMaxDraw = per-frame cap.
// DISABLED by default (user: "completely remove 3d grass its no good"). Set r_grass 1 to bring it back.
// r_grass: default relocated to coop_defaults.cfg so your changes persist across restart.
seta r_grassRadius 1280
seta r_grassDensity 0.004
seta r_grassHeight 16
seta r_grassWind 2.5
seta r_grassMaxDraw 16000
// CONTROL SCHEME (defaults; all rebindable in Options > Controls). F is now the official USE key (fully
// replaces the old E=use); Q/E lean left/right (works while aiming). Walk is on ALT (+button12), sprint on
// SHIFT (see the sprint block below). These just set defaults - the player can remap any of them in-game.
bind f "+use"
bind q "+leanleft"
bind e "+leanright"

// Coop ADS (aim down sights): hold RIGHT MOUSE to raise the gun to the sights (statemap "charge"
// aim pose) + an FOV zoom (cgame CG_CalcFov). cg_adsZoom = fov multiplier while RMB held: 1.0 = off
// (raise only), lower = more zoom. The engine now renders the view weapon with its OWN un-zoomed fov
// (renderergl1 weaponProjectionMatrix, fed by r_weaponfovx from cgame), so the gun stays a constant
// size and no longer falls off the screen even at a strong zoom. 0.75 = a solid ~25% ADS zoom.
seta cg_adsZoom 0.5
// How much the GUN itself zooms with the world in ADS: 0 = gun stays normal size (never clips, but
// looks small/far against the zoomed world); 1 = gun zooms fully (sights align but the rear can clip
// off-screen). 0.5 = a closer/bigger gun with sights mostly aligned. Dial up for closer, down if the
// gun's rear clips. Live-tunable; no relaunch needed.
seta cg_adsGunZoom 0.3
// ADS view-weapon near-clip: how much of the gun's back end shows in ADS (lower = more shows). 1 is the
// baked-in default that keeps the whole weapon visible without slicing the rear.
seta r_weaponznear 1
// ADS sight alignment - slide the whole weapon view (hands + gun) on screen (only while aiming) to line the
// iron sights up with the centre. cg_adsShiftY: negative = UP, positive = DOWN. cg_adsShiftX: + = right,
// - = left. cg_view feeds these into the renderer's r_weaponshiftx/y each frame; while crouched it ALSO
// adds cg_adsCrouchShiftX/Y (below). Live-tunable (no relaunch).
seta cg_adsShiftX 0
seta cg_adsShiftY -0.1
// ADS iron-sight PITCH/YAW/ROLL (degrees) - tilt (up/down), angle (left/right), and un-tilt (roll) the gun
// about the grip so the REAR aperture lines up with the FRONT post. A flat screen-shift (above) moves both
// sights together and can't do this. PER-GUN pitch/yaw are baked into the engine (Thompson/BAR/pistols
// dialled in); these cvars are the FALLBACK for any gun not yet in that table. To dial a new gun: aim it,
// set cg_adsPitch/cg_adsYaw/cg_adsRoll until the sights line up, then tell me the values to bake per-gun.
seta cg_adsPitch 1
seta cg_adsYaw 0
seta cg_adsRoll 0
// ADS LEAN: how much leaning (Q/E) moves the CAMERA while aiming. cg_adsLeanShift = the sideways PEEK (1.0 =
// full peek out from cover, same as hip; lower keeps the sights centred but you barely peek). cg_adsLeanRoll
// = the view TILT while leaning+ADS. Both FORCED to 1.0 here so the camera actually peeks when you lean in
// ADS (they weren't set in this cfg, so an old saved value was leaving the camera stuck while only the gun
// tilted). Drop cg_adsLeanShift toward 0 if the sights slide too far off-screen at full lean.
seta cg_adsLeanShift 1.0
seta cg_adsLeanRoll 1.0
// CROUCH-only ADS correction. The crouch pose hunches the body and pulls the gun down/left/tilted off
// the standing sight line. These add EXTRA rotation (about the grip, so the hands stay attached) ONLY
// while crouched. Crouch + aim, then dial: cg_adsCrouchPitch (sights up/down), cg_adsCrouchYaw (left/
// right), cg_adsCrouchRoll (un-tilt) until the crouched picture matches standing; tell me the values.
seta cg_adsCrouchPitch 0
seta cg_adsCrouchYaw 0
seta cg_adsCrouchRoll 0
// CROUCH-only screen shift: slide the whole weapon view (hands + gun) toward centre while crouched, ADDED
// on top of the standing cg_adsShiftX/Y. cg_adsCrouchShiftY: - = up / + = down ; cg_adsCrouchShiftX: + =
// right / - = left. This is the one to use when the crouched gun sits low/off-centre. Live-tunable.
seta cg_adsCrouchShiftX 0
seta cg_adsCrouchShiftY 0
// ADS: hide the support (off) hand while aiming. The raised aim poses bake the off-hand for a different
// gun's foregrip, so on many weapons it hovers off the gun; hiding it leaves a clean trigger-hand + gun
// sight picture (your raise + per-gun tuning are untouched). 1 = hide (default), 0 = show the off-hand.
seta cg_adsHideOffHand 1
// ADS immersion: weapon SWAY (gentle breathing drift while aiming) + RECOIL (the gun kicks up/back on each
// shot, then recovers). Both move only the view weapon, never your actual aim/bullets. Recoil is scaled per
// weapon class (pistols light, rifles/MGs heavy). cg_adsSway = drift amount (units, 0 = off), cg_adsSwaySpeed
// = breathing rate, cg_adsRecoil = kick strength (0 = off). Live-tunable.
seta cg_adsSway 0.1
seta cg_adsSwaySpeed 1.0
seta cg_adsRecoil 1
// STAGED THIRD-PERSON ADS (only matters with cg_3rd_person 1): holding aim no longer snaps straight to
// first person - the chase camera EASES into an over-the-RIGHT-SHOULDER aim view (crosshair stays up).
// While still holding aim, MOUSE WHEEL UP goes into the full first-person iron sights (wheel DOWN returns
// to the shoulder view); releasing aim eases quickly back to the normal chase camera. The wheel only does
// this while aiming - weapon next/prev work normally otherwise. cg_adsShoulder 0 = old instant snap.
// Shoulder framing (live-tunable): Dist = camera pull-back (units), Side = right-shoulder offset,
// Up = camera height over the head pivot. Speed = transition rate (higher = snappier; release is 1.5x).
// cg_adsShoulderZoom = mild fov tighten in the shoulder view (1 = none). cg_adsFpFlip = how far along the
// wheel-up fly-in the view flips to first person (0..1, lower = earlier flip).
seta cg_adsShoulder 1
seta cg_adsShoulderDist 30
seta cg_adsShoulderSide 30
seta cg_adsShoulderUp 0
seta cg_adsShoulderZoom 0.9
seta cg_adsShoulderSpeed 10
seta cg_adsFpFlip 0.7
// 3RD PERSON FREE CAM (only matters with cg_3rd_person 1): the mouse orbits the camera FREELY around
// your character - all the way around, front included - WITHOUT turning them; the soldier keeps facing
// where he was and WASD moves relative to HIS facing (strafe/backpedal). No crosshair while orbiting
// (the camera isn't your aim). HOLD the aim button to shoot: the mouse takes back your aim and the
// camera eases behind the shoulder (the normal over-the-shoulder aim view, true-aim crosshair and all);
// release to orbit again. Toggle lives in Options -> Advanced ("3rd Person Free Cam") or set cg_freecam
// here. cg_freecamDist = orbit distance from the character (chase cam is cg_cameradist). Live-tunable.
// cg_freecam: default relocated to coop_defaults.cfg so your changes persist across restart.
seta cg_freecamDist 100
// FREE CAM MOVEMENT (modern third-person / GTA-Souls scheme): standing still, the mouse orbits the camera
// freely around your soldier. The moment you press a movement key, the body turns to face the camera
// direction and runs that way - so while walking you steer your character WITH the camera. cl_freecamAutoFace
// 1 = on (this modern scheme), 0 = old orbit-only (WASD relative to the frozen facing). Turn rate below.
seta cl_freecamAutoFace 1
seta cl_freecamTurnRate 480
// 3P TRUE-AIM CROSSHAIR: in third person the crosshair is re-projected onto the point the bullet will
// actually hit (traced from the eye along the real fire direction), so it is exact at any range even
// with the offset shoulder camera. 0 = old screen-centre crosshair.
seta cg_crosshair3p 1
// CROSSHAIR SIZE: scales the crosshair art in-game. 1 = native size. Slider lives in Options -> Advanced
// ("Crosshair Size"). Range 0.5 (half) .. 2.5 (2.5x). Engine scales it in CG_DrawCrosshair and re-centres
// on the true aim point, so the 3P true-aim projection stays accurate at any size.
// cg_crosshairSize: default relocated to coop_defaults.cfg so your changes persist across restart.
// 3P SHOULDER-AIM WALK multiplier: 1.0 = shoulder-aim movement is EXACTLY regular ADS speed
// (user call 2026-07-06: the 0.6 aimed-walk felt far too slow in all directions). Lower below 1
// only if you want a deliberate slow aimed walk in the shoulder view.
seta coop_adsSpeedMult3p 1.0
// HUD FADE: the health + ammo panels fade out after coop_hudFadeTime quiet seconds and fade back in
// instantly on activity: firing, aiming (ADS), taking fire/damage, ammo/weapon changes, pickups, and
// objective updates. Below 25% health the HUD never hides. The COMPASS always stays visible.
// coop_hudFade 0 = classic always-on HUD.
seta coop_hudFade 1
seta coop_hudFadeTime 5
// SNIPER SCOPE sway: while scoped (native zoom), the gun is hidden behind the scope, so the sway wobbles the
// VIEW so the scope picture gently wanders. cg_scopeSway = magnitude in DEGREES (0 = off). Holding breath
// (Shift) steadies it AND removes the wander, so a held-breath shot is dead-on. Rifles only (not binoculars).
seta cg_scopeSway 0.25
// WEAPON WEIGHT / LAG: the gun trails the camera when you turn, then springs back to rest, for a sense of
// mass. Visual only (never affects aim/bullets). cg_weaponLag = trail amount in units per degree of look (0 =
// off); cg_weaponLagMax = clamp; cg_weaponLagStiffness = spring rate (higher = snappier/lighter, lower =
// heavier/slower); cg_weaponLagADS = lag scale while aiming (lower = stiffer in ADS). Per-class weight is
// automatic (pistols snappy -> MGs heavy); scoped snipers skip it. All live-tunable.
// cg_weaponLag: default relocated to coop_defaults.cfg so your changes persist across restart.
seta cg_weaponLagMax 3.5
seta cg_weaponLagStiffness 7
seta cg_weaponLagADS 0.35
// FREE-AIM DEADZONE: the mouse moves your AIM (crosshair + gun) within a small box in the centre of the
// screen WITHOUT panning the camera; push past the box edge and the camera follows ("move the weapon, then
// it pans the camera that way"). Aim/bullets are unchanged - this only decouples the CAMERA. Off in ADS,
// sniper scope, on a turret, and in 3rd person. cg_freeAim 1/0 = on/off. cg_freeAimBoxYaw/Pitch = box half
// size in DEGREES (bigger = more drift before the camera moves). cg_freeAimReturn = how fast the reticle
// drifts back to centre when idle (0 = stays where you left it). cg_freeAimGun = how far the gun model leans
// toward the reticle (units/deg). All live-tunable - set cg_freeAim 0 to disable instantly.
seta cg_freeAim 1
seta cg_freeAimBoxYaw 3
seta cg_freeAimBoxPitch 2
seta cg_freeAimReturn 3
seta cg_freeAimGun 0.18
// Camera SMOOTHING = the weight. Lower = heavier/smoother (more glide/lag), higher = lighter/snappier. This
// is the main dial toward the Hell Let Loose feel. Works in first AND third person. ~10 is a moderate weight.
seta cg_freeAimSmooth 10
// No hipfire crosshair (Hell Let Loose style - aim with the weapon). Removes it in BOTH first and third
// person. ADS iron sights / sniper scope are unaffected. Set ui_crosshair 1 to bring it back.
// (ui_crosshair is NOT set here on purpose: the engine default is 0 and the cvar is archived,
// so the player's Options choice persists across restarts. A seta here stomped it every launch.)
// REAL recoil (server-side): each shot pushes your actual AIM up by this many degrees and it ACCUMULATES
// (no auto-recenter) - sustained fire walks the muzzle up and you pull down to compensate. 0 = off. Applies
// to every shot you fire. g_ = server cvar (set on the coop host). Tune up for harsher climb, down for subtle.
seta g_adsRecoilKick 0.8
// HOLD BREATH tames recoil: while aiming (ADS or sniper scope) AND holding the walk key (breath-hold input),
// the real per-shot aim climb is scaled by this. 1 = no change, 0.4 = recoil at 40% while steadying. g_ cvar.
seta g_breathRecoilMult 0.4
// Bullets PUNCH THROUGH WOOD (player shots): penetration power, 0 = off, higher = thicker wood / less damage
// loss through it. Enemies keep their own (so wood cover still protects you from them). g_ = server cvar.
seta g_bulletThroughWood 100
// ANY-hard-material penetration for RIFLES & MGs only: small random chance per shot to punch through ANY
// hard surface - metal, grill, rock, concrete, stone, brick, anything (not just metal). g_penChance =
// probability per shot (0.1 = 10%, 0 = off); g_bulletThroughAny = penetration power when it does (higher
// = thicker material / less damage lost). Pistols/SMGs never get the bonus. g_ = server cvars.
seta g_penChance 0.5
seta g_bulletThroughAny 250
// HOLD BREATH to steady aim: while aiming (ADS or sniper scope), hold SHIFT to cancel the sway and hold
// steady for cg_breathHoldTime seconds; then it recharges over cg_breathCooldown seconds before you can
// hold again (no HUD - you feel the sway return when it runs out). SHIFT does double duty by aim state:
// while AIMING it holds breath (unchanged); while NOT aiming it SPRINTS (see the SPRINT block below).
seta cg_breathHoldTime 7
seta cg_breathCooldown 5
// While holding breath: zoom in slightly MORE (cg_breathZoom, fraction of the ADS zoom - lower = more) and
// gently duck MUSIC + AMBIENT volume for focus (cg_breathDuck = ducked level, fraction of base). GUNSHOTS and
// other SFX are NOT ducked - they stay at full volume. Both ease back when the breath ends. cg_breathDuck
// 1 = no duck, 0.7 = a gentle dip to 70% (lower = deeper fade).
seta cg_breathZoom 0.85
seta cg_breathDuck 0.45
// While holding breath the ADS focus VIGNETTE also deepens (an extra darkening pass eased in over ~0.25s)
// to reinforce the "tunnel in on the sights" feel that the breath zoom starts. cg_adsBreathVignette = how
// much extra darkness to add on top of the base ADS vignette (0 = no extra, 0.55 = a solid deepen). The
// DoF blur also nudges up slightly while breath is held. Live-tunable.
seta cg_adsBreathVignette 0.55
// ===== SPRINT (SHIFT) + WALK (ALT) =====
// Three movement speeds: normal RUN (default), WALK-slow (hold ALT), and SPRINT (hold SHIFT while NOT
// aiming and moving forward). SHIFT keeps its breath-hold role while aiming (above), so the SAME key
// sprints out of the sights and holds breath in them - the server tells them apart by aim state.
// Sprint is a MODEST boost over run (coop_sprintMult, ~1.3x) and is limited by a hidden STAMINA pool:
// it drains while sprinting and regenerates while not; when empty you drop back to run speed until it
// recovers (no HUD/meter). Sprint also requires actually moving FORWARD (not standing / backpedalling).
// coop_sprint 0 = fully OFF (vanilla movement). All server cvars (gameplay), live-tunable.
//   coop_sprint         1    = enable sprint (0 = off)
//   coop_sprintMult     1.9  = sprint speed as a multiple of normal run (1.0 = no boost; ~1.5-1.9 = snappy)
//   coop_sprintStamina  5    = max sprint duration in seconds (the stamina pool size)
//   coop_sprintRegen    0.6  = stamina regen rate (stamina-seconds gained per real second when not sprinting)
seta coop_sprint 1
seta coop_sprintMult 1.9
seta coop_sprintStamina 30
seta coop_sprintRegen 1.0
// OUT-OF-BREATH: after a CONTINUOUS sprint of coop_sprintBreathTime seconds or more, the player pants (one of
// two interchangeable "out of breath" takes, chosen at random). A sprint shorter than the threshold makes NO
// sound. coop_sprintBreath 0 = off. Engine feature (game.dll) - needs the fgame build deployed.
seta coop_sprintBreath 1
seta coop_sprintBreathTime 5
// First-person SPRINT gun-lower (cgame view effect, visual only - never affects aim/bullets): the view
// weapon dips down + pulls back + tilts while sprinting, eased in/out. cg_sprintLower 0 = off.
//   cg_sprintLower         1    = enable the gun-lower (0 = off)
//   cg_sprintLowerAmount   3.0  = downward dip (units)
//   cg_sprintLowerBack     1.4  = how far the gun pulls back (units)
//   cg_sprintLowerTilt     1.2  = side down-tilt (units)
// cg_sprintLower: default relocated to coop_defaults.cfg so your changes persist across restart.
seta cg_sprintLowerAmount 3.0
seta cg_sprintLowerBack 1.4
seta cg_sprintLowerTilt 1.2
// IRON-SIGHT ADS slows your move speed (and therefore the footstep cadence) to a careful aimed walk, so you
// don't stroll at full run speed with running footsteps while aimed. coop_adsSpeedMult = aimed-walk speed as
// a fraction of normal (0.55 = ~half pace, 1.0 = no slowdown). Scoped weapons already slow via GetZoomMovement.
// REVERTED to 1.0 (off) - 0.55 felt far too slow. Footstep cadence to be handled separately. Lower to re-enable.
seta coop_adsSpeedMult 1.0
// WEAPON COLLISION: when the muzzle is about to clip into a wall/doorframe, the view weapon pulls BACK + dips
// DOWN so it doesn't poke through (and reads as bracing the gun in tight spaces). A short forward trace
// measures the gap; closer wall = more retract, eased. Visual only - never affects aim/bullets.
// coop_weaponCollision 0 = off; Reach = trace length (units, how early it reacts); Back/Dip = max retract/drop.
seta coop_weaponCollision 1
seta coop_weaponCollisionReach 30
seta coop_weaponCollisionBack 9
seta coop_weaponCollisionDip 4
// KEYBINDS: SHIFT = the run/walk key (+speed) = sprint when not aiming / breath-hold when aiming.
// ALT = dedicated slow WALK key (+button12 -> usercmd button bit 12, read server-side as BUTTON_COOPWALK).
// Re-bound here every launch (autoexec runs after the player cfg) so the three-speed model is deterministic.
bind SHIFT "+speed"
bind ALT "+button12"
// DEPTH OF FIELD: real screen-space blur of the world's edges while aiming (renderergl1 RB_DepthOfField),
// leaving the centre/sight picture in focus. cg_dofStrength = how strong (0 = OFF, 1 = max); r_dofRadius =
// blur spread in pixels. Both live-tunable - set cg_dofStrength 0 to disable instantly if it looks wrong.
// NOTE: this is an engine (openmohaa.exe) feature - needs the DoF exe build deployed to do anything.
seta cg_dofStrength 0.6
seta r_dofRadius 3
// ===== ADS TUNING WORKBENCH (numpad "tuning pad") =====
// Hold/aim a gun. Pick what to tune, then nudge it live with the numpad d-pad, then save:
//    NUM 7 = tune PITCH     NUM 8 = up         NUM 9 = tune YAW
//    NUM 4 = left           NUM 5 = tune SHIFT  NUM 6 = right
//    NUM 1 = SAVE           NUM 2 = down        NUM 3 = tuning ON/OFF (toggle)
//    NUM 0 = tune ROLL (un-tilt, stand + crouch)
// Picking a mode (7/9/5/0) also turns tuning ON (green centre reticle + readout appear). The active STANCE
// is auto-detected, so stand and crouch each keep their own values. PITCH=up/down, YAW=left/right,
// SHIFT=slide the whole hand+gun on screen (use this to pull a crouched gun toward centre), ROLL=un-tilt.
// Tune standing first, then crouch and repeat. SAVE (1) dumps that gun's full stand+crouch state to the
// console/log for me to bake. The nudge keys are inert unless tuning is on, so they're safe to leave bound.
seta cg_adsTune 0
seta cg_adsMode 0
bind KP_HOME adsm_pitch
bind KP_PGUP adsm_yaw
bind KP_5 adsm_shift
bind KP_INS adsm_roll
bind KP_UPARROW adsn_up
bind KP_DOWNARROW adsn_down
bind KP_LEFTARROW adsn_left
bind KP_RIGHTARROW adsn_right
bind KP_END adssave
bind KP_PGDN "toggle cg_adsTune"

// HZM coop DEBUG (default 0 = OFF = normal auto-seating: first player in mans the cannon, the rest fill the
// bed/truck). Set 1-16 to FORCE the host into a specific seat for testing (1 = cannon, 2-6 = halftrack bed,
// 7-16 = truck bed); re-seats on every respawn. Leave at 0 for normal play.
seta coop_dbgForceSeat 0
// HZM coop TEST: rider solidity. 1 = SOLID (default; take bullet damage). 0 = NOTSOLID (protected cargo).
// Flip to 0 + respawn to test whether the truck stutter is collision-related (if it still stutters = not collision).
seta coop_riderSolid 1
// HZM coop DEBUG: 1 = host spawns UNSEATED (free) so you can noclip around t2l2 for level design (gather
// viewpos coords). Workflow: set coop_dbgNoSeat 1 ; kill -> respawn free -> noclip -> fly. Set 0 + kill to ride.
seta coop_dbgNoSeat 0

// Corpse despawn: dead AI bodies fade out + are removed after this many seconds so the battlefield
// doesn't pile up (esp. with enemy count-scaling). 0 = bodies stay forever. The officer (boss) is kept.
seta coop_corpseLife 0
// [user 07-20, bug-926] DROPPED-WEAPON lifetime: weapons dropped by dying AI/players auto-remove after
// this many seconds (engine g_droppeditemlife -> EV_Remove; picking one up cancels the timer - engine
// handles that natively). Turned ON because weapons-on-back means every dead German leaves 2-3 weapon
// ENTITIES forever; on e1l2's big fights that ran the 1024-entity pool to its ceiling and broke the
// respawn weapon kit (guns colliding over the last free slots = invisible/missing guns). 0 = forever.
seta g_droppeditemlife 60
// [user 07-20] NO INVISIBLE FENCES: player movement ignores the map's baked playerclip brushes (the
// invisible walls retail painted over rocks/ledges, e.g. e1l2 gun-emplacement rocks). Real geometry
// is untouched - you can only climb what actually has surfaces. Caveat: some fences guard unfinished
// map edges; set 0 if you find ugly seams/holes and want stock fencing back.
seta coop_noPlayerClip 0	// [user 07-20] REVERTED same day: didn't fix the real invisible walls (they're low, jumpable, in open paths = NOT map fencing) and let players push into real wall crevices. Engine capability stays dormant at 0.
// Blast IMPULSE on dead bodies: explosions near a corpse physically THROW it (flip to physics + shove away
// from the blast, biased upward). g_corpseImpulse scales the force (0 = off, 1 = default, higher = flies
// farther). Only affects already-dead bodies; living targets use normal knockback. g_ = server cvar.
seta g_corpseImpulse 1.0

// ===== REACTIVE DIFFICULTY DIRECTOR (coop_mod/director.scr) =====
// Watches squad performance (downs, quiet streaks, team HP, kills/min) into a hidden Ease Index and
// quietly dials officer wave cadence/size + ambient spawn density. Eases off 3x faster than it ramps;
// a wipe snaps to easiest + suppresses waves ~40s. CAMPAIGN-PERSISTENT: coop_ddaSkill (archived)
// carries the squad estimate across maps and sessions. [user 07-17] ENABLED by default (user asked to turn
// the difficulty system on). It is now actively dialing officer wave cadence/size + ambient spawn density.
// Set coop_ddaEnabled 0 to disable (safe to toggle live; off restores the static baseline). coop_ddaDebug 1 = trace.
seta coop_ddaEnabled 1
seta coop_ddaSkill 0.5
seta coop_ddaBias 0
seta coop_ddaDebug 0

// ===== WOUNDED GERMAN LIMP-AWAY (coop_mod/wounded.scr) =====
// When a rank-and-file German drops below coop_woundedThreshold of its max HP, coop_woundedChance% of them
// break off combat and withdraw toward the FURTHEST medkit (away from the players), then are evacuated
// (fade out) on arrival. They stay damageable the whole way - you can gun a limper down mid-retreat.
seta coop_woundedRetreat 1        // master on/off
seta coop_woundedThreshold 0.30   // fraction of the soldier's own max HP that triggers a break-off (0.30 = 30%)
seta coop_woundedChance 25        // % of eligible low-HP Germans that limp off (the rest fight to the death)
seta coop_woundedMax 3            // max concurrent limpers (bounds the per-limper medkit scan)
seta coop_woundedLimpAnim 0       // 1 = overlay the walk_injured gait (experimental; may fight nav) - default plain slowed walk

// ===== BULLET-SPONGE SWEEP (coop_mod/aihandler.scr::coop_reinf_brain) =====
// The coop pain handler buffers every German's ENGINE health to 5000 and tracks the real hp separately.
// If any script later severs the engine pain dispatch (nolongpain / enablePain 0) or stacks health on top
// of that buffer, the body is stranded at ~5000 hp = "an AI that takes thousands of rounds". This low-cost
// sweep (folded into the existing 1.5s reinforcement loop) spots such an actor, subtracts the buffer's
// contribution, hands it back to the engine, and logs one "^~^~^ UNSPONGE" line to qconsole.log.
// 0 = off, 1 = on + log (default), 2 = on but silent.
seta coop_unsponge 1

// ===== BLOOD TRAILS =====
// A WOUNDED enemy AI (health below coop_bloodTrailHealthFrac of its max) drips ground blood splats as it
// MOVES, reusing the engine's own feet-splat (the AI's own blood-splat shader; each splat is a 1-frame
// server decal whose mark lives in the client's auto-recycled decal pool, so it's cheap - no cgame change).
// Droplets are spaced by time (coop_bloodTrailInterval sec) AND distance travelled (coop_bloodTrailDist
// units) so it's a trail of drips, not a smear. coop_bloodTrail 0 = off. Requires com_blood 1 (vanilla on).
// coop_bloodTrail: default relocated to coop_defaults.cfg so your changes persist across restart.
seta coop_bloodTrailHealthFrac 0.5
seta coop_bloodTrailInterval 0.45
seta coop_bloodTrailDist 56
seta coop_bloodTrailChance 0.8
// PLAYER blood trail (separate toggle from AI). Re-enabled while we TRACK DOWN the white-wedge bug: set
// coop_bloodDebug 1 and the engine logs a ^~^~^ BLOODTRAIL line per drop (player AND AI) to qconsole.log
// with the splat shader + image index + floor-trace normal/positions, so we can diff why the player's
// decal renders white vs the AI's red. coop_bloodDebug 0 = quiet (no per-drop spam).
seta coop_playerBloodTrail 1
// Temporarily 1: also logs ^~^~^ FLESHHIT dist=... when a player's bullet hits an enemy, to confirm whether
// distant hits register (= blood is spawning, just small) vs not. Set back to 0 once the distance blood is sorted.
seta coop_bloodDebug 0
// Persistent blood POOL under a body where it dies: stays on the ground (doesn't fade out in ~10s like the
// hit splats) so blood is there when you reach a corpse. coop_bloodPool = pool radius in units (0 = off).
seta coop_bloodPool 44
// TEMPORARY (bug-776, 2026-07-18): gore debug prints ON for ONE verification session. Server logs
// ^~^~^ GOREPOOL (stamp/blocked reasons) and the client logs ^~^~^ GOREPOOL-CL (decal name, wire scale,
// surfaces[1] radius) per pool decal, so qconsole.log proves the chain either way. REVERT to 0 after the
// user confirms pools are visible (it is seta-archived: also set it 0 once in console so omconfig clears).
seta coop_goreDebug 0                // reverted to 0: pooling confirmed working (was 1 temporarily for the GOREPOOL evidence)
// [user 07-18] tier-3 3D wound PROP disabled: the crossed-quad patch (coop_wound1.tik) attaches proud of the
// AI collision SPHERE (fatter than the visual limb), so it hovered OFF the skin ("floating wounds"). Flush
// wounds now come solely from the tier-4 UV stamps (r_goreUV=1), which paint into the skin/cloth texture at
// the exact bullet-impact UV - always on the surface, never floating. Re-enable only with better geometry.
seta coop_goreWounds 0
// [user 07-19, bug-905] Skin-wound SNAP distance = bloodier face/head/hand shots on LIVING movers. A living
// enemy's animated client pose is offset from the server pose the bullet was traced against, so the thin exact
// ray slides past the small head/hand triangles; a wider snap sphere recovers the wound. Bumped 18 -> 26 (the
// engine default is 26 now too); force-set here because coop_goreSkinSnapDist is CVAR_ARCHIVE and an old
// saved config kept 18. Lower toward 18 if wounds start snapping onto the wrong body part.
seta coop_goreSkinSnapDist 26
// [2026-07-28] CONFIRMED HEADSHOT KILL feedback: the same alive->dead edge that plays the coop_headshot
// cue (now detected in Sentient::ArmorDamage so pain-handler-buffered AI kills confirm too) also spawns
// an unmissable blood burst at the wound (bh_human_uniform_hard tik - the blood addon's rich override)
// plus a persistent coop_bloodsplat mark on whatever surface sits behind the head along the bullet path.
// Fixes "confirmed headshot but no visible gore" (UV stamp can miss on movers / pop off with the helmet).
seta coop_headshotFx 1              // 0 = no burst/splat on confirmed headshot kills
seta coop_headshotFxSplatDist 140   // max units behind the head to look for a splat surface (0-1 = off)
seta coop_headshotFxSplatSize 16    // base splat radius (final = base + random(base/2))

// ===== GORE TIER 2: BLOOD DRIP + GROWING POOL =====
// Badly wounded humans (BOTH sides + players) get a looping blood-drip FX attached to the torso, and a
// fresh corpse drips at full rate for a short bleed-out window - each falling streak leaves the normal
// blood mark where it LANDS (client-side, cheap). The corpse pool also GROWS: it starts small and layers
// progressively larger rings up to coop_bloodPool size over ~20s. Master toggles (coop_goreDrip /
// coop_gorePool) live in coop_defaults.cfg so menu changes persist. Tuning knobs below.
// Wounded gate: normal AI run with FAKED engine health (aihandler), so AI trigger on ACCUMULATED damage
// (coop_goreDripDamage); players/real-health sentients trigger on a health fraction (coop_goreDripHealthFrac).
seta coop_goreDripDamage 70        // AI: accumulated damage that starts the wounded drip (was 120 - above typical lethal accum, bug-735)
seta coop_goreDripHealthFrac 0.35  // players/real-health: drip when health falls below this fraction of max
seta coop_goreDripWoundTime 20     // seconds a wounded (alive) drip lasts before it needs fresh damage
seta coop_goreDripCorpseTime 12    // seconds a fresh corpse keeps dripping (the bleed-out window)

// ===== WET BLEED-OUT GURGLE (atmospheric death-rattle SFX) =====
// A subtle, quiet, short-range wet death-rattle sometimes plays positionally near a FRESH corpse a
// beat after death, riding the tier-2 bleed-out above so the gurgle matches the visible blood.
// Proximity-gated so off-screen bodies stay silent. See coop_mod/gurgle.scr + ubersound/coop_gurgle.scr.
seta coop_gurgle 1                  // master toggle for the wet bleed-out gurgle (0 = off)
seta coop_gurgle_chance 0.35        // fraction of deaths that gurgle (0.0-1.0); subtle by default
seta coop_gurgle_range 1200         // only gurgle if a player is within this many units of the corpse
// WET BLOOD-LEAK LOOP: a continuous quiet under-body trickle (retail oil-barrel leak wav) loops on a
// bleeding corpse for the tier-2 bleed-out window (~coop_goreDripCorpseTime), then stops. Separate from
// and coexists with the occasional gurgle above. Concurrency-capped (~5) + proximity-gated internally.
seta coop_bloodleak 1               // master toggle for the wet under-body blood-leak loop (0 = off)
seta coop_bloodleak_range 900       // only trickle if a player is within this many units of the corpse

// ===== GORE TIER 1: DAMAGE-TIER BLOOD SKINS (tuning, bug-735) =====
// A hit human's uniform flips clean -> light blood -> heavy blood as damage accumulates; the KILLING BLOW
// always leaves a heavy-tier corpse (engine-side). AI (faked engine health) tier on ABSOLUTE accumulated
// damage; players/real-health sentients tier on a FRACTION of max health. Retuned against real weapon
// numbers (SMG/pistol 25-37 dmg, rifles 60-120): one solid hit = light, about two = heavy.
// These are archived cvars - the setas below override values saved under the old 60/140 defaults.
seta coop_goreTier1Dmg 35          // AI: accumulated damage -> light blood skin
seta coop_goreTier2Dmg 90          // AI: accumulated damage -> heavy blood skin
seta coop_goreTier1Frac 0.22       // players/real-health: fraction of max health lost -> light
seta coop_goreTier2Frac 0.50       // players/real-health: fraction of max health lost -> heavy
// GORE TIER 1e: AI killed BY AN EXPLOSION (grenade/rocket/tank shell/artillery/landmine/scripted charge)
// leave an EXTREME blood-drenched corpse - uniform AND face/hands - with a random per-corpse splatter
// pattern. Rides the same master gates (com_blood + coop_goreSkins) plus this switch.
seta coop_goreGibSkins 1           // 0 = explosion deaths only reach the ordinary heavy tier

// ===== SUPPRESSION FX (under fire) =====
// When enemy rounds CRACK PAST you (the engine's bullet-"zing" near-miss) or you TAKE A HIT, the screen
// briefly desaturates + a dark tunnel-vignette closes in, then eases back. r_ppSuppression 1/0 = on/off
// (post-FX, renderer); r_ppSuppressAmount = max strength; coop_suppressFade = seconds to ease back to calm
// (lower = snappier recovery). r_ppSuppress is the live 0..1 intensity the cgame writes each frame.
// r_ppSuppression: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppSuppressAmount: default relocated to coop_defaults.cfg so your changes persist across restart.
seta coop_suppressFade 1.8

// ===== INJURED VIEW SWAY (woozy, not a shake) =====
// When badly hurt (health below coop_injuryStart of your peak HP this life), the camera drifts in a slow
// woozy figure-eight that grows as you bleed out - a SWAY, not a jolt. coop_injurySway = amount (degrees
// scale, 0 = off, 1 = default, push to ~1.5-2 for heavier); coop_injuryStart = the HP fraction it begins at
// (0.5 = below half health, matching the red low-health vignette). cgame view effect; never affects aim.
seta coop_injurySway 1.0
seta coop_injuryStart 0.5
// DBNO carry-over: while downed, the red vignette + camera sway are forced to near-max (a downed player's
// health resets to 'full', so it wouldn't show otherwise) and aiming the downed pistol is made HARDER.
// coop_dbnoSwayMult = extra sway multiplier applied only while downed (1.6 = heavily woozy; 1 = same as a
// normal critical wound). The downed state itself is flagged automatically by dbno.scr (coop_dbnoView).
seta coop_dbnoSwayMult 1.6
// TEAM REVIVE: a LIVING teammate walks up to a downed player and HOLDS [USE] (F) to bring them
// back up - no medkit needed. The reviver kneels in a medic pose while working; moving or firing
// cancels it. coop_teamRevive 0 = off; coop_teamReviveTime = seconds of holding to complete;
// coop_teamReviveRange = how close (units) the reviver must stand. Reviver earns support XP.
seta coop_teamRevive 1
seta coop_teamReviveTime 3.5
seta coop_teamReviveRange 80
// DBNO bleed-out (down) time: how long you stay DOWNED - crawling / waiting to be revived - before you
// bleed out, die, and drop to the death/spectator state. [user 07-17] retuned 300s -> 90s (user: "should be
// like 90 seconds max"): still ample time for a teammate to revive without a downed player waiting minutes.
// (Headshot-downs stay a faster 45s - critical hit.)
seta coop_dbnoTimer 90
// EXACT-AMMO RESPAWN [user 07-09]: when you die and respawn you get back the EXACT reserve ammo you were
// carrying when you went down (not a fresh default loadout). A per-player loop snapshots your combat ammo
// (pistol/rifle/smg/mg/heavy/grenade/shotgun/agrenade/landmine) every 0.5s while alive; on respawn it is
// re-applied via the engine's setammo. Reward items (officer binocs / smoke signal) are excluded on purpose
// - they drop on death, so you do NOT respawn with them. 1 = on, 0 = fresh default ammo (vanilla behaviour).
// NOTE: requires the 07-09 game.dll (getammo/setammo events); with an older game.dll leave this at 0.
seta coop_exactAmmo 1
// CLICKABLE LOBBY UI [304]: in the between-mission lobby your mouse drives an on-screen cursor and you CLICK
// buttons (Challenges now; loadout / skill trees later). coop_lobbyClickUI 1 = on, 0 = off. coop_lobbyCursorSens
// tunes how fast the cursor moves per mouse motion (raise if it feels sluggish, lower if it flies). The panel
// itself is drawn server-side; the cursor is derived from your usercmd view-angle deltas (no client binds).
seta coop_lobbyClickUI 1
seta coop_lobbyCursorSens 0.03
// SERVICE RECORD paged/tabbed menu (ui/coop_sr.urc): coop_srP0..11 are VIEW-STATE cvars picking which of the
// 12 tab pages is showing (RIFLES/SNIPERS/SMGS/PISTOLS/HEAVY on the top tab row; KILLS/MILES/TASKS/MISSIONS/
// FEATS I/II/III on the bottom). One is 1, the rest 0. Tab buttons flip them (enabledcvar-gated bg + rows) so
// switching tabs never leaves the menu. Reset here every launch so it always opens on RIFLES. (Progress cvars
// coop_uiB*/coop_uiN* are SAVED by challenges.scr and must NOT be seeded here or progress would wipe each launch.)
set coop_srP0 1
set coop_srP1 0
set coop_srP2 0
set coop_srP3 0
set coop_srP4 0
set coop_srP5 0
set coop_srP6 0
set coop_srP7 0
set coop_srP8 0
set coop_srP9 0
set coop_srP10 0
set coop_srP11 0
set coop_srP12 0
set coop_srP13 0
set coop_srP14 0
// coop_chalPopup 1 = show the small HD progress bar (title + N/T) on the left at each 25/50/75%
// challenge milestone; 0 = off. Toggle is in Coop Settings ("Challenge Popups").
// coop_chalPopup: default relocated to coop_defaults.cfg so your changes persist across restart.
// coop_deathvox_range = how close (units) a player must be to a dying AI for the varied death-grunt to play
// (default 1500). AI that die farther away keep their quieter native German/Italian death cry instead of
// broadcasting a "random" grunt. Raise for more grunts, lower to only hear point-blank kills. 0-ish = off.
seta coop_deathvox_range 1500
// ============================================================================
// DYNAMIC AI BEHAVIOUR (coop_mod/officer.scr::coop_apply_personality, aimaneuver.scr,
// aisquad.scr, morale.scr, aicombat.scr).
//
// [2026-07-29] These were built, wired into main.scr, and then NEVER SEEDED IN ANY CFG - so every
// gate below (all of the form `getcvar( "x" ) == "1"`) read "" and was permanently false. The whole
// layer has never executed for a player; the only thing that ever set them was the automated bot
// rig, which sets them itself, which is why it read as verified. Seeding them here fixes that.
//
// Enable ONE AT A TIME and play a map between each - none of these has ever run in real combat.
// ============================================================================
// Base personality roll for map enemies: aggressive / cover-seeker / flanker / prone shooter,
// instead of every soldier standing still and trading shots. This is the foundational layer -
// the others build on the roles it assigns, so turn this on first.
seta coop_aiDynamic 1
// Squad brain: groups nearby enemies so they advance, cover and fall back together. OFF until
// coop_aiDynamic has been played and tuned - it reads the roles that one assigns.
seta coop_aiSquad 1
// Suppression/combat movement layer (juke, reposition, search last-known-position).
// [2026-07-29] coop_aiCombat is NOT an AI behaviour layer - it is the AUTOMATED COMBAT
// DRIVER, a dev/test harness that STEERS THE PLAYERS into firefights unattended so AI
// behaviour can be measured. Shipping it on teleports players around the map. It was
// enabled by mistake (mine) while testing the real layers. DEV ONLY - leave at 0.
seta coop_aiCombat 0
// Morale: badly-hurt or leaderless enemies may break and fall back rather than fight to the death.
seta coop_moraleEnable 1
// Wounded tactical retreat, layered above the terminal <=30% limp. Needs coop_moraleEnable.
seta coop_retreatEnable 1
// 1 = log a greppable "^~^~^ AIBEHAV" line per actor showing the role it rolled. Use this to prove
// the layer is actually running and to see the role distribution before tuning.
seta coop_aiBehav 0

// SITUATIONAL AI VOICE (coop_mod/aivoice.scr + ubersound/coop_aivoice.scr).
// AI now speak because something HAPPENED, not because a timer fired: taking fire -> "take cover" /
// "call for reinforcements", a squadmate drops nearby -> "man down", sustained trading of fire ->
// reload / press-the-attack / a taunt (only while they actually have a live enemy). Lines are played
// on the ACTOR entity so they pan and fall off with distance, and the pool is chosen from the actor's
// MODEL nationality (german / italian / american / british) so nobody speaks the wrong accent.
// 1 = on (default). 0 = off: falls back to engine-only barks plus the old random idle mutter.
seta coop_aiVoice 1
// How many AI may be mid-line at the same time (1-4). Higher = busier firefights, 2 is the sweet spot.
seta coop_aiVoiceMax 2
// Max distance (units) from the nearest player at which an AI bothers to speak.
seta coop_aiVoiceRange 2600
// 1 = log a greppable "^~^~^ AIVOICE <situation> nat <de|it|us|uk> alias <..> model <..>" line for
// every bark. Use this to prove which pool a given soldier is drawing from.
seta coop_aiVoiceDebug 0
// coop_playerRifleSpread = spread multiplier for the PLAYER's OWN rifle shots only (enemy AI unaffected).
// 1 = vanilla, 0.5 = half spread (tighter, default), 0.35 = very tight, 0.7 = subtle. Rifles only (not SMG/pistol).
seta coop_playerRifleSpread 0.5
// Mounted MG42 / turret camera: 0 = FIRST person (restored default), 1 = forced over-the-shoulder 3rd person.
seta coop_turretThirdPerson 0
// DIAGNOSTIC: 1 = log ^~^~^ TURRETDBG (client camera_origin, PMF_TURRET, CAM_VIEW, render3rd) while on the
// MG42. Re-enabled: the gun STILL reads 3rd person with g_turretcameras 0 + forced first person, which
// should be impossible - logging the real client state (PMF_TURRET / CAM_VIEW / render3rd / cg3p) to find
// out why. Set back to 0 once diagnosed.
seta coop_turretDebug 0

// ===== SMOKE WHIPS (weightier gunfire) =====
// A subtle, lingering gun-smoke wisp spawned at the muzzle + at bullet impacts (on top of the vanilla
// muzzle puff / impact dust), for cinematic weight. coop_smokeWhip 1/0 = master on/off; the Muzzle/Impact
// values are per-event spawn CHANCES (0..1): 0 = never, 1 = every shot/impact. Start subtle, dial UP live.
// The smoke LOOK (size/lifetime/density) is baked in models/fx/coop_gunsmoke.tik (edit + repack to change).
// coop_smokeWhip: default relocated to coop_defaults.cfg so your changes persist across restart.
// Muzzle smoke (the "per volley" puff at the barrel): per-volley spawn chance. 0.3 per user request.
seta coop_smokeWhipMuzzle 0.1
// Impact smoke OFF by default - the beefed-up tik turned bullet-impact wisps into big obnoxious plumes
// AWAY from the gun (where rounds hit walls/ground), which read as "a giant plume not from my gun". Keep
// just the subtle muzzle wisp. Set back to ~0.3 if you want light impact smoke again.
seta coop_smokeWhipImpact 0
// BARREL WISP: a SHORT wisp of smoke that trails BACK off the barrel (toward you) after firing - reads as
// smoke curling off your own gun, not a plume in your face. coop_barrelSmoke = per-volley spawn chance
// (0 = off, 0.6 = ~60% of bursts, 1 = every burst). The short/thin look is in models/fx/coop_barrelsmoke.tik.
seta coop_barrelSmoke 0.1

// ===== TRACERS FROM THE MUZZLE (visual) =====
// The engine fires your bullets from the EYE, so your tracers looked like they came out of your face. This
// moves the tracer ORIGIN to roughly the view-weapon muzzle (eye + a forward/right/down offset), first-person
// only; other players' tracers are untouched. Purely visual. coop_tracerFromMuzzle 0 = revert to eye. Tune
// live: Fwd = out to the barrel tip, Right = gun is held right of centre, Up = negative drops it to the barrel.
seta coop_tracerFromMuzzle 1
seta coop_tracerMuzzleFwd 24
seta coop_tracerMuzzleRight 6
seta coop_tracerMuzzleUp -8

// ===== FRAME PACING (180 Hz display) =====
// com_maxfps was 85 on a 180 Hz monitor -> uneven frame pacing that reads as the camera "snapping" when
// you turn. Match the refresh so frames pace evenly. Raise/lower to taste; 0 = uncapped.
seta com_maxfps 180

// ===== SERVER SNAPSHOT RATE (vehicle-rider smoothness) =====
// sv_fps is the server tick AND the max snapshot rate the client interpolates between. The default 20 means
// only 20 position updates/sec: a WALKING player is client-PREDICTED so it's smooth regardless, but a player
// GLUED to a vehicle seat is client-INTERPOLATED (engine forces PMF_NO_PREDICTION on glued players), and at
// 20 Hz an interpolated rider on a fast vehicle (~254 u/s) jumps ~12 units per snapshot = visible STUTTER.
// Movement is TIME-based (sv.frameTime = 1/sv_fps), so raising this does NOT change the truck's speed - it
// just sends finer position steps the client can lerp smoothly. snaps (client) must match or it's capped to
// sv_fps and the client still only requests 20/sec. Both are local on a listen server. 40 = double the
// smoothness; raise to 60 if riding still stutters, lower if it costs server CPU / desyncs the set-piece.
seta sv_fps 40
seta snaps 40

// ===== POST-FX SHIPPING LOOK (force-set each launch = the curated default) =====
// These are the finalized post-processing values. They're force-set here so a fresh install gets the
// curated look, and they mirror coop_mod/cfg/coop_fxdefaults.cfg (the menu's DEFAULTS button). The postfx
// MENU still tunes everything LIVE for the current session; changes revert to these on the next launch.
// To change the SHIPPED default, edit these AND coop_fxdefaults.cfg together. (SSAO + tonemap OFF.)
// r_postProcess: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppBloom: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppBloomThreshold: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppBloomIntensity: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppSSAO: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppSSAODepthAware: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppSSAORadius: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppSSAOIntensity: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppSSAOBias: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppDoF: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppDoFFocus: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppDoFRange: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppDoFIntensity: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppTonemap: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppExposure: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppContrast: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppSaturation: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppGrade: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppFXAA: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppLowHealth: default relocated to coop_defaults.cfg so your changes persist across restart.
// [user 08-02] These three lines contradicted the comment directly above them: the comment says
// the defaults were RELOCATED to coop_defaults.cfg "so your changes persist", and then these
// re-forced them here on every launch - stomping the tuned values. r_ppLowHealthAmount 1.0 is
// FULL strength, which is why the injured red overlay was "way too bright". Commented out so
// coop_defaults.cfg actually owns them, as the comment intends.
//seta r_ppLowHealthStart 0.5
//seta r_ppLowHealthAmount 1.0
//seta r_ppLowHealthBeat 0.5
// r_ppSunShafts: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppSunShaftIntensity: default relocated to coop_defaults.cfg so your changes persist across restart.
seta r_ppSunShaftDecay 0.95
seta r_ppSunShaftThreshold 0.6
// Sharpen (unsharp mask) - counteracts FXAA/mip softening for a crisper image. r_ppSharpenAmount 0.2-0.5.
seta r_ppSharpen 1
seta r_ppSharpenAmount 0.35

// Map overbright pinned to the engine default (1). The Advanced Graphics "Map Overbright" slider was
// removed because r_mapOverBrightBits renders glitchy on this gl1 build. CVAR_LATCH -> applies on vid_restart.
seta r_mapOverBrightBits 1

// Character shadows ON at mode 2 (per-foot). Mode 3 is a no-op on this gl1 build (hands off to a dormant
// renderer precise-shadow path and draws nothing), so the Advanced Graphics slider caps at 2.
// cg_shadows: default relocated to coop_defaults.cfg so your changes persist across restart.
// Phase-A directional shadow ON (interim, until deferred shadow-maps land): sun-angled ground decal per
// model, zero artifact risk. coop_shadowAuto 1 = follow the map's REAL sun (published by the renderer) so
// shadows point the right way per map; on maps with no defined sun it falls back to the MANUAL coop_shadowAz/El
// below. coop_shadowAuto 0 = always use the manual angle. Tune live: coop_shadowEl (elevation, lower=longer),
// coop_shadowLen. Set coop_shadowDir 0 for vanilla per-foot shadows.
seta coop_shadowDir 1
seta coop_shadowAuto 1
seta coop_shadowAz 45
seta coop_shadowEl 45
seta coop_shadowLen 2
// Effects/brass pool at the engine default. Brass casings are tempmodels with NO wall occlusion, so a high
// pool lets them accumulate and show through walls - keep this at the default (also the slider's max now).
// cg_max_tempmodels: default relocated to coop_defaults.cfg so your changes persist across restart.

// Trilinear texture filtering as the shipping default (smoother mip transitions on ground/walls than the
// engine's bilinear default). Still toggleable in Video Options -> Texture Filter (Bilinear/Trilinear).
seta r_textureMode GL_LINEAR_MIPMAP_LINEAR
// (Model LOD is forced to max further down in the MODEL LOD block: r_uselod 0.)

// ===== TRACER GLOW + HEAT HAZE =====
// Tracer glow: thickens the white tracer beam so the bloom post-FX makes it glow (cg_tracerGlow = beam
// width mult; 1 = vanilla, higher = hotter/fatter). Heat haze: an animated screen shimmer that spikes near
// explosions and eases back. r_ppHeatHaze 1/0 = on/off (post-FX); r_ppHeatAmount = max warp; coop_heatFade =
// seconds to ease back; coop_heatRadius = how close a blast must be to register.
// cg_tracerGlow: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_ppHeatHaze: default relocated to coop_defaults.cfg so your changes persist across restart.
seta r_ppHeatAmount 1.0
seta coop_heatFade 1.4
seta coop_heatRadius 700
// RAIN ON LENS: refractive water beads drift over the screen while you're OUTDOORS in rain (cgame publishes
// r_ppRainWet from cg.rain.density + an open-sky up-trace, eased so beads build/dry; the renderer's gl1
// post-FX rain pass refracts the scene under each bead + a faint glint). r_ppRainDrops 1/0 = on/off;
// r_ppRainAmount = look strength (raise for heavier streaming, lower for a light misting). r_ppRainWet is
// driven per-frame by the cgame - do not set it here.
seta r_ppRainDrops 1
seta r_ppRainAmount 0.5
// GUNFIRE heat haze is now LOCALIZED to the gun (not a fullscreen wash): each shot from a barrel near you
// adds a tight heat shimmer anchored at the gun's hot-spot on screen, so sustained fire reads as heat rising
// off YOUR barrel. coop_heatGun = per-shot strength (0 = off); coop_heatGunRadius = how close the muzzle
// must be to register. Raised 0.1 -> 0.3 so a SINGLE shot is visible (was only showing on fast guns like the
// Thompson). NOW it's a FLOOR not a stack (cgame): each shot brings heat to coop_heatGun for ALL guns
// equally - handgun, BAR, Thompson all show the same per-shot heat (no more fire-rate stacking that made
// the Thompson overheat while slow guns showed nothing). One knob for every gun; raise/lower to taste.
seta coop_heatGun 0.28
seta coop_heatGunRadius 350
// Muzzle hot-spot position + size on screen (renderer): r_ppMuzzleX/Y = where the shimmer centres (0.5,0.6 =
// lower-centre where the barrel sits; raise Y toward 0.5 if you want it nearer the crosshair), r_ppMuzzleRadius
// = how big the shimmer field is. Tune these live to sit the heat right on your gun.
seta r_ppMuzzleX 0.5
seta r_ppMuzzleY 0.4
seta r_ppMuzzleRadius 0.10

// ===== DYNAMIC LIGHTS (muzzle flashes + explosions) =====
// Gunfire and blasts cast brief real dynamic light on the world (renderer dlights). coop_dynLights 1/0 =
// master on/off; coop_muzzleLight = muzzle-flash radius (0 = off, brief warm flicker per shot);
// coop_explLight = explosion flash radius (0 = off, bright orange, fades over a few frames).
seta coop_dynLights 1
seta coop_muzzleLight 160
seta coop_explLight 420

// ===== REACTIVE / SUPPRESSED AI =====
// When YOUR rounds land near an enemy, their aim degrades briefly (they spray / keep their head down) so
// you can push or flank. coop_aiSuppress 1/0 = on/off; coop_aiSuppressRadius = how close a round must land;
// coop_aiSuppressTime = seconds the AI stays suppressed per near-miss; coop_aiSuppressAccuracy = aim
// multiplier while suppressed (lower = more suppressed, 0.2 = quite suppressed). Friendly AI are exempt.
seta coop_aiSuppress 1
seta coop_aiSuppressRadius 150
seta coop_aiSuppressTime 1.5
seta coop_aiSuppressAccuracy 0.2
// coop_aiSuppressCover 1 = a suppressed AI also BREAKS its stand-and-shoot and seeks COVER (runs to the
// nearest cover node and fights from it; if the map has no cover near it, it just keeps aiming in place -
// safe either way). Sticky for the rest of that engagement; its idle/patrol behavior is untouched. Mounted
// MGs and scripted special attackers are left alone. 0 = aim-degrade only (no movement).
seta coop_aiSuppressCover 1

// ===== SMG WALL-PUNCH =====
// A small % of player-fired SMG rounds (MP40 / Thompson / Sten / PPSh - anything weaponclass smg) punch
// THROUGH any surface, so you can occasionally kill someone hiding behind thin cover. Uses the engine's
// bullet-penetration path (capped at 5 layers, damage falls off with distance through the wall). Enemies are
// excluded (no wallbangs on you). coop_smgPenetrate 0 = off; Chance = per-shot probability (0.1 = 10%);
// Power = punch strength (higher = more damage survives the wall).
seta coop_smgPenetrate 1
seta coop_smgPenetrateChance 0.1
seta coop_smgPenetratePower 8

// ===== TINNITUS / MUFFLED HEARING =====
// Take a big hit (>= coop_tinnitusMinDamage HP in one frame - a blast or heavy burst) and a high ringing
// tone plays + your world SFX briefly muffle, easing back over coop_tinnitusTime sec. coop_tinnitus 0 = off;
// coop_tinnitusMuffle 0 = ring only (no SFX duck). coop_tinnitusBaseVol must match your s_volume baseline
// (the muffle restores s_volume to it). Per-player.
// coop_tinnitus: default relocated to coop_defaults.cfg so your changes persist across restart.
seta coop_tinnitusMinDamage 60
seta coop_tinnitusTime 4
seta coop_tinnitusMuffle 1
seta coop_tinnitusBaseVol 0.9
// BLAST PROXIMITY: an explosion/grenade going off NEAR you rings your ears even if it barely (or never) hurt
// you - near-miss, behind cover, or soaked up by your HP pool. The engine (RadiusDamage) flags any player
// within coop_tinnitusBlastRange units of ANY blast; closer = louder/longer. coop_tinnitusBlast 0 = off (back
// to big-hit-only). coop_tinnitusBlastFull = closeness (0..1) at/above which you get the full concussion wash
// + deep muffle; below it is a lighter quick ring.
seta coop_tinnitusBlast 1
seta coop_tinnitusBlastRange 500
seta coop_tinnitusBlastFull 0.5

// SUBTLE INJURED MUFFLE: when severely wounded (below coop_woundMuffleFrac of your peak health this life),
// world SFX duck a little - "nothing too intense" - then restore as you heal / revive / respawn. While
// DOWN, the DBNO bleed-out audio fade (dbno.scr) takes over and rides toward silence at death (music stays
// on). coop_woundMuffle 0 = off; coop_woundMuffleVol = ducked volume; coop_woundMuffleFrac = severity gate.
seta coop_woundMuffle 1
seta coop_woundMuffleVol 0.65
seta coop_woundMuffleFrac 0.3

// INJURY COUGH: while severely wounded (same coop_woundMuffleFrac gate), the player gives a pained cough/
// wheeze every coop_injuryCoughInterval seconds (2D, only that client hears it), stopping once healed above
// the gate. coop_injuryCough 0 = off.
seta coop_injuryCough 1
seta coop_injuryCoughInterval 10

// ===== REVERB / OCCLUSION ZONES =====
// s_reverb enables the engine's EFX reverb system (it ships OFF). It's a SOUND-LATCHED cvar, so it only
// takes effect after a snd_restart or the NEXT launch. SMOKE TEST: after a launch with this on,
// qconsole.log must contain "OpenAL: EFX EAXREVERB initialized." - if that line is missing, EFX did not
// come up and everything below is inert.
// coop_autoReverb (default 1, cgame CG_UpdateEnvReverb): where a map authors NO reverb, the client
// auto-classifies your surroundings ~4x/sec with an up-trace from the eye - open sky = dry outdoors;
// ceiling < 256u = small room; < 640u = stone room; higher = hallway - and applies the matching EFX
// preset per player. Map-authored reverb (SoundManager .snd zones / trigger_reverb) always takes
// priority: while a zone owns the reverb the auto detector backs off, and it takes over again when
// you leave the zone. Per-client (each player hears their own environment); no server involvement.
// 2D/local sounds (tinnitus ring, DBNO heartbeat duckers, death-grunt local cues, streamed VO) are
// EXCLUDED from the reverb wet path engine-side, so "inside your head" audio never echoes.
seta s_reverb 1
seta coop_autoReverb 1
// HEADPHONES / HRTF: s_speaker_type 1 = headphones -> the engine requests OpenAL Soft's HRTF (true
// binaural 3D - the single biggest free spatial upgrade ON HEADPHONES, but wrong-sounding on speakers).
// Shipped default is 0 (plain stereo, speaker-safe). Uncomment (or set in console + snd_restart) if you
// play on headphones:
// seta s_speaker_type 1

// ===== AUDIO ENHANCEMENTS =====
// The full battlefield-audio suite (reverb above is part of it). Everything below is live-tunable.
// SUPERSONIC BULLET CRACKS: a round passing very close to your head snaps a sharp 2D crack "inside
// your head" (how a real supersonic bow wave reads), on top of the existing 3D zing for wider passes.
// coop_bulletCrack 0 = off; coop_bulletCrackDist = how close (units) a pass must be to crack (max 255).
seta coop_bulletCrack 1
seta coop_bulletCrackDist 60
// DISTANT WEAPON TAILS: gunfire from far-away shooters (players AND AI) layers a soft muffled
// crack-rumble / burst-rumble tail at the shooter, so distant firefights sound like a battlefield
// instead of dry pops. Additive - near gunfire is untouched. coop_distantFire 0 = off;
// coop_distantFireDist = how far (units) the shooter must be before the tail layers in.
seta coop_distantFire 1
seta coop_distantFireDist 2500
// AMBIENCE BEDS + COMBAT MIXING (coop_mod/ambience.scr): a subtle per-map ambience loop (gusty wind
// on snow maps, light countryside elsewhere; maps can override or opt out) that DUCKS fast when a
// fight starts and swells back after ~10s of calm, ducks while you are indoors (reads as "outside"),
// and yields to the rain bed in storms. Plus a distant artillery rumble every 20-60s of calm.
// coop_ambience 0 = off; coop_ambienceVol = bed base volume (the ducks scale under this).
seta coop_ambience 1
seta coop_ambienceVol 0.5
// [bug-1383] HOLDOUT ARENA ambient bed. Arena maps run with NO precipitation (rain leaks
// through the roofs of the interiors an arena gets built in), so this replaces the rain bed.
// Seeded HERE rather than in a tool cfg because coop_ambience_init picks its bed at prespawn,
// ~0.5s into the map - long before any tool cfg is exec'd.
//   wind | country | forest_night | night_calm | surf
seta coop_arenaAmb "forest_night"
// Distant-artillery ambience rumbles: coop_ambArtillery 0 = off; Chance (0..1) = how often a calm-cycle fires one.
seta coop_ambArtillery 1
seta coop_ambArtilleryChance 0.5

// Third-person OVER-THE-SHOULDER camera (right shoulder). Default chase cam (dist 120) is too far; pull
// it in close and offset it to the right. cg_cameradist = behind distance, cg_camerasideoffset = right
// shoulder offset, cg_cameraheight = up. Live-tunable - dial these for the exact shoulder framing.
// 2026-07-06: pushed back 50 -> 65 and lowered 14 -> 10 (user feel pass alongside the staged shoulder ADS).
seta cg_cameradist 65
seta cg_camerasideoffset 14
seta cg_cameraheight 10
// Mounted-MG42 camera. CORRECTED AGAIN (2026-06-30, from TURRETDBG data): with g_turretcameras 0 the
// diagnostic showed PMF_TURRET=1, render3rd=0, CAM_VIEW=0 - i.e. NO camera bound and NOT the 3rd-person
// path, yet the player saw their own helmet. Reason: with no turret camera, the first-person eye sits AT
// the player's own model head, so you see your own body. You MUST bind the camera (1) to move the view onto
// the gun. The camera position is then tuned live via coop_turretFp* (see TurretGun::P_ThinkActive).
seta g_turretcameras 1
seta g_turretCamDist 75
seta g_turretCamSide 20
seta g_turretCamHeight 50
seta g_turretCamPitch 8
// MG42 view: STOCK is each gun's own .tik viewOffset (coop_turretTune 0 = default, safe for ALL turrets).
// coop_turretTune 1 = TEMPORARY live override to dial in ONE gun's framing: while mounted, set coop_turretTune
// 1 then nudge coop_turretViewUp (raise to the gun's sight line), coop_turretViewFwd (- = behind / + = toward
// muzzle), coop_turretViewSide. Once it looks right, tell me the 3 numbers - I bake them into that gun's .tik
// viewOffset (per-gun, never touches other turrets) and set coop_turretTune back to 0.
seta coop_turretTune 0
seta coop_turretViewFwd -20
seta coop_turretViewUp 16
seta coop_turretViewSide 0
seta coop_ads_dbg 0
// ===== ADS (RMB) + BASH / secondary-fire (V) =====
// ADS is now its own dedicated button (+button13 = BUTTON_COOPADS), decoupled from secondary-fire so the
// native weapon BASH works again. Default layout: RMB = aim down sights, V = bash (secondary fire). Both
// are rebindable in Options > Controls ("Aim Down Sights" / "Secondary Attack (Bash)"). autoexec runs
// AFTER the player cfg, so we re-assert these defaults over any stale persisted mouse2 bind.
bind mouse2 "+button13"
bind v "+attacksecondary"

// HZM coop UI fix - default key for the coop objectives toggle.
// BIND.SCR registers the action "Coop Objectives" -> "vstr coop_obj" in
// Options > Controls, but ships with NO default key bound (the bind line in
// ui/coop_objectives/obj_bindkey.cfg is commented out), so out of the box the
// objectives hud can never be shown until the player assigns a key. Provide a
// sensible default of 'o' so it works immediately.
//
// NOTE: autoexec.cfg is exec'd AFTER the player's own config
// (qcommon/common.c: exec configs/<player>.cfg then exec autoexec.cfg) and
// seta always overwrites (Cvar_Set2), so this default re-applies every launch.
// If a player wants a different key, rebind "Coop Objectives" in Options >
// Controls AND change/remove this line (the controls-menu rebind is now
// usable thanks to the localization fix in global/localization_coop.txt).
// 'o' is unbound in stock MOHAA, so this does not clobber a default action.
bind o "vstr coop_obj"

// Give coop_obj a launch-time default so the toggle is never a no-op. It is
// normally (re)set every spawn by ui/coop_objectives/obj_setup.cfg ->
// obj_reset.cfg, but in the pre-spawn window (main menu, just-connected) the
// cvar is still unset and "vstr coop_obj" does nothing - which looked like the
// 'o' key "not working" intermittently. Default it to the show branch; the
// per-spawn reset keeps it in sync with the actual hud state afterward.
seta coop_obj "exec ui/coop_objectives/obj_add.cfg"
// [user 07-12] OBJECTIVES: back to the ORIGINAL URC menu (coop_objPanel 0). The classic menu now word-wraps:
// long objective text is split server-side into a second line (coop_oNb cvars + second-line labels in
// ui/coop_objectives.urc), since the engine's UILabel can't wrap on width. coop_objPanel 1 re-enables the
// experimental script-drawn panel (deprecated - it double-displayed with the URC menu and was retired).
seta coop_objPanel 0

// Ambient bed volume (s_ambientvolume = mus mood system). Default 1.00 is too hot
// and drowns SFX with clipping. 0.6 is balanced with s_volume/s_musicvolume at 0.9.
// s_ambientvolume: default relocated to coop_defaults.cfg so your changes persist across restart.

// Music + effects baselines. The engine default s_musicvolume is only 0.25, which left the
// soundtrack barely audible on EVERY map - nothing was actually setting it. The mod is balanced
// around 0.9 for both (see ambient note above), so set them explicitly here.
// s_musicvolume: default relocated to coop_defaults.cfg so your changes persist across restart.
// s_volume: default relocated to coop_defaults.cfg so your changes persist across restart.

// Force OpenAL output to a real physical device. The Windows default was the SteelSeries Sonar
// "Gaming" VIRTUAL device, which is silent unless the Sonar app is running and routing it - that
// produced "no audio" even though the engine reported sound working. Latched: takes effect at
// launch (or after snd_restart). To change: pick any name from the s_alAvailableDevices cvar.
// s_openaldevice: default relocated to coop_defaults.cfg so your changes persist across restart.

// Mirror all console output to qconsole.log (flushed per-line for live tailing)
seta logfile 2

// Far-clip overrides are intentionally OFF (0 = defer to each map's baked farplane).
// We do NOT inflate the far-clip anymore: it doubles as the fog end distance, so
// raising it erased all map fog. The paradrop/bombing run now fly LOW & close to stay
// inside the native far-clip, preserving fog.
seta sv_cheats 1

// HD texture packs (zzzzz-AA_HD_*, zzzzzz-HRRTM_*) ship DXT-compressed .dds textures. The engine
// only loads .dds when S3TC compression is enabled, which is OFF by default - without this the .dds
// surfaces silently fall back to base-res. LATCHED, so it needs a full relaunch to take effect.
// r_ext_compressed_textures: default relocated to coop_defaults.cfg so your changes persist across restart.

// ===== EXTRA QUALITY (verified vs engine defaults; the rest of the community "max" config is already default) =====
// r_fastentlight: default relocated to coop_defaults.cfg so your changes persist across restart.   // HQ per-entity lighting (engine default 1 = cheap/fast) -> better-lit soldiers/props
// cg_marks_add: default relocated to coop_defaults.cfg so your changes persist across restart.   // wall bullet-hole / scorch decals ON (engine default 0)
// r_drawstaticdecals: default relocated to coop_defaults.cfg so your changes persist across restart.   // static world decals ON (engine default 0)
// cg_effectdetail: default relocated to coop_defaults.cfg so your changes persist across restart.   // fullest particle/effect density (engine default 0.2; also the Advanced GFX slider max)
// vss_draw: default relocated to coop_defaults.cfg so your changes persist across restart.   // volumetric smoke system ON (engine default 0) -> 3D smoke instead of flat sprites
// vss_maxcount: default relocated to coop_defaults.cfg so your changes persist across restart.   // max simultaneous volumetric smoke puffs (engine default; lower if it ever costs FPS)

seta r_farplane 0
seta r_farplane_nofog 0
seta r_farplane_nocull 0

// Reset map tester on every launch. coop_maptest is archived (seta), so without
// this reset a previous maptest session's "seta coop_maptest 2" would persist and
// auto-rotate maps during normal play. Run maptest_start.cfg to re-enable.
seta coop_maptest 0

// Map rotation auto-boot: if maptest_autoboot.cfg exists it starts the rotation.
// Delete or empty that file to return to normal launch behavior.
exec maptest_autoboot.cfg

// ===== DYNAMIC WEATHER (v1) =====
// Random rain/snow storms that build, hold, and clear - theme-gated per map (rain never on snow maps,
// snow never elsewhere, nothing on desert/indoor maps). The engine renders precipitation GLOBALLY around
// each player and SKY-GATES every column (up-trace), so it works on any map (no rain brush needed) and
// never falls into interiors / under roofs. coop_dynWeather 1 = system armed, but NO weather appears unless
// a map is themed (level.coop_weatherTheme) OR you force one below.
//   TESTING: set  coop_weatherForce rain   (or snow) + coop_weatherStartStorm 1, then load the map -> a
//   storm begins right at spawn. Set coop_weatherForce "" to fall back to the map's own theme.
seta coop_dynWeather 1
// RANDOM WEATHER (2026-06-30): storms come and go on their own - no longer forced-continuous.
// PER-MAP THEMES (2026-07-01): every coop map now sets its own level.coop_weatherTheme (snow / rain / none)
// in maps/<map>.scr, so coop_weatherForce is now "" (empty = defer to the map). rain falls on temperate
// EU maps (Norway/Italy/Normandy/Nijmegen/Dutch/Berlin), snow on winter maps (Ardennes/Bulge, snowy
// Germany, m2 estate), and NOTHING on desert (North Africa) / interior (U-boat pens, Fort Schmerzen,
// bunkers) maps. Set coop_weatherForce "rain" or "snow" to OVERRIDE the map's theme for testing.
seta coop_weatherForce ""          // "" = use each map's level.coop_weatherTheme; set rain/snow/off to override
seta coop_weatherStartStorm 0      // spawn CLEAR, not mid-storm
seta coop_dynWeatherChance 0.6     // 60% chance to storm after each clear gap (else stays clear another gap)
seta coop_dynWeatherClearMin 180   // clear stretches: 3-7 min between storms
seta coop_dynWeatherClearMax 420
seta coop_dynWeatherStormMin 70    // storm holds: ~1-3.7 min
seta coop_dynWeatherStormMax 220
seta coop_dynWeatherMax 0.45
seta coop_dynWeatherThunder 1
seta coop_dynWeatherLightning 1    // visual lightning flash during rain storms (0 = thunder sound only)
// --- WEATHER v2 (native SP system): coop_mod/weather.scr now drives the native global/weather.scr for
// rain/thunderstorms so they look exactly like single-player. coop_weatherPin "" = dynamic storms that
// build + ease (default); 0-3 = hold a fixed intensity (0 calm .. 3 downpour). Snow is static SP snow at
// coop_snowDensity. NOTE: the coop_dynWeather* and coop_rain*/coop_snow* LOOK cvars below drove the OLD
// custom renderer (now retired) and are no longer read - kept for reference; the SP values are baked into
// coop_mod/weather.scr (snow = m6l1a config, rain = textures/rain x12).
// BOTH rain and snow are now FLUID + RANDOM by default: a random-walk driver drifts intensity so light rain
// builds into thunderstorms / light snow into blizzards and eases back, unpredictably (native weather.scr
// smooths every transition). coop_weatherPin: "" = fluid random (default); "cycle" = native fixed escalation
// cycle; 0..3 = hold a fixed intensity (0 calm .. 3 storm/blizzard).
seta coop_weatherPin ""            // "" fluid random (default) | cycle | 0..3 fixed
seta coop_snowDensity 0.2          // (legacy) no longer read - snow density is now driven dynamically
seta coop_weatherDryMin 180        // after weather fully clears, dry-spell seconds (min) before it can build again
seta coop_weatherDryMax 420        // dry-spell seconds (max) - longer real dry periods between storms (3-7 min, per user "more dry spells")
// ONSET/CLEAR smoothness: the storm now eases IN and OUT with a smoothstep curve (creeps in imperceptibly
// instead of popping to visible rain). These are the seconds it takes to roll in / clear out - raise them
// for an even more gradual, seamless transition.
seta coop_dynWeatherBuild 26       // seconds for a storm to build to full intensity
seta coop_dynWeatherFade 20        // seconds for a storm to clear
seta coop_dynRainGlobal 1
// --- precip LOOK (live-tunable; weather.scr re-applies every ~3s while a storm is active) ---
// RAIN must be FAST + LONG to read as rain (the engine's own rain default is speed 2048 / length 90).
// speed = fall speed, length = streak length, slant = horizontal drift, speedVary = per-drop speed jitter.
seta coop_rainSpeed 2048
seta coop_rainSpeedVary 400
seta coop_rainSlant 80
seta coop_rainLength 80
seta coop_rainWidth 1
// SNOW is the opposite: slow, short, small, gently drifting flakes. TUNED DOWN 2026-07-01 (was speed 150 /
// length 5 / width 3 = "giant snowflakes"): smaller/gentler flakes now. Keep speed WELL under 800 so the
// cgame rain-on-lens wet effect never triggers on snow (it gates rain vs snow on fall speed >800).
seta coop_snowSpeed 110
seta coop_snowSpeedVary 40
seta coop_snowSlant 14
seta coop_snowLength 2
seta coop_snowWidth 1.5
// Rain is also DYNAMIC: while a storm falls, weather.scr continuously varies speed/slant/length (intensity
// scaling + random gusts) so it never looks uniform. coop_rainVolume = peak loudness of the levelwide rain
// ambience loop (volume tracks storm intensity; 0 = silent).
seta coop_rainVolume 0.85

// ===== MODEL LOD (level of detail) =====
// Skeletal models (soldiers, props) drop to lower-poly LOD versions as they shrink on screen. The metric is
// the model's projected screen radius (GetLodCutoff / R_CalcLod). Stock defaults (r_lodscale 5 / r_lodcap
// 0.35) drop detail at a fairly short range. Raised here so high detail PERSISTS much further out:
//   r_lodscale = how far full detail holds (higher = detail kept at smaller on-screen size = further away)
//   r_lodcap   = the overall detail CEILING, 0..1 (higher = richer; 1.0 = allow full detail, no cap)
//   r_uselod 0 = disable model LOD entirely -> MAX poly on every model at all ranges. THIS is the ship default.
// All live-tunable in console. If distant crowds ever cost FPS, set "r_uselod 1" to re-enable the LOD system
// (it still keeps high detail via r_lodscale 28 / r_lodcap 1.0, just drops the very-distant/tiny models).
// r_uselod is CVAR_TEMP so it MUST be `set` here every launch to stay off.
// r_lodscale: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_lodcap: default relocated to coop_defaults.cfg so your changes persist across restart.
// r_lodviewmodelcap: default relocated to coop_defaults.cfg so your changes persist across restart.
set r_uselod 0

// ===== COOP GAMEPLAY FEEL =====
// Uniform weapon movement speed: every gun moves at the same multiplier instead of varying per-weapon
// (default 0.89 = the BAR's, the heaviest, so movement is consistent + a bit slower). 0 = per-weapon vanilla.
seta coop_weaponMoveSpeed 0.89
// Brass casings linger on the ground (players AND AI) for this many seconds before fading, instead of the
// vanilla ~2s. Capped by cg_max_tempmodels (old brass recycles). 0 = vanilla. Lower if it ever costs FPS or
// crowds out other effects in a long firefight.
seta coop_brassLife 45

// ===== POST-UPDATE ANNOUNCEMENT =====
// The auto-updater writes whatsnew_pending.cfg next to this file: after an update it contains a
// deferred "pushmenu coop_whatsnew" (the What's New card at the main menu); on an up-to-date
// launch it is rewritten as a comment so the card shows exactly once per update. Missing file
// (dev machines / direct exe launches before the first updater run) just prints a console line.
exec whatsnew_pending.cfg

// FIELD OF VIEW: set from Options -> Video (slider next to Brightness). The engine sends the fov
// userinfo key; the server clamps 80-160 and re-applies it automatically after uniform changes.
// The old coop_fov cfg picker (g_m2l1 name-append) is retired - blank any leftover armed value.
seta g_m2l1 ""

// [302] HZM XP system (Phase 1). coop_xp 0 disables entirely; scale tunes all awards;
// summary time = end-of-map debrief card seconds (0 = skip card, awards still land).
seta coop_xp 1
seta coop_xp_scale 1
seta coop_xpSummaryTime 28
// [user 07-12] "Made It" end-of-mission bonus: players ALIVE within coop_xpEndRadius units of the
// mission-end point earn +coop_xpEndBonus XP - rewards sticking together and reaching the exit.
// 0 disables. Radius is generous (exit trigger areas are large; laggards across the map miss it).
seta coop_xpEndBonus 75
seta coop_xpEndRadius 2500
// stable per-install player identity for the XP save files (guid no longer salted per server;
// must be set from day one, BEFORE any XP records exist)
seta cl_guidServerUniq 0

// ===== QUICK LOBBY TEST COMMANDS =====
// Registers the lobby1..lobby5 console aliases every launch (they DON'T survive a game restart
// otherwise - that's why "lobby5" read as an unknown command). Type lobby1..lobby5 in the console
// to jump straight to any campaign lobby. Source: coop_mod/cfg/lobbytest.cfg.
exec coop_mod/cfg/lobbytest.cfg

// ===== HELMET SWITCHER [305] =====
// Live helmet changer: cycle your soldier's helmet (Standard Issue / No Helmet / Plain / Netted /
// 29th / Sergeant / Captain / Lieutenant / Medic / Engineer ...) and every teammate sees it.
// [user 07-18] No Controls-menu bind anymore - helmets are changed via the Armory / lobby wardrobe.
// Console-only fallback:  bind ] "append name ,hnx"  and  bind [ "append name ,hpx"
// FITMENT [user 07-12 follower edition]: LIVE-tunable fit of the worn helmet prop - changes apply
// the very next frame (no re-press needed). One set of values fits all US models (shared skeleton).
//   X = units toward the face / -back   Y = units to the player's right / -left   Z = up onto the crown
//   Pitch/Roll = cancel the static prop's authored ground-pose tilt   Yaw = spin the brim forward
// [user 07-12] NUMPAD TUNER RETIRED: the helmets now use EXACT-FIT meshes (models/coop_helmets/) with
// the worn helmet's own head-local geometry baked in - mathematically identical placement, nothing to
// tune. The fit cvars below are ignored by the exact-fit path (kept for the retired follower recipe).
bind KP_STAR  ""
bind KP_PLUS  ""
bind KP_MINUS ""
bind KP_SLASH ""
bind KP_DEL   ""
seta coop_helmetX 0
seta coop_helmetY 0
seta coop_helmetZ 6
seta coop_helmetPitch 0
seta coop_helmetYaw 0
seta coop_helmetRoll 0
seta coop_helmetScale 1

// ===== AI MG42 ACCURACY vs SMALL SQUADS [307] =====
// Mounted axis MG42s aim at you plus a random offset that TIGHTENS with range (near-pinpoint up
// close). With only 1-2 players that shreds you. This widens their aim offset for small squads and
// scales back to vanilla at 3+ players (1p = x2.2 wider, 2p = x1.6, 3+ = x1). Set 0 to disable
// (full vanilla accuracy at every player count). Values live in global/mg42_active.scr.
seta coop_mg42AiAccuracyScale 1

// [user 07-29] CUBEMAP REFLECTIONS - PARKED, not shipping. The renderer support is finished and
// working (auto probe placement from info_pathnode, bake-order fix; see bug-1237), but on MOHAA's
// matte outdoor content the payoff did not justify the load-time and per-frame cost. Forced off
// here rather than left to the archived config, because r_cubeMapping and r_baseGloss are both
// CVAR_ARCHIVE|CVAR_LATCH: a value set during testing persists across launches, and autoexec execs
// AFTER the saved config so this is the only layer that reliably wins.
// To pick this back up: r_cubeMapping 1 + r_baseGloss ~0.45, full restart (never vid_restart -
// bug-1181). r_cubemapAuto is the probe budget and applies on the next map load with no restart.
seta r_cubeMapping 0
seta r_baseGloss 0.3

// [TEMPORARY - bug-1236 diagnosis] Helmet-restore trace. coop_helmetDebug is NOT archived, so an
// rcon set dies on the next relaunch and the probe silently reads "" - which is exactly how two
// test revives got logged with no trace at all. Seeded here so it survives restarts.
// REMOVE once the DBNO helmet restore is confirmed. Console/log only, nothing is drawn to players.
seta coop_helmetDebug 1
