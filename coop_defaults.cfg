seta rate 60000
seta cl_maxpackets 60
seta snaps 40
seta cl_timenudge 0

// [user 2026-08-10] profile-mirror channel probe (temporary; remove once the hop is proven)
seta coop_profProbe 1

// m3l3 church defence - wave pressure (see M3L3.scr::coop_churchWaves). These scale around a
// TWO-player baseline, so a solo player gets base - per, i.e. 14 - 5 = 9 attackers alive at once.
seta coop_chWaveBase 14      // attackers alive at the 2-player baseline
