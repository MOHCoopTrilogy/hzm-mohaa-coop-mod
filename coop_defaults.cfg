// ============================================================================
// HZM Coop - CURATED OPTION DEFAULTS  (GENERATED: scratchpad/split_options_persist.py)
// 
// The engine execs this file BEFORE the saved config (qcommon/common.c: after default.cfg,
// before configs/<player>.cfg), so these are only DEFAULTS: the player's saved config loads
// AFTER and overrides any option they changed in the menus -> option changes now PERSIST across
// restarts. (Previously these lived in autoexec.cfg, which runs AFTER the config and re-forced the
// default every launch, wiping the player's choice.) Every cvar here is menu-controlled.
// Non-option / forced / session cvars stay in autoexec.cfg (they must re-apply each launch).
// ============================================================================

