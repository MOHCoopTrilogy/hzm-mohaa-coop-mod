// [user 07-29] AI-MANNED TURRET FEEL (Omaha MG42s "way too accurate").
// g_turret_spread is declared and registered in the engine with a default of 16 and then read by
// NOTHING - AI turrets have always fired at whatever the TIK carries, which for a mounted MG is
// effectively zero spread. Damage was already at 40% and it did not help, because 40% of a
// guaranteed hit is still a guaranteed hit. coop_mg42AiSpread is the missing half: a spread FLOOR
// (TIK bulletSpread units) applied to AI shots only - player-manned turrets keep full accuracy.
// m3l1b rear push: ranger health, and the manned-MG-nest geometry for build mode.
// Allies were on a flat 400 while the rear nav graph was dead and they never moved; once
// maps/m3l1b.pth let them actually advance, 400 did not survive the crossing.
seta coop_allyHealth 1500   // rangers on the m3l1b rear advance (sgt/lt get 1.5x)
seta coop_mgnestFwd 66      // build-mode manned MG nest: gun distance IN FRONT of the gunner
seta coop_mgnestUp 44       // build-mode manned MG nest: gun height ABOVE the gunner's feet
// MG42 gunners abandoning working emplacements the moment they spot you. Retail decided "should I
// keep this gun" with AI_CanTarget, an AIMING test against the turret's pitch caps - and the
// shipped nests set those to a ~25 degree window ("pitchcaps" "-15 10 0"), so a player barely off
// the barrel's height read as unengageable. They now hold the gun whenever there is a shot to be
// had. They now hold the emplacement until they are killed.
// Looted weapons hand over ONE MAGAZINE, not the deathmatch stockpile. coop runs g_gametype 2,
// so the engine only ever sees the tik's `dm startammo` - a dead German's Kar98 was worth 80
// rounds instead of 5. Also makes a weapon you already carry always takeable off a corpse.
// Bolt-action actors work their bolt between shots again. Retail shipped the rechamber block
// in anim/reload.scr COMMENTED OUT, so no AI has cycled a bolt since 2002. 2 = play the anim
// without blocking the actor (coop default - the retail path waits on every shot, which does
// not scale to a garrison shooting at four players). 1 = retail blocking. 0 = off.
seta coop_aiRechamber 2
seta coop_pickupOneMag 1    // 0 = retail deathmatch pickup amounts
// Placeable flak 88 (build mode, STRUCTURES). Fires a scripted shell at the closest LIVING
// player, re-picked every shot. Scatter is how far the round can land from him.
seta coop_flakInterval 6    // seconds between rounds
seta coop_flakScatter 160   // impact scatter in units; lower = deadlier
seta coop_mgStay 1          // gunners man their MG until death. 0 = retail (they bail once spotted)
seta coop_mgnestGunnerUp 0  // raises the GUNNER off the ground (coop_mgnestUp raises the GUN)
seta coop_mgnestPitch 60    // nest gunner's pitch cone. Outside it AI_CanTarget fails and he
                            // ABANDONS the gun to fight on foot. Stock TurretGun is 45; the BSP's
                            // own bunker nests are tighter still, which works only because you
                            // always approach those through the arc they cover.
// [user 2026-08-16] bug-1851 - SPREAD IS NOT ACCURACY, and the note above only got half of it.
// Spread scatters bullets around wherever the barrel points; AI_DoTargetAutoTrack pointed it at the
// enemy's centroid EXACTLY, every frame, so widening the cone still centred that cone on the
// player's chest. coop_mg42AiAimOff moves the AIM POINT: a random error re-rolled every 0.7-1.6s so
// a burst walks across the target and the gunner corrects between bursts. Scaled by range, so the
// value is world units of error per 1000u of distance. Higher = misses by more. 0 = vanilla.
// This is the knob to reach for first when MG42s feel laser-guided; damage is the blunter tool.
seta coop_mg42AiAimOff 100
// [user 2026-08-17] Scripted MG42 nests (mg42_active.scr - Omaha, m3l3's town) pick their aim
// offset from RANGE TIERS that start at 1801u, so a nest fought closer than that aims dead on the
// player with no scatter whatsoever. This multiplies the distance fed to that picker: 3.5 puts a
// ~520u engagement into the first tier. It does NOT change how far they can see or shoot.
seta coop_mg42AiRangeMult 3.5
seta coop_mg42AiSpread 300	// [user 2026-08-19] bug-1940: was a placebo at 45 (added to bulletspread, which manned-turret fire NEVER reads); now feeds m_vAIBulletSpread - uniform +-units at bulletrange 4000, retail e1l1 band 300-450
seta coop_mg42AiDamage 40
seta coop_phoneGag 1		// m1l2b: answering the ringing telephone plays the gag clip; 0 = leave it ringing (retail)
seta coop_build_angleStep 1	// build mode: yaw/pitch step in degrees (snap mode still forces 45)
seta coop_subEscape 1	// m2l2b: escape the U-boat and watch her go from the dock, instead of the 75s in-boat blast
seta coop_stealthStart 1	// m2l2a papers-only stealth route + the Phase C contain. ON 2026-08-10
			// once Phase C was verified end to end. NOTE autoexec.cfg force-sets this
			// too and is what actually decides - it execs AFTER the saved config
			// (TRAPS T7), so a player holding an archived 0 is only moved by that line.
seta coop_stealthNoAggro 0	// aggro-gate layer treats UNSET as ON; explicit 0 = HZM baseline
seta coop_disgAggroParity 1	// [2026-08-10] Phase A kill switch: 0 skips the disguise-deference gate in
			// aihandler.scr::attackPlayer for EVERY target and disables Step 4's scene-actor
			// exemptions - i.e. exactly the pre-Phase-A behaviour. Master plan v2 Step 0 / A0.
seta coop_stealthRecoverAlarm 1	// [2026-08-10] D1 kill switch: 0 makes an alarm strip disguises PERMANENTLY
			// (pre-D1 behaviour). Read by takeAllDisguises' permanent derivation in Phase C;
			// no reader yet. Seeded now so all five seed sites stay in sync.
seta coop_enigmaDecrypt 10	// m2l2b: seconds to decrypt the Enigma before it opens
// ----- [user 2026-08-10] Phase C, the player-initiated CONTAIN (coop_mod/bust.scr) -----
// Seeded here rather than left to a script fallback branch: an unseeded cvar makes getcvar return
// "" on a clean profile and a fallback silently decides behaviour, which is only "a default" in the
// loosest sense (TRAPS T7). All three are read by script ONLY - no engine Cvar_Get exists for them,
// so the bug-1669 empty-creation trap does not apply and these are safe to seed from a cfg.
seta coop_bustUseRange 112	// units from the officer within which "Press [USE] to Contain The Situation"
			// shows and the bash is guaranteed. ~9ft; the papers check happens closer than this.
seta coop_bustHintRange 400	// units at which the FIRST-CONTACT officer advisory fires. Far wider than
			// coop_bustUseRange on purpose - a warning delivered at bash range is a
			// caption, not a warning. Tested as a 2D distance plus a 96u vertical band,
			// so standing directly above him on another floor does NOT trigger it.
seta coop_bustHintTime 6	// seconds that advisory holds the DBNO line before it clears.
			// Once per player, and retired for good after a situation has been contained.
seta coop_bustStagger 4.5	// seconds the bashed officer is held in THINKSTATE_PAIN. This is the window to
			// put a silenced round in him; survive it and he gets up and raises it. Was 3.0 on
			// the first live run and the user could not finish him in time - the issued kit
			// takes ~1s to land, so the window has to comfortably outlast that.
seta coop_bustBashDamage 15	// damage the bash itself does. Must never be lethal - the PLAYER gets the kill.
seta coop_bustBashFloor 40	// the stun's re-hits stop at this % of the officer's starting health, so a long
			// stun can never finish him by attrition.
seta coop_bustClearTime 10	// seconds the body must go unseen after he drops before "Situation Contained".
			// User: "If after 10 seconds no one sees the body, you're clear."
// ----- the body outlives the containment: found AFTER the window = a local investigation -----
seta coop_bustBodyRadius 320	// units around the corpse that count as "hanging around" it (~27ft)
seta coop_bustBodyGrace 15	// seconds you may stay inside that radius while the finder investigates
			// before your cover is blown. Resets the moment you step out - it is a
			// LEAVING timer, so walking away always works and lingering never does.
seta coop_bustBodyLife 0	// seconds to keep HUNTING for someone to find the body (0 = the whole
			// mission). Bounds only the search: once the body HAS been found the area
			// stays under investigation for the rest of the map, which is both the right
			// fiction and cheaper - the cansee sweep stops the moment a finder latches.
// ----- m2l2a quiet Naxos sabotage -----
seta coop_naxosHold 2.5		// seconds of held USE to sabotage the Naxos quietly
seta coop_naxosRoomRadius 512	// units from the device that count as "in the Naxos room" - the range at
			// which you are told to wait for the scientists to be distracted. Distinct
			// from the 128u reach that actually arms the hold.

// ===== [user 2026-08-10] T1.1 - network defaults =====
