// ============================================================================
// HZM Coop - CURATED OPTION DEFAULTS  (GENERATED: scratchpad/split_options_persist.py)
// 
// The engine execs this file BEFORE the saved config (qcommon/common.c: after default.cfg,
// before configs/<player>.cfg), so these are only DEFAULTS: the player's saved config loads
// AFTER and overrides any option they changed in the menus -> option changes now PERSIST across
// restarts. (Previously these lived in autoexec.cfg, which runs AFTER the config and re-forced the
// default every launch, wiping the player's choice.) Every cvar here is menu-controlled.
// Non-option / forced / session cvars stay in autoexec.cfg (they must re-apply each launch).
// ============================================================================

seta cg_crosshairSize 0.5
seta cg_effectdetail 1    // fullest particle/effect density (engine default 0.2; also the Advanced GFX slider max)
seta cg_freecam 0
seta cg_marks_add 1         // wall bullet-hole / scorch decals ON (engine default 0)
seta cg_max_tempmodels 1100
seta cg_shadows 2
seta cg_sprintLower 1
seta cg_tracerGlow 1.8
seta cg_weaponLag 0.7
seta coop_bloodTrail 1
seta coop_chalPopup 1
seta coop_goreDrip 1        // gore tier 2: looping blood drip on badly wounded humans + fresh corpses
seta coop_gorePool 1        // gore tier 2: corpse blood pool GROWS in steps instead of stamping full-size
seta coop_smokeWhip 1
seta coop_tinnitus 1
seta r_drawstaticdecals 1   // static world decals ON (engine default 0)
seta r_ext_compressed_textures 1
seta r_fastentlight 0       // HQ per-entity lighting (engine default 1 = cheap/fast) -> better-lit soldiers/props
seta r_grass 0
seta r_lodcap 1
seta r_lodscale 28
seta r_lodviewmodelcap 1
seta r_postProcess 1
seta r_ppBloom 1
seta r_ppBloomIntensity 1.3
seta r_ppBloomThreshold 0.6
seta r_ppContrast 0.96
seta r_ppDoF 1
seta r_ppDoFFocus 0
seta r_ppDoFIntensity 0.6
seta r_ppDoFRange 1200
seta r_ppExposure 0.865903
seta r_ppFXAA 1
seta r_ppGrade 0
seta r_ppHeatHaze 1
seta r_ppLowHealth 1
seta r_ppSSAO 1
seta r_ppSSAOBias 0.1
seta r_ppSSAODepthAware 1
seta r_ppSSAOIntensity 0.08596
seta r_ppSSAORadius 2
seta r_ppSaturation 1.16
seta r_ppSunShaftIntensity 0.5
seta r_ppSunShafts 1
seta r_ppSuppressAmount 1
seta r_ppSuppression 1
seta r_ppTonemap 1
seta s_ambientvolume 0.6
seta s_musicvolume 0.9
seta s_volume 0.9
seta vss_draw 1             // volumetric smoke system ON (engine default 0) -> 3D smoke instead of flat sprites
seta vss_maxcount 22        // max simultaneous volumetric smoke puffs (engine default; lower if it ever costs FPS)

// -- custom menu options that were never archived before (seed here so they persist) --
seta coop_xpKillPopup 1    // XP kill-popup toggle (Coop Settings) - archived so the menu choice persists


