// ===== DISPLAY - first launch auto-detects the Windows NATIVE resolution =====
// SEEDS ONLY - this file execs BEFORE the saved config, so a player's picked values always win.
// FIRST-LAUNCH NATIVE DETECT (bug-753 addendum, engine sdl_glimp.c GLimp_SetMode): while
// r_resAutoDetected is 0 the engine adopts the desktop resolution (SDL_GetDesktopDisplayMode,
// primary display) as r_mode -1 + r_customwidth/height, then archives the flag = 1 so it never
// re-fires and never fights a later manual pick. Existing configs lack the flag, so it fires ONCE
// for them too and lands them on their native res. The 1080p seeds below are therefore just the
// PRE-DETECT FALLBACK (and the shipped default on engines without the rebuilt exe).
// RECONCILED with the Video Options resolution picker (bug-753): the picker writes this SAME cvar
// set (r_mode -1 + r_customwidth/r_customheight, all archived+latched), so a pick persists across
// restarts and these seeds never fight it. Do NOT move any of these to autoexec.cfg (runs AFTER
// the config = would re-force the default every launch and wipe the player's pick).
// NOTE: with r_desktopfullscreen 1 (Borderless) the current exe always sizes the window to the
// DESKTOP, ignoring the picked size; the sdl_glimp.c borderless fix (needs exe rebuild) makes a
// non-native pick open a centered borderless window of exactly the picked size instead.
seta r_resAutoDetected 0
seta r_mode -1
seta r_customwidth 1920
seta r_customheight 1080
seta r_fullscreen 1
seta r_desktopfullscreen 1
seta ui_displaymode 1


