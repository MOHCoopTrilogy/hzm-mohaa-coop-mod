// XP par-time bonus (xp.scr::xp_mission_bonuses). Seconds; 0 = no par set, no bonus. Opt-in per
// map - set it from the map script once a realistic clear time is known for that mission.
seta coop_xp_parTime 0

// ============================================================================
// GORE - decapitation, headshot faces, bullet holes, breath-hold accuracy
// ============================================================================
// DECAPITATION (game.dll Sentient::CoopGoreTryDecapitate). Explosive deaths - grenades,
// rockets, artillery, landmines, direct projectile hits - plus shotguns. Never bullets,
// never players. The severed head is the victim's own model in bind pose, so no new art.
// coop_decapBudget is the SAFETY VALVE, not a taste setting: it caps decaps per SERVER
// FRAME so one grenade into a count-scaled horde cannot spawn dozens at once, which is
// exactly what made the first attempt (bug-856) stutter every AI on the map.
seta coop_decap 1               // master on/off
seta coop_decapChance 30        // percent chance on a qualifying death (100 = always)
seta coop_decapBudget 3         // max decaps per server frame - do not raise casually
seta coop_decapLife 0           // 0 = heads persist like corpses; >0 = fade out after N seconds
seta coop_decapMax 32           // most severed heads alive at once; the oldest fades when exceeded
// [2026-08-21, pre-release audit] WAS 16, which silently DEFEATED the 2026-08-18 engine fix.
// sentient.cpp:3256 raised the default 16 -> 32 because the user reported "the heads disappear
// still"; 32 is COOP_DECAP_MAX_HEADS, the existing ring size. But the cvar is CVAR_ARCHIVE and
// this seed execs over it, so the shipped value stayed 16 and the fix never reached anyone.
// Same trap as the stale archived coop_mg42AiSpread 45 (caught live by TURSPREAD): when an
// engine default is corrected, the cfg seed for it has to move too or it is the seed that wins.

// SHOOTING THE DEAD (bug-1975). Standing rule: "all models should be susceptible to
// complete annihilation by shooting them even if dead." Bodies have been shootable since
// bug-1321, but Sentient::ArmorDamage returned immediately on any dead sentient, so every
// gore path on a corpse hit was unreachable - all a body did was bleed. With this on, a
// corpse still takes blood tiers, bullet holes, a disfigured face from a headshot, gib
// skins and a head off a blast. It NEVER takes health, pain, knockback or an AI reaction.
// coop_corpseGoreBudget is the safety valve, same idea as coop_decapBudget: wound props
// spawned per corpse hit are capped per SERVER FRAME, because emptying magazines into
// bodies is sustained and a shotgun blast is ~10 hits in one frame.
seta coop_corpseGore 1          // master on/off for post-death gore
seta coop_corpseGoreBudget 6    // max corpse wound props spawned per server frame

// HEADSHOT FACE: a confirmed headshot KILL forces the head to the gib-tier (disfigured)
// face. Uses art that already shipped; ordinary damage still never paints a face.
seta coop_goreHeadshotFace 1

// BULLET HOLES (wound props). NOTE coop_goreWounds must be 1 or NO holes appear at all.
// coop_goreWoundMax is how many a single body carries; once full the OLDEST is recycled,
// so holes follow where you are shooting now instead of stopping after the first few.
seta coop_goreWounds 1
seta coop_goreWoundMax 8

// HOLD-BREATH ACCURACY: while aiming AND holding the walk key, semi-auto weapons tighten.
// This is a SPREAD MULTIPLIER, so LOWER is more accurate: 0.10 leaves a tenth of the cone,
// 1.0 disables the bonus. It expires with the breath budget (cg_breathHoldTime) and clears
// the moment you release, so it can never leave you permanently steady.
seta coop_breathAccuracy 0.10

