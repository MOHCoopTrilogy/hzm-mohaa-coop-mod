// HZM Coop recommended CLIENT settings.
//
// [user 2026-08-10] T1.2 - REWRITTEN. Exec'd by the client-side network button
// (ui/joininternetgame.urc). Its previous contents were a silent DOWNGRADE:
//     rate 14000       <- well under what a modern connection handles
//     snaps 20         <- halved the snapshot rate, so the client saw the world at 20Hz
//     cl_timenudge 10  <- ADDED 10ms of prediction lag on purpose
// The values below match coop_defaults.cfg, so pressing the button re-asserts the shipped
// defaults instead of quietly reversing them.
set cl_maxpackets 60;   // outgoing command packets/sec
set rate 60000;         // client data rate
set snaps 40;           // snapshots/sec requested - matches sv_fps 40
set cl_timenudge 0;     // never add artificial latency
set cl_eventlimit 1000; // default 500
// NOTE: the old file also had `set cl_packetup 0`. There is no such cvar - the real one is
// cl_packetdup - so that line only ever created a dead cvar. Dropped rather than "fixed":
// cl_packetdup 0 is already the default and duplicating packets is not wanted here.
globalwidgetcommand coop_clientNetConfigurationBtn title "Configuration loaded..."
