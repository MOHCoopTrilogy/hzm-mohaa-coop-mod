// HZM Coop recommended SERVER settings.
//
// [user 2026-08-10] T1.2 - REWRITTEN. This file is exec'd by the "Load HZM Coop-Network-Server
// Configuration" button (ui/coop_start.urc). Its previous contents were a silent DOWNGRADE:
//     sv_fps 20        <- halved the server tick from the mod's 40
//     sv_maxRate 18000 <- capped every client's bandwidth
// One click and the server ran at half tick rate with no message and no way to tell. Anyone who
// pressed it once has been playing degraded ever since. The values below now MATCH the mod's
// shipped defaults, so the button is safe to press and simply re-asserts them.
set sv_fps 40;                    // must match the mod default - do NOT lower
set sv_maxRate 0;                 // 0 = uncapped; set a value only on a genuinely thin uplink
set g_smoothClients 1;            // interpolation smoothing
set g_spectate_allow_full_chat 1; // spectators may chat across teams
set sv_precache 1;
set g_syncronousclients 0;
set sv_floodProtect 1;
set sv_flood_waitdelay 5;
set sv_flood_persecond 8;
set sv_flood_msgs 4;
set net_noipx 1;
globalwidgetcommand coop_serverNetConfigurationBtn title "Configuration loaded..."
