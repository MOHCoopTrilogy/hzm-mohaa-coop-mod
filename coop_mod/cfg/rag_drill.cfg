// HZM coop - RAGDOLL FREEZE DRILL  [bound to F7]
// The safety check. Arms the ragdoll with the SIMULATION FROZEN, so the pose the renderer draws
// must be the death pose verbatim. Kill ONE soldier: he must look like a perfectly normal
// soldier, frozen mid-death. Any warp / stretch / twist / shrink here means the render path
// broke and nothing else in the build can be judged - stop and report it.
developer 1
r_ragdollDebug 1
coop_ragdoll 1
coop_ragdollMode 1  // the branch that actually ships
coop_ragdollTest 2
echo "RAGDOLL DRILL armed. Kill ONE soldier - he must FREEZE as a normal-looking soldier."
echo "Then press F8 for the real test."
