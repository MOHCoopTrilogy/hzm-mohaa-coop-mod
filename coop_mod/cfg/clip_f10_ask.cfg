// F10, first press with a clip on disk: rendering REPLAYS the clip, which leaves the current game - ask first.
set clip_f10 "exec coop_mod/cfg/clip_f10_go.cfg"
centerprint "Rendering your clip LEAVES this game. Press F10 again to do it."
echo ^3[REC] Rendering the clip leaves your current game - press F10 again to continue (F9 starts a new recording instead).
