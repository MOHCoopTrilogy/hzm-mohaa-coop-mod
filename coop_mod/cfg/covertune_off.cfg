// ============================================================================
// COVER CAMERA TUNER - off. Clears the numpad binds and silences the readout.
// The tuned VALUES are untouched: they are CVAR_ARCHIVE and stay as you left them.
// ============================================================================
set coop_coverCamHud 0

unbind KP_LEFTARROW
unbind KP_RIGHTARROW
unbind KP_UPARROW
unbind KP_DOWNARROW
unbind KP_HOME
unbind KP_PGUP
unbind KP_END
unbind KP_PGDN
unbind KP_5
unbind KP_DEL

echo "COVER TUNER OFF - numpad released, your tuned values are kept"
