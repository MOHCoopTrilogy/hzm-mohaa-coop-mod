tmstop
append name ,0203
//,0=coopmod then next 3 numbers are the version
// [user 07-17] mark the client as being in a COOP game so the in-game ESC menu (ui/dm_main.urc) shows the
// COOP layout (LOADOUT instead of Select Weapon; no Select Team). This cfg is server-pushed on coop join
// ONLY, so regular MP never runs it and keeps the stock menu. Kept inverse to coop_mpmenu.
set coop_active 1
set coop_mpmenu 0