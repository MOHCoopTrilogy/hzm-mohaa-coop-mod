// HZM Coop - "Begin Full Campaign".
// Launches the pre-mission lobby (co_lobby1). In the lobby the squad picks their uniform (A/D) and readies
// up (F) - all read SERVER-SIDE from the usercmd (Player::TickCoopLobbyInput), so there are NO client key
// binds to set or restore, and it works for every client (host + remote). Once everyone is ready a countdown
// runs and the lobby clean-transitions into the vanilla briefing1 chapter and then m1l1.
// Reused by the coop_start.urc "Begin Full Campaign" button and usable straight from the console.

// Full campaign is a 4-player co-op run. sv_maxclients is latched; setting it before ui_startdmmap 2 (which
// spawns a fresh server) applies it on load.
set sv_maxclients 4
set ui_maxclients 4

set ui_dmmap co_lobby1
exec coop_mod/start_server.cfg

// CAMPAIGN MODE on. Each mission's completion now detours through its post-mission lobby
// (m1l1 -> co_lobby2 -> m1l2a -> co_lobby3 -> m1l2b). start_server.cfg clears this to 0, so this MUST be
// set after the exec above; single-map play (which execs start_server) is therefore unaffected.
set coop_campaign 1
