// Coop objectives diagnostic. In-game console: exec coop_mod/cfg/objdiag.cfg
// The bind/cvar lines print to the console (mirrored to qconsole.log, which I read);
// the ui_addhud line is a VISUAL test -- watch whether an objectives panel appears.
echo "===COOPDIAG_BEGIN==="
echo "--- what is 'o' bound to: ---"
bind o
echo "--- coop_obj cvar value: ---"
coop_obj
echo "--- now adding the objectives hud directly (WATCH SCREEN): ---"
ui_addhud "coop_objectives"
echo "===COOPDIAG_END==="
