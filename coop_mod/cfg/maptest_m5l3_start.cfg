// HZM Coop - start the m5l3 scene-walk tester.
//
// Run from the console (~) at the main menu (or anywhere):
//     exec coop_mod/cfg/maptest_m5l3_start.cfg
//
// Drives the bino-gate progression on m5l3 from the outside (teleports the
// player onto a bino volume + forces the King Tiger phase) so the gameplay
// scenes the smoke/patrol tests never reach actually run under coop. Uses the
// SAME spawn clicker + watchdog as Phase 2 (MAPTEST_LOADED convention). Stops
// before the win/missioncomplete transition. Stop with: seta coop_maptest 0.
seta coop_maptest 2
seta coop_maptest_m5l3 1
seta coop_maptest_dwell 600
// Disable DBNO so a parked/teleported player can't bleed out (test-harness only).
set coop_dbno 0
// MUST be off: with g_scriptcheck on, a map transition Com_Error(ERR_DROP)s
// because coop leaves game.* script vars set. Off = engine clears + continues.
seta g_scriptcheck 0
set ui_dmmap m5l3
exec coop_mod/start_server.cfg
