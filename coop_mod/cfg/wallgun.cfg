// =========================================================================
// INVISIBLE BARRIER TOOL - arm it, then build.        [user 2026-08-04]
//
//   exec coop_mod/cfg/wallgun.cfg
//
//   F9          place a barrier where you are aiming
//   F10         delete the barrier under your crosshair
//   PGUP/PGDN   taller / shorter        (64u steps)
//   INS / DEL   wider / narrower        (32u steps)
//   F11         SAVE this map's barriers
//   F12         clear them all (F11 to commit the clear)
//   HOME        toggle the ghost crates on/off while authoring
//   BACKSPACE   DELETE the map door/gate you are aiming at
//   END         save the removed-entity list
//
// Barriers block HUMAN PLAYERS ONLY. Enemies walk through them, and bullets and
// grenades pass through in both directions - that is the point, so an arena funnels
// people without blocking the fight.
//
// Default size is 64 wide x 320 tall. A standing player is 94 units, so 320 cannot be
// jumped; drop it to ~64 if you want a low piece you can vault sight-lines over.
// The ARROW KEYS are deliberately avoided - MOHAA binds them to movement by default, and this
// tool must never take away your ability to walk while authoring.
// =========================================================================

seta coop_wall 1

// [bug-1383] arena sessions run with NO precipitation - rain leaks through the roofs of the
// buildings an arena gets built in. This picks the ambient bed that replaces the rain:
//   wind | country | forest_night | night_calm | surf
seta coop_arenaAmb "forest_night"

bind F9    "set coop_wall_cmd place"
bind F10   "set coop_wall_cmd remove"
bind PGUP  "set coop_wall_cmd taller"
bind PGDN  "set coop_wall_cmd shorter"
bind INS   "set coop_wall_cmd wider"
bind DEL   "set coop_wall_cmd narrower"
bind F11   "set coop_wall_cmd save"
bind F12   "set coop_wall_cmd clear"
bind HOME  "set coop_wall_cmd ghost"
bind BACKSPACE "set coop_wall_cmd killent"
bind END   "set coop_wall_cmd killsave"

echo "-------------------------------------------------------------"
echo " BARRIER TOOL armed."
echo "   F9 = place    F10 = delete    F11 = save    F12 = clear"
echo "   PGUP/PGDN = height   INS/DEL = width   HOME = ghosts"
echo "-------------------------------------------------------------"
