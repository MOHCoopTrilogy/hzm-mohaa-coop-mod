// HZM Coop - start the map-rotation auto-tester (SPEARHEAD / t-series profile).
//
// !!! MUST be launched with com_target_game 1 (Spearhead) !!!
// The t-series BSPs live in mainta/pak*.pk3, which the engine mounts ONLY under
// com_target_game=1. The Breakthrough launch (com_target_game=2) does NOT mount them
// ("Can't find map" / null-deref on transition). The full watchdog launch command is:
//     openmohaa.exe +set com_target_game 1 +exec coop_mod/cfg/maptest_start_sh.cfg
// (vs the Breakthrough one: ... +set com_target_game 2 +exec coop_mod/cfg/maptest_start.cfg)
//
// Run from the console (~) at the main menu (or anywhere):
//     exec coop_mod/cfg/maptest_start_sh.cfg
//
// This launches the FIRST t-map (t1l1) the same way the HaZardModding coop menu does
// -- stage it in ui_dmmap, then run coop_mod/start_server.cfg, which sets g_gametype 2
// + the coop server cvars and finishes with "ui_startdmmap 2". That guarantees the map
// loads in COOP (gametype 2), not single-player. The rotation (coop_mod/maptest.scr)
// advances every later t-map the same way. Stop with: exec coop_mod/cfg/maptest_stop.cfg
seta coop_maptest 2
seta coop_maptest_dwell 300
seta coop_maptest_waypoints 20
seta coop_maptest_dwell_wpt 8
// Disable DBNO (down-but-not-out) for the test: the patrol teleports the player into
// combat positions where AI down them, and the teleport itself counts as "movement"
// that accelerates bleed-out -> the tour drags a downed/bleeding player, and the death
// test's "kill" drops them into DBNO limbo a respawn click can't clear (MAPTEST2_DEATH_HANG).
// With coop_dbno 0 the player stays up (999999 hp) and the death test is a clean
// die->respawn. Test-harness setting only; does not affect normal play.
set coop_dbno 0
// MUST be off: with g_scriptcheck on, a map transition Com_Error(ERR_DROP)s ("game
// variables being cleared") because coop leaves game.* script vars set -> looks like a
// crash. Off = the engine just clears them and continues. (engine default is 0; force it.)
seta g_scriptcheck 0
// Spearhead t-series run. First map = t1l1. Rotation (coop_mod/maptest.scr) advances
// t1l1 -> t1l2 -> ... -> t3l2 and auto-splits into phases at ^~^~^ MAPTEST_PHASE_END
// (every 5 maps): operator updates ui_dmmap to the printed next map, rebuilds pk3, RELAUNCHes.
set ui_dmmap t1l1
exec coop_mod/start_server.cfg
