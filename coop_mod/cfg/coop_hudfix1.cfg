// HZM coop - ONE-TIME HUD CLEANUP #1  [bug-3209, 2026-09-28]
// Run once per profile by the alias coop_hudFix1: coop_defaults.cfg defines it armed (exec this file), the SAVED
// config - which loads after coop_defaults.cfg and stores aliases (qcommon/cmd.c Cmd_WriteAliases) - holds it
// disarmed after the first run, and autoexec.cfg invokes it. Same alias one-shot as coop_gfxfix1.cfg/coop_bindfix1.cfg.
// The blinking "slow server" icon at the bottom of the screen (cgame/cg_drawtools.cpp CG_DrawServerLag, lit by
// the server's "svlag" command) tells a player nothing they can act on: on a listen server - how coop is
// normally hosted - it lights when the HOST's own frame rate dips (sv_main.c: msec there is the whole
// render loop), not when anything is wrong with the game or the connection. cg_drawsvlag is CVAR_ARCHIVE and
// every saved profile holds "1", so a default alone would never reach an existing install - hence the one-shot.
// It stays one console line away for anyone who wants it:  seta cg_drawsvlag 1
// Server-side diagnosis does not need the icon at all: sv_lagProbe 1 logs ^~^~^ SVFRAME / SVLAG (bug-1663).
seta cg_drawsvlag 0
alias coop_hudFix1 ""
