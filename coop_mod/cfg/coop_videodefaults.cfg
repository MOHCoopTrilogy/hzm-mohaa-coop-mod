// HZM coop - VIDEO OPTIONS DEFAULT button. ui/video options.urc execs this instead of ui_resetcvars.
// GENERATED by docs/tools/gen_menu_graphics.py - DO NOT HAND-EDIT. [2026-09-27 bug-3115] ui_resetcvars reset every
// linked cvar to the ENGINE default (HD textures off, half-size textures, no bullet holes, invisible smoke).
// This restores the SHIPPED look instead: each linked cvar's coop_defaults.cfg seed (engine default only where
// the mod seeds nothing). Resolution, display mode and field of view are left alone (DEFAULT_EXCLUDE).
seta r_texturemode GL_LINEAR_MIPMAP_LINEAR
seta r_picmip 0
seta r_gamma 1.176255
seta cg_marks_add 1
seta cg_rain 1

seta r_ext_compressed_textures 1    // pinned: 0 stops every HD .dds pack loading (renderergl2/tr_image.c:2488)
seta r_colorbits 32    // pinned: 16-bit banding and a forced farclip; 0 and 32 are the same
seta r_texturebits 32    // pinned: 16-bit textures and no HD sky layers; 0 and 32 are the same

print "Video Options restored to the shipped defaults.\n"
