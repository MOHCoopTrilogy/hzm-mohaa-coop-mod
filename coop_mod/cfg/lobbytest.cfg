// HZM Coop - QUICK LOBBY TEST commands.
//   exec coop_mod/cfg/lobbytest.cfg
// ...then type any of these in the console (~) to jump straight to that lobby. Each spawns a fresh
// 4-player coop server on the lobby - works from the MAIN MENU or MID-GAME:
//     lobby1   co_lobby1  (Avenue pre-campaign staging  -> briefing1 -> m1l1)
//     lobby2   co_lobby2  (m1l1 medic camp              -> m1l2a)
//     lobby3   co_lobby3  (m1l2a radio / command post   -> m1l2b)
//     lobby4   co_lobby4  (m1l3c pre-finale staging     -> m1l3c)
//     lobby5   co_lobby5  (m2l1 NIGHT blizzard camp     -> m2l1)
//     lobby6   co_lobby6  (m2l1 intel/Enigma spot       -> m2l2a)
//     lobby7   co_lobby7  (m2l2 U-boat pens staging     -> m2l2c)
//     lobby8   co_lobby8  (e1l4 harbor staging          -> briefing3)
// Ready up (F) inside a lobby to launch its real next map. For an INSTANT hop while you are already
// in a coop game (no full server respawn) use instead:   stuffsrv "map co_lobbyN"
//     alllobbies   prints this list again.

set sv_maxclients 4
set ui_maxclients 4

alias lobby1 "set ui_dmmap co_lobby1; exec coop_mod/start_server.cfg"
alias lobby2 "set ui_dmmap co_lobby2; exec coop_mod/start_server.cfg"
alias lobby3 "set ui_dmmap co_lobby3; exec coop_mod/start_server.cfg"
alias lobby4 "set ui_dmmap co_lobby4; exec coop_mod/start_server.cfg"
alias lobby5 "set ui_dmmap co_lobby5; exec coop_mod/start_server.cfg"
alias lobby6 "set ui_dmmap co_lobby6; exec coop_mod/start_server.cfg"
alias lobby7 "set ui_dmmap co_lobby7; exec coop_mod/start_server.cfg"
alias lobby8 "set ui_dmmap co_lobby8; exec coop_mod/start_server.cfg"
alias alllobbies "echo lobby1=co_lobby1 lobby2=co_lobby2 lobby3=co_lobby3 lobby4=co_lobby4 lobby5=co_lobby5 lobby6=co_lobby6 lobby7=co_lobby7 lobby8=co_lobby8"

echo "^2Lobby test ready.^7  Type:  lobby1 .. lobby8   (or 'alllobbies' for the list)"
