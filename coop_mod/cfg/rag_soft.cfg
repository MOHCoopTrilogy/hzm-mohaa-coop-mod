// HZM coop - RAGDOLL settle SOFT  [bound to F11]
// Loosens the hold on the authored pose: physics reshapes the corpse more, so it conforms harder
// to the ground - at the risk of sagging away from the animator's silhouette. Use this if bodies
// look "placed" or "frozen hovering over" the geometry they landed on.
coop_ragdollStiff 0.10
echo "RAGDOLL settle SOFT (0.10) - physics reshapes more. F8 = back to 0.25, F1 = firm 0.50."
