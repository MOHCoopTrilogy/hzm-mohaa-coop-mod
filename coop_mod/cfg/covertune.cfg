// ============================================================================
// COVER CAMERA TUNER - numpad bindings
// [user 2026-08-23] "Can you map it to numpad keys please"
//
//   exec coop_mod/cfg/covertune.cfg      turn it on
//   exec coop_mod/cfg/covertune_off.cfg  give the numpad back
//
// Built on the engine's stock `add <cvar> <amount>` console command (qcommon/cvar.c). It has no
// clamp, so the sensible ranges are noted per key below - overshooting is harmless, KP . resets.
//
// Every value below is CVAR_ARCHIVE, so whatever you land on survives a restart. Read the numbers
// off the on-screen COVERCAM line, then hand them over to be baked as the shipped defaults.
//
// The framing is decided when you ENTER cover, so after a change: step off the wall and take cover
// again. Nudging while already in cover will not move anything.
// ============================================================================

// ---- the readout (top of screen, once a second while covered) --------------
set coop_coverCamHud 1

// ---- KP 4 / 6 : how far the camera swings out toward the opening -----------
// Bigger = further past the corner and more of the doorway in frame.
bind KP_LEFTARROW   "add coop_coverCamSide -4"
bind KP_RIGHTARROW  "add coop_coverCamSide 4"

// ---- KP 8 / 2 : camera height ---------------------------------------------
// Positive lifts it, negative drops it toward shoulder height.
bind KP_UPARROW     "add coop_coverCamUp 2"
bind KP_DOWNARROW   "add coop_coverCamUp -2"

// ---- KP 7 / 9 : how close the camera sits behind you -----------------------
// Fraction of the normal chase distance. Lower = tighter to your back, and less
// chance of the camera burying itself in the wall.
bind KP_HOME        "add coop_coverCamPull -0.05"
bind KP_PGUP        "add coop_coverCamPull 0.05"

// ---- KP 1 / 3 : which way your BODY turns on entry -------------------------
// 0 = straight out from the wall, 1 = fully along it facing the opening.
// This is the one that decides whether you can see the doorway at all.
bind KP_END         "add coop_coverFaceOpen -0.05"
bind KP_PGDN        "add coop_coverFaceOpen 0.05"

// ---- KP 5 : print all four at once ----------------------------------------
bind KP_5           "echo ---- cover cam ----; coop_coverCamSide; coop_coverCamPull; coop_coverCamUp; coop_coverFaceOpen"

// ---- KP . : back to the shipped defaults -----------------------------------
bind KP_DEL         "set coop_coverCamSide 46; set coop_coverCamPull 1.45; set coop_coverCamUp -40; set coop_coverFaceOpen 1.0; echo cover cam reset to defaults"

echo "COVER TUNER ON - KP4/6 swing  KP8/2 height  KP7/9 distance  KP1/3 body turn  KP5 print  KP. reset"
echo "Re-take cover after each change; the framing is set on entry."
