// HZM Coop - Vehicle Scene Tester launcher.
//
// Scripts a board -> drive -> dismount on each vehicle map and verifies via
// the MOVEMENT POLL + greppable VTEST_ banners. Sibling of the on-foot Phase 2
// harness; reuses the SAME watchdog + spawn clicker (it emits MAPTEST_LOADED).
//
// Run from the console (~) at the main menu (or anywhere):
//     exec coop_mod/cfg/maptest_vehicle_start.cfg
//
// PROFILE SPLIT (same constraint as the on-foot harness):
//   - m-series + e-series vehicle maps (m1l1 m1l3b m1l3c m5l2b e1l1 e1l4 e2l1)
//     load under the Breakthrough profile: com_target_game 2.
//   - t-series vehicle maps (t1l1 t2l2 t3l2) live in mainta/pak*.pk3 and load
//     ONLY under com_target_game 1 (Spearhead). For those, launch with:
//        openmohaa.exe +set com_target_game 1 +exec coop_mod/cfg/maptest_vehicle_start.cfg
//     and set ui_dmmap below to t1l1 (or the desired t-map) first.
//
// This cfg defaults to the FIRST vehicle map = m1l1 (Breakthrough profile).
// The harness advances one vehicle map at a time via ^~^~^ MAPTEST_PHASE_END:
// the operator updates ui_dmmap to the printed next vehicle map, rebuilds the
// pk3, and RELAUNCHes (mirrors the on-foot batch flow). Stop with:
//     exec coop_mod/cfg/maptest_stop.cfg
seta coop_maptest_vehicle 1
// Leave the on-foot Phase 2 harness OFF so only the vehicle tick runs.
seta coop_maptest 0
seta coop_maptest_dwell 300
// DBNO off so boarding combat can't drop the test player into bleed-out limbo
// (same rationale as the on-foot harness).
set coop_dbno 0
// MUST be off: with g_scriptcheck on, a map transition Com_Error(ERR_DROP)s.
seta g_scriptcheck 0
// First vehicle map = m1l1 (Pattern A cinematic truck ride, Breakthrough profile).
set ui_dmmap m1l1
exec coop_mod/start_server.cfg
