// HZM coop - the coop SERVER RULES, shared by both ways the coop start screen hosts a game:
//   listen host  coop_mod/start_server.cfg execs this, then ui_startdmmap 2 (this process hosts)
//   Dedicated    the client's coop_dedStart (cl_dedicated.cpp) launches omohaaded.exe with
//                +exec coop_mod/cfg/dedicated_server.cfg, which execs this, then +map <map>
// Server-side cvars only. Do NOT put anything the menu or the Dedicated command line sets in here
// (sv_hostname, password, sv_maxclients, coop_health, coop_lmsLives, the HOST RULES cvars,
// coop_campaign): on a dedicated boot this file runs AFTER the command line and would undo them.
// [dedicated_launch 2026-10-04] split out of start_server.cfg verbatim, comments included.

//========== these are recommended
//set sv_maxclients 4				//max players - keep clients low to prevent stability issues during development
//set g_realismmode 0				//realistic mode
//set g_allowvote 0					//prevent players from voting
set sv_invulnerabletime 2			//invulnerable after respawning for x sec
//set g_teamdamage 0				//friendly fire

//========== change as you please
set g_healthdrop 0					//dead players drop health
set g_inactivespectate 600			//[user 08-02] 60 -> 600. Coop players legitimately hold position for long stretches (overwatch, waiting on a downed teammate, covering an objective) and were being spec-booted mid-mission. Engine clamps a MINIMUM of 20s (player.cpp ClientInactivityTimer) but has no maximum, so 600 is accepted. The lobby deliberately drops this to 0 while it is up and restores it on launch (coop_mod/lobby.scr::lobbyLaunch).
set g_inactivekick 0				//kick inactive players after x sec
set g_teamkillwarn 3				//warning shows after x kills
set g_teamkillkick 5				//kick from server after x teamkills

//========== don't change these - the mod requires them as they are
set g_healrate 100000				//rate of healing - make it instant to prevent unsseary health pickups 
//[user 2026-09-01, bug-2293] 2048 -> 4096, matching GENTITYNUM_BITS 12. Omaha fills the old pool and drops with "no free edicts"; the user's call was "id rather the pool get increased than we lose content". This value must never exceed the engine's MAX_GENTITIES.
set maxentities 4096				//[user 07-20 bug-927] NOW HONEST: GENTITYNUM_BITS raised 10->11 (true 2048-entity wire protocol; needs the matching exe+cgame+game build set). Under the OLD 10-bit engine this same value silently disabled the allocator overflow guard and caused the world-slot-stomp crash family - never set this above the engine's MAX_GENTITIES
set timelimit 0						//no timelimit
set fraglimit 0						//no fraglimit
set roundlimit 0					//no reset
set sv_floodprotect 1				//prevent spamming (and certain command chains)
set sv_team_spawn_interval 0		//pause between teacmchange
set coop_dev 0
set coop_check 0

//[S7 coop cleanup] Zero MP bot cvars so they do not leak from a previous MP session. sv_maxbots is
//CVAR_LATCH (only takes effect next map load) but zeroing it here means the NEXT coop map after this
//one will have no bot slots, and sv_numbots is live so any bots from the current frame are shed at once.
set sv_maxbots 0
set sv_numbots 0
set sv_minPlayers 0

//[coop speed restore] MP now uses the coop pace by default too (sv_dmspeedmult 0.6), but a host FAST
//RUN session (coop_mpFastRun 1 -> 0.8) or a Hardcore session (sv_runspeed 200) can leave either cvar
//non-coop. Restore the coop tactical pace (0.6x) and the engine-default run speed so returning to a
//coop map is always the exact coop feel (autoexec.cfg sets sv_dmspeedmult but not sv_runspeed).
set sv_dmspeedmult 0.6
set sv_runspeed 287

set g_mpHardcore 0		// [2026-09-25] hygiene: an MP Hardcore session never zeroes it on the way out
