// HZM Coop - WATER + WET SURFACES A/B TEST (gl2 renderer only). Inert until exec'd; ships nothing to other players.
//   exec coop_mod/cfg/wwtest.cfg        then type:  ww1 ... ww4 / wwdone
//
//   Keypad MINUS = water reflections off <-> on (r_hzmWater), live. The console prints which one is on.
//   Keypad PLUS  = wet surfaces in rain off <-> on (r_hzmWet), live.
//   Each switch fades over 1.5 s, and neither needs a restart.
//
// Both switches are "-1" (automatic = ON since v1.10.3) by default. This test sets them with `set`, never `seta`, so
// nothing is saved: the next launch is back to your own choice in Advanced Graphics. KP_MINUS / KP_PLUS are reset to "" by autoexec.cfg on every
// boot, so these binds cannot outlive the session either (the skytest.cfg pattern).
// Each alias holds the storm at full (coop_weatherPin 3) so the ground is wet. The ground wets over about 50 s, and
// the puddles come in more slowly. wwdone puts the weather back to the normal random storms for the next map.
// Engine side: renderergl2 tr_hzm_wet.c / tr_hzm_water.c, cgame cg_view.c CG_HZMWorldWetness
// (docs/proposals/water_wetness_2026-09-27). Omaha (m3l1a, m3l1b, e3l1, e3l2, obj_team3) never changes.

set r_hzmWater 0
set r_hzmWet 0
set ww_water0 "set r_hzmWater 1; set ww_water vstr ww_water1; echo ^3WATER REFLECTIONS: ON (new)"
set ww_water1 "set r_hzmWater 0; set ww_water vstr ww_water0; echo ^3WATER REFLECTIONS: OFF (today)"
set ww_water "vstr ww_water0"
set ww_wet0 "set r_hzmWet 1; set ww_wet vstr ww_wet1; echo ^3WET SURFACES: ON (new)"
set ww_wet1 "set r_hzmWet 0; set ww_wet vstr ww_wet0; echo ^3WET SURFACES: OFF (today)"
set ww_wet "vstr ww_wet0"
bind KP_MINUS "vstr ww_water"
bind KP_PLUS "vstr ww_wet"

// ww1 = m5l2b (the river, overcast day): the water and the wet banks together
alias ww1 "set coop_weatherPin 3; set ui_dmmap m5l2b; exec coop_mod/start_server.cfg"
// ww2 = m5l1b (City Hall, overcast day): wet streets, puddles in the open, dry under the arcades
alias ww2 "set coop_weatherPin 3; set ui_dmmap m5l1b; exec coop_mod/start_server.cfg"
// ww3 = m4l2 (Diverting the Enemy, night): wet ground under the lamps
alias ww3 "set coop_weatherPin 3; set ui_dmmap m4l2; exec coop_mod/start_server.cfg"
// ww4 = m4l0 (Secret Dog Map, rain): the pond
alias ww4 "set coop_weatherPin 3; set ui_dmmap m4l0; exec coop_mod/start_server.cfg"
alias wwdone "set r_hzmWater -1; set r_hzmWet -1; reset coop_weatherPin; unbind KP_MINUS; unbind KP_PLUS; echo water + wet test off - back to the default (on)"

echo "Water + wet test ready: ww1 river / ww2 wet city (day) / ww3 wet night / ww4 pond.  Keypad MINUS = water new/old.  Keypad PLUS = wet new/old.  wwdone = finish."
