// voprobe.cfg - WHY IS THE CAPTAIN SILENT? One boot answers it.
//
//   exec coop_mod/cfg/voprobe.cfg      (before or after the map loads, either works)
//
// WHY THIS EXISTS
//   The captain's shingle/bangalore lines have been reported silent five times and every fix so
//   far was aimed at the mixer. As of 2026-09-02 the mixer is PROVEN INNOCENT:
//     * all ten wavs are present, loose in main/sound/dialogue/m3l1/a/, 22-360 KB, healthy headers
//     * every alias is declared, cached and loadable on m3l1a (maps "m dm obj"; "m" prefixes m3l1a)
//     * channel = dialog, volume 1.5, minDist 200
//     * s_sfxduck and s_sfxduckVoxFloor are both archived at 1, so nothing is ducking speech
//     * "Couldn't play" (channel starvation) = 0 across a full 6 MB Omaha session
//     * the say ANIMATIONS have no upper-body channels, so Actor::UpdateSayAnim's combat gate
//       (TAF_HASUPPER + THINKSTATE_ATTACK, actor.cpp:7872-7878) cannot be dropping them
//
//   What is left is the LAST link nobody has watched: `<actor> say <alias>` is an ANIMATION call,
//   not a sound call. Actor::SoundSayAnim (actor.cpp:7611-7614) returns the moment the animation
//   resolves and never plays a sound; the audio is fired by a CLIENT frame command inside
//   models/human/animation/dialogue/M3L1_dialogue_US.tik:
//       streamed_..._083a  ..._083a.skc { client { first sound streamed_..._083a } }
//   So the question is simply whether the client ever requests that sound. These two prints
//   bracket it exactly.
//
// BOTH CVARS ARE REQUIRED. Both prints are Com_DPrintf, which returns early without `developer`
// (common.c:381). With s_show_sounds alone the probe emits NOTHING - and "nothing" is also one of
// the outcomes below, so it would silently manufacture a false answer.
developer 1
s_show_sounds 1
logfile 2

echo "^~^~^ VOPROBE armed - play to the shingle and the bangalore hand-off, then quit."
echo "^~^~^ Then:  grep -in dfr_scripted_m3l1_0 G:\mohaa-gl2\home\maintt\qconsole.log"

// HOW TO READ IT
//   NOTE THE CASE. S_RegisterSound lowercases every path into szCacheName (snd_dma_new.cpp:418-419)
//   and S_FindName stores exactly that (:287); both prints emit sfx->name. So the log says
//   dfr_scripted_m3l1_083a, lowercase, no matter how the alias is spelled. An uppercase grep matches
//   NOTHING - which looks identical to the third outcome below and would silently confirm it. Use -i.
//
//   BOTH lines appear for a captain alias:
//       S_StartSound: sound/dialogue/m3l1/a/dfr_scripted_m3l1_083a.wav      (client asked)
//       OpenAL: 2D - <time> (#<chan>) - <path> (vol <v>, mindist .., maxdist ..)   (it got a channel)
//     -> the audio STARTED. It is a mix problem and `vol` is the next lead. Tune s_dialogscale /
//        s_voxDuck WITH THE USER LISTENING - both are global to the whole trilogy, and moving this
//        axis blind is what shipped bug-2378.
//
//   ONLY "S_StartSound", no "OpenAL: 2D -":
//     -> channel denial in the 32-slot 2D-stream pool (a "Couldn't play 2Dstreamed sound ... on
//        channel dialog" line sits beside it). Fix mirrors bug-2309 but on the RIGHT pool:
//        MAX_SOUNDSYSTEM_CHANNELS_2D_STREAM in client/snd_local_new.h. That shifts every channel
//        index above the 3D block, so re-read snd_openal_new.cpp:1886 and :3050 in the same pass,
//        and ship exe + cgame + game together.
//
//   NEITHER line appears:
//     -> the client never ran the TIKI frame command. The mixer and the whole alias set are
//        innocent and no ubersound edit can help. Next step is one Com_Printf in
//        Actor::UpdateSayAnim (actor.cpp:7854) reporting the branch taken - game.dll only, no
//        client rebuild - which splits "server never started the say anim" from "client never ran
//        the frame command".
//
// NOTE s_show_sounds 1, NOT 2. Level 2 adds the per-load S_LoadSound trace and floods map load.
// Turn it off afterwards with:  s_show_sounds 0 ; developer 0
