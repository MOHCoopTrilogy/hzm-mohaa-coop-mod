// =========================================================================
// HOLDOUT setup - ONE key does everything.       [user 2026-08-04]
//
//   exec coop_mod/cfg/holdout.cfg
//
// Then, in game:
//
//   F5   "HERE IS A CHECKPOINT"   - stand where players should defend, press F5.
//   F6   "ENEMIES COME FROM HERE" - walk to an approach, press F6. Repeat per approach.
//   F7   SAVE                     - writes this map's arenas. Do this before you leave.
//   F8   START / STOP             - begins the holdout; press again to abort + clean up.
//
// That is the whole workflow. Walk, tap F5, walk, tap F6 a few times, tap F7, tap F8.
// Everything is saved per map, so once a map is set up it just works forever after.
//
// The console commands still exist if you prefer them:
//   set coop_holdout_cmd arena | spawn | save | start | stop | clear
// =========================================================================

bind F5 "set coop_holdout_cmd arena"
bind F6 "set coop_holdout_cmd spawn"
bind F7 "set coop_holdout_cmd save"
bind F8 "set coop_holdout_cmd toggle"

seta coop_holdout_boot 1

echo "-------------------------------------------------------------"
echo " HOLDOUT setup armed."
echo "   F5 = checkpoint here      F6 = enemies come from here"
echo "   F7 = save this map        F8 = start / stop"
echo "-------------------------------------------------------------"
