// HZM coop - ADVANCED GRAPHICS SHIPPING DEFAULTS. The DEFAULTS button in ui/advanced_graphics.urc execs this.
// GENERATED by docs/tools/gen_menu_graphics.py - DO NOT HAND-EDIT. Mirrors the archived seta in
// coop_defaults.cfg. Latched cvars (aniso/subdivisions/vsync) take effect on the menu's APPLY
// (ui_checkrestart). The PINNED cvars at the end have no row any more; see gen_menu_graphics.py PINNED.
seta r_ext_texture_filter_anisotropic 1
seta r_ext_max_anisotropy 16
seta r_drawSun 1
seta r_flares 1
seta r_fastdlights 0
seta r_groundVariety -1
seta r_swapInterval 1
seta com_maxfps 200
alias coop_fpsRestore seta com_maxfps 200
seta ui_menuCenter 0
seta r_ppFXAA 1
seta r_subdivisions 4
seta cg_shadows 2
seta cg_effectdetail 1
seta cg_max_tempmodels 4000
seta cg_marks_max 487.050842
seta r_hzmWater -1
seta r_hzmWet -1

seta r_ext_multisample 0    // pinned: window MSAA: gl2 blits into it, clamps to 4 (bug-3119)
seta r_ext_framebuffer_multisample 0    // pinned: MSAA above Off draws the bug-1298 halos (D1, until the gfx flip)
seta r_overBrightBits 0    // pinned: row removed; gl2 world gain is r_mapOverBrightBits

print "Graphics settings restored to defaults.\n"
