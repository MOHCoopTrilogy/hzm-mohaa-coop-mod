// HZM coop - RAGDOLL FIX A/B: ON  (docs/proposals/ragdoll_2026-09-27/plan.md Phase 0.5 + Phase 1)
// Switches are LATCHED per corpse when it lands: only soldiers killed AFTER this runs get the fixes.
// All five are flags-0 cvars (never saved), default ON since v1.10.3 - this file just restates the defaults.
coop_ragdoll 1
coop_ragdollRearmGate 1   // bug-3132: a body still playing its death animation is never grabbed by physics
coop_ragdollCarryWake 1   // bug-3133: a sleeping corpse thrown by a blast rides the throw instead of snapping back
coop_ragdollFaceFix 1     // bug-3127: joint limits no longer mirrored on lying corpses
coop_ragdollKeepCap 1     // bug-3129: limits never pull a joint away from the authored death pose
coop_ragdollRestFix 1     // bug-3128: a corpse at rest goes to sleep (needs CarryWake)
echo "RAGDOLL FIX ON - kill NEW enemies to see it (bodies already down keep the old behaviour)."
