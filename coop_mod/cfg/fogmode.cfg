// =========================================================================
// HZM coop - FOG / DARKNESS MODE   [user 08-02]
//
// Fog is a SUBMODE OF BUILD MODE, not a separate keymap. There is nothing to bind here.
//
//   1. exec coop_mod/cfg/buildmode.cfg    (binds the numpad, arms build mode)
//   2. press  \  (backslash) to cycle mode:  object -> sound -> FOG -> object
//   3. the same numpad now drives fog. ENTER saves the profile for this map.
//
// WHY NO BINDS IN THIS FILE: an earlier version of this cfg bound all 16 numpad keys itself.
// That silently destroyed build mode's bindings - whichever of the two cfgs you exec'd last
// won, and the other tool went dead. Build mode already had a mode-swap bus designed for
// exactly this (it is how SOUND mode works), so fog rides that instead. One keymap, one cfg,
// no collision.
//
// FOG SUBMODE KEY MAP (numpad):
//   8 / 2     fog distance  +/-      *** ALSO CLAMPS AI SIGHT - see the warning below ***
//   6 / 4     bias (where the fade starts)  +/-
//   7 / 1     red   +/-
//   9 / 3     green +/-
//   / / *     blue  +/-
//   + / -     skybox farplane +/-
//   ENTER     SAVE this map's profile
//   KP_5      reset to the map's native fog
//   KP_INS    night preset      KP_DEL   heavy mist preset
//   ;         (in fog submode) cycle cull mode 0/1/2
//
// *** fog DISTANCE is not cosmetic ***
//   The engine clamps AI sight range to  farplane * 0.828  (fgame/actorenemy.cpp, actor.cpp).
//   Pulling fog in also pulls enemy engagement range in. The HUD prints the derived value live
//   in red. BIAS and COLOUR have no such coupling - prefer those for mood.
//
// AUTO-APPLY is independent of all of the above: a saved profile is re-applied on every load of
// that map, for every player, whether or not build mode is armed. Saved profiles live in
//   %APPDATA%\openmohaa\maintt\coop_mod\save\fog_<map>.dat
// and can be shipped with the mod by copying them to  coop_mod/fog/<map>.dat
// =========================================================================

set coop_fog_cmd ""

echo "FOG MODE is a build-mode submode. Run: exec coop_mod/cfg/buildmode.cfg, then press \ twice."
echo "Numpad: 8/2 distance, 6/4 bias, 7/1 red, 9/3 green, / and * blue, +/- skybox, ENTER saves."
echo "WARNING: fog DISTANCE also clamps AI sight range (farplane * 0.828)."
