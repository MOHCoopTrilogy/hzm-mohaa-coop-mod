// HZM Coop - HD SKY A/B TEST (gl2 renderer only). Inert until exec'd.
//   exec coop_mod/cfg/skytest.cfg        then type:  sky1 ... sky8 / skydone
//
//   Keypad MINUS = flip NEW HD sky <-> ORIGINAL sky, live. The console prints "sky: NEW HD" / "sky: ORIGINAL".
//   Keypad PLUS  = fog on the sky on/off (r_globalFogSky). Every alias below puts it back to 1.
//
// Keys: F9 is the clip recorder (autoexec.cfg:84) and F1-F12 are all taken. KP_MINUS / KP_PLUS are reset to ""
// by autoexec.cfg on every boot, so these binds cannot outlive the session. r_skyHDCompare is CVAR_TEMP (never
// saved); it must be set BEFORE a map loads (both sky sets are then kept for that map), which is why each alias
// sets it first. Maps start through the real coop path: coop_mod/start_server.cfg ends with ui_startdmmap 2.
// Engine side: renderergl2 r_skyHD / r_skyHDCompare (tr_shader.c ParseSkyParms). Pak: zzzzzzzzzz_coop_hd_skies.pk3
// (docs/tools/gen_sky_hd.py). sky1-sky3 draw a 3D skybox, which gl2 never fogs. sky4-sky8 are the SEAM-ONLY
// boxes (today's AA_HD faces, native resolution: seams, corners and the up edges repaired, stars untouched).
// sky6-sky8 sit behind far fog: press keypad PLUS to take the fog off the sky, then compare with keypad MINUS.

set r_skyHDCompare 1
bind KP_MINUS "toggle r_skyHDCompare 1 2"
bind KP_PLUS "toggle r_globalFogSky"

// sky1 = t1l1 "Normandy" (dark blue sky; draws two HD boxes, env/t1l1 + env/t1l1a)
alias sky1 "set r_globalFogSky 1; set r_skyHDCompare 1; set ui_dmmap t1l1; exec coop_mod/start_server.cfg"
// sky2 = t3l1 "Berlin" (first Berlin mission; dark sky env/t3l1 + day sky env/m5l2)
alias sky2 "set r_globalFogSky 1; set r_skyHDCompare 1; set ui_dmmap t3l1; exec coop_mod/start_server.cfg"
// sky3 = t3l2 "Berlin" (second Berlin mission; painted skyline env/t3l2 + day sky env/m5l2)
alias sky3 "set r_globalFogSky 1; set r_skyHDCompare 1; set ui_dmmap t3l2; exec coop_mod/start_server.cfg"
// sky4 = co_lobby2 (Rangers lobby, the m1l1 night sky env/mohnight1): keypad minus now flips the night BOX and the
// MOVING CLOUDS together. Look up about 45 deg facing along a wall of the sky, and at the two top corners behind
// you (the original's bright corner wedges are gone). The HD clouds read a hair brighter and less green than
// today: that is the retail grey - today's DXT1 copy is 1.1 LSB darker and green-tinted - not a brightness change.
alias sky4 "set r_globalFogSky 1; set r_skyHDCompare 1; set ui_dmmap co_lobby2; exec coop_mod/start_server.cfg"
// sky5 = co_lobby4 (the m1l3c "Lighthouse" night sky env/lighthousesky; no fog)
alias sky5 "set r_globalFogSky 1; set r_skyHDCompare 1; set ui_dmmap co_lobby4; exec coop_mod/start_server.cfg"
// sky6 = co_lobby6 (the m2l1 dawn sky env/nordawn; far fog - keypad PLUS first)
alias sky6 "set r_globalFogSky 1; set r_skyHDCompare 1; set ui_dmmap co_lobby6; exec coop_mod/start_server.cfg"
// sky7 = co_lobby1 (the m5l3 "The Bridge" / training day sky env/mohday2; far fog - keypad PLUS first)
alias sky7 "set r_globalFogSky 1; set r_skyHDCompare 1; set ui_dmmap co_lobby1; exec coop_mod/start_server.cfg"
// sky8 = m4l0 "Secret Dog Map" (day sky env/mohday1; far fog - keypad PLUS first)
alias sky8 "set r_globalFogSky 1; set r_skyHDCompare 1; set ui_dmmap m4l0; exec coop_mod/start_server.cfg"
// NOTE: the clouds the plane flies through in t1l1's intro are a separate retail 2002 texture, not a sky layer -
// keypad minus never changes them.
alias skydone "set r_globalFogSky 1; set r_skyHDCompare 0; unbind KP_MINUS; unbind KP_PLUS; echo sky test off - fog on the sky restored"

echo "Sky test ready: sky1 Normandy / sky2 Berlin (t3l1) / sky3 Berlin (t3l2) / sky4 night + clouds / sky5 lighthouse / sky6 dawn / sky7 day (bridge) / sky8 day (dog map).  Keypad MINUS = new/old.  Keypad PLUS = fog on sky.  skydone = finish."
