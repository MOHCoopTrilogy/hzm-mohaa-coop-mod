// HZM Coop - VEHICLE HEADLIGHT A/B TEST (gl2 renderer). Inert until exec'd; ships nothing to other players.
//   exec coop_mod/cfg/hltest.cfg      then:  hl1 ... hl9 to load a test map,  M = OLD <-> NEW,  hldone = finish
//
// M flips the new look on and off, live, and the console prints "HEADLIGHTS: OLD" / "HEADLIGHTS: NEW".
//   TEST W (the default after exec, alias hlW) [2026-09-26, S3a]: M flips cg_hzmHeadlightsBeamStop ONLY - the fog
//          beam ending softly on the first wall or truck in front of it (NEW) instead of running on for its full ~8 m
//          and being cut hard by it (OLD). Every other switch is pinned to auto (= the shipped headlights, which
//          passed Test S), so an earlier Test A/S/B press cannot leave the beams off. Beams only show on a DARK map in
//          FOG (or rain): hl1 is the place.
//   TEST S (type hlC) [2026-09-26, Phase S - replaces Test B; PASSED 2026-09-26]: OLD = today's shipped look
//          (the Test A restore on auto, headlight manager off). NEW = the headlight manager with the Phase S spot
//          cone (a warm pool IN FRONT of each lit truck that also lights soldiers and props, never behind it) and
//          the lamp lens flares. Both states pin r_hzmLightGlow / r_hzmRgbGenDot to auto (-1), so an earlier Test A
//          press can never leave the glow off (vet_phaseS F24). LENS FLARES MUST BE ON (Advanced Graphics, r_flares
//          1 - the default).
//   TEST A (type hlA): M flips the renderer restore only - r_hzmLightGlow (round lamp glows, muzzle glows, sparks)
//          and r_hzmRgbGenDot (the soft edge of the retail truck beam). Passed 2026-09-26; now on by default.
//   hlB: bisect only - Phase H's omni pool (r_hzmSpot / r_hzmFlares forced 0), the look Test S replaces.
//
// Key: M. Verified free (vet F28): nothing in omconfig.cfg, autoexec.cfg or any mod cfg/urc/scr binds it; "=" is
// unbound by the Armory (ui/loadout/fitunbind.cfg) and KP_PLUS/KP_MINUS belong to skytest.cfg and build mode.
// The bind is saved with your config like any bind - hldone removes it.
// Every switch is a flags-0 engine cvar ("-1" = auto): a `set` here lasts for this session only, and hldone puts them
// all back to auto. Omaha Beach (m3l1a, m3l1b) is excluded inside BOTH DLLs, so M must change NOTHING there (test hl5).
// Maps start through the real coop path: coop_mod/start_server.cfg ends with ui_startdmmap 2.

// ---- Test A: the renderer restore only (the searchlight maps hlS1 / hlS2 use it)
alias hlA "set hl_new vstr hl_newA; set hl_old vstr hl_oldA; vstr hl_oldA; echo ^3Headlight TEST A: M flips the lamp/muzzle glow + beam-edge restore"
set hl_newA "set r_hzmLightGlow 1; set r_hzmRgbGenDot 1; set cg_hzmHeadlights 0; set hl_toggle vstr hl_old; echo ^2HEADLIGHTS: NEW (A)"
set hl_oldA "set r_hzmLightGlow 0; set r_hzmRgbGenDot 0; set cg_hzmHeadlights 0; set hl_toggle vstr hl_new; echo ^3HEADLIGHTS: OLD"

// ---- Test S (the default): today's headlights <-> the new ones (spot pool + lit soldiers + lens flares)
alias hlC "set hl_new vstr hl_newC; set hl_old vstr hl_oldC; vstr hl_oldC; echo ^3Headlight TEST S: M flips today's headlights <-> the new ones - Lens Flares must be on"
set hl_newC "set r_hzmLightGlow -1; set r_hzmRgbGenDot -1; set cg_hzmHeadlights 1; set r_hzmSpot 1; set r_hzmFlares 1; set hl_toggle vstr hl_old; echo ^2HEADLIGHTS: NEW (S)"
set hl_oldC "set r_hzmLightGlow -1; set r_hzmRgbGenDot -1; set cg_hzmHeadlights 0; set r_hzmSpot -1; set r_hzmFlares -1; set hl_toggle vstr hl_new; echo ^3HEADLIGHTS: OLD"

// ---- Test W (the default): the fog beam stops at walls (S3a) - M flips cg_hzmHeadlightsBeamStop only
alias hlW "set hl_new vstr hl_newW; set hl_old vstr hl_oldW; vstr hl_oldW; echo ^3Headlight TEST W: M flips the fog beams stopping at walls and at the truck in front"
set hl_newW "set r_hzmLightGlow -1; set r_hzmRgbGenDot -1; set cg_hzmHeadlights -1; set r_hzmSpot -1; set r_hzmFlares -1; set cg_hzmHeadlightsBeamStop 1; set hl_toggle vstr hl_old; echo ^2HEADLIGHTS: NEW (W - beams stop at walls)"
set hl_oldW "set r_hzmLightGlow -1; set r_hzmRgbGenDot -1; set cg_hzmHeadlights -1; set r_hzmSpot -1; set r_hzmFlares -1; set cg_hzmHeadlightsBeamStop 0; set hl_toggle vstr hl_new; echo ^3HEADLIGHTS: OLD"

// ---- hlB: bisect only - the restore + Phase H's omni pool (what Test S replaces); spot and flares forced off
alias hlB "set hl_new vstr hl_newB; set hl_old vstr hl_oldB; vstr hl_oldB; echo ^3Headlight bisect B: M flips the restore + the Phase H omni headlights"
set hl_newB "set r_hzmLightGlow 1; set r_hzmRgbGenDot 1; set cg_hzmHeadlights 1; set r_hzmSpot 0; set r_hzmFlares 0; set hl_toggle vstr hl_old; echo ^2HEADLIGHTS: NEW (B)"
set hl_oldB "set r_hzmLightGlow 0; set r_hzmRgbGenDot 0; set cg_hzmHeadlights 0; set r_hzmSpot 0; set r_hzmFlares 0; set hl_toggle vstr hl_new; echo ^3HEADLIGHTS: OLD"

bind m "vstr hl_toggle"

// ---- the test maps
// hl1 = co_lobby8: harbour lamps (92 coronas) + the 3 dock trucks, night fog. TEST W: the 3 trucks stand nose to
//       tail; OLD = the two rear trucks' beams run into the truck in front (a bright band on its tailgate, the beam
//       showing again beside it); NEW = those beams end at the tailgate, the front truck's beam is unchanged
alias hl1 "set ui_dmmap co_lobby8; exec coop_mod/start_server.cfg"
// hl2 = co_lobby5: snowy night camp, rows of lamps (82 coronas) - Test A only
alias hl2 "set ui_dmmap co_lobby5; exec coop_mod/start_server.cfg"
// hl3 = e1l4 Tunisia - Bizerte Harbor: dock trucks, and a real fight for muzzle glows / sparks / grenades
alias hl3 "set ui_dmmap e1l4; exec coop_mod/start_server.cfg"
// hl4 = e3l1 Italy - Monte Cassino I: lamps and trucks (in scope) - Test A only
alias hl4 "set ui_dmmap e3l1; exec coop_mod/start_server.cfg"
// hl5 = m3l1b Omaha Beach - the bluffs: M must change NOTHING here
alias hl5 "set ui_dmmap m3l1b; exec coop_mod/start_server.cfg"
// hl6 = e1l1 Tunisia - Kasserine Pass: dense fog - soft beams, no light pool glowing through the fog
alias hl6 "set ui_dmmap e1l1; exec coop_mod/start_server.cfg"
// hl7 = e1l3 Tunisia - Bizerte Canal: DAYLIGHT. NEW: no ground light, no flare, and the retail tube beams on the
//       trucks are gone (OLD still shows them); the small lamp glows look fine in both
alias hl7 "set ui_dmmap e1l3; exec coop_mod/start_server.cfg"
// hl8 = t3l1 Berlin: hidden trucks - no lit patch where there is no truck (no fixed place to look: not in Test S)
alias hl8 "set ui_dmmap t3l1; exec coop_mod/start_server.cfg"
// hl9 = m4l2 Diverting the Enemy: the truck ride - no beam in your own face
alias hl9 "set ui_dmmap m4l2; exec coop_mod/start_server.cfg"
// hlW2 = m1l3a Lighting the Torch - Desert Road (night fog): the truck opel1 (about -2874 -3139) points its beams at
//        a building wall about 330 u (6 m) ahead - TEST W: NEW = the beams fade out just before that wall (a little
//        shorter than OLD) and leave no faint line on it
alias hlW2 "set ui_dmmap m1l3a; exec coop_mod/start_server.cfg"

// ---- searchlights (2026-09-26): S1 = the tower cone (renderer), S2 = the Normandy sky beams (cgame). Both ride
//      Test A's r_hzmRgbGenDot, so both switch M to Test A first (hlA). Omaha stays unchanged (hl5).
// hlS1 = m6l1c Die Sturmgewehr: searchlight towers - Coop Noclip from the start about 3,100 u ENE to the first tower
//        at -720 1400 424, watch the cone from the side, let it swing onto you
alias hlS1 "hlA; echo ^3hlS1: noclip to the first tower at -720 1400 424 - watch the cone from the side - M = old/new; set ui_dmmap m6l1c; exec coop_mod/start_server.cfg"
// hlS2 = t1l1 Normandy: the C-47 ride - look out of the door at the sweeping sky beams
alias hlS2 "hlA; echo ^3hlS2: ride the C-47 and look out of the door at the sweeping sky beams - M = old/new; set ui_dmmap t1l1; exec coop_mod/start_server.cfg"

alias hldone "set r_hzmLightGlow -1; set r_hzmRgbGenDot -1; set cg_hzmHeadlights -1; set r_hzmSpot -1; set r_hzmFlares -1; set cg_hzmHeadlightsBeamStop -1; unbind m; echo ^3headlight test off - every switch back to auto"

hlW
echo "Headlight test ready (TEST W - beams stop at walls). hl1 (docks) and hlW2 = test maps, M = old/new, hldone = finish. (hlC = test S, hlA = test A, hlS1/hlS2 = searchlights)"
