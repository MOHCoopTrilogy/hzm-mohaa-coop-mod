// HZM coop - LIVING HIT REACTIONS test  [bound to F6? no - see autoexec]
// Turns the AI flinch layer up so it can actually be judged, and prints which limb the ENGINE
// reported against which animation the script chose. The map was mirrored and off by one until
// 2026-08-20, so every flinch had been playing on the wrong body part since the feature shipped.
developer 1
coop_hitReactDebug 1
coop_aiHitReact 100
coop_aiHitReactWait 0.4
echo "HIT REACTIONS: every hit flinches, 0.4s apart. Shoot a RIGHT arm - he must grab his RIGHT arm."
echo "Console prints HITREACTMAP loc=<engine limb> sfx=<animation played>."
