// HZM coop - ONE-TIME BIND CLEANUP #2  [bug-3299, 2026-09-29]
// Run once per profile by the alias coop_bindFix2: coop_defaults.cfg defines it armed (exec this file), the SAVED
// config - which loads after coop_defaults.cfg and stores aliases (qcommon/cmd.c Cmd_WriteAliases) - holds it
// disarmed after the first run, and autoexec.cfg invokes it. Same alias one-shot as coop_bindfix1.cfg: a server can
// neither write nor run an alias (qcommon/cmd_filter.c).
// Until v1.10.4 autoexec.cfg bound ten numpad keys to the developer ADS TUNING WORKBENCH on every launch - numpad
// 7/9/5/0 switched its green centre reticle ON (adsm_*), numpad 3 toggled it, 1/2/4/6/8 dialled the held gun - and
// blanked five more (the retired helmet tuner). Players hit those keys by accident and got a green crosshair with a
// yellow readout that only numpad 3 could clear, and the Armory's DONE button unbound numpad 3 (ui/loadout/fitunbind.cfg).
// The engine saved those binds into every profile (Key_SetBinding sets CVAR_ARCHIVE), so dropping them from autoexec
// alone would leave them live. autoexec overwrote all fifteen keys at EVERY launch, so the value a saved config holds
// for them can only be ours: unbinding them takes nothing a player chose. A key bound after this run stays theirs.
// A later cleanup is a NEW file and a NEW alias name (coop_bindFix3): this one stays disarmed in every saved config.
unbind KP_HOME
unbind KP_UPARROW
unbind KP_PGUP
unbind KP_LEFTARROW
unbind KP_5
unbind KP_RIGHTARROW
unbind KP_END
unbind KP_DOWNARROW
unbind KP_PGDN
unbind KP_INS
unbind KP_DEL
unbind KP_STAR
unbind KP_PLUS
unbind KP_MINUS
unbind KP_SLASH
seta cg_adsTune 0
seta cg_adsMode 0
alias coop_bindFix2 ""
echo "^3[keys] one-time cleanup #2: developer numpad binds removed - the green tuning crosshair is gone and the numpad is yours (Options - Controls)"
