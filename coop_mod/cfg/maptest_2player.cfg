// HZM Coop - 2-player live test cycle
//
// Run from the console (~) in Player 1's window after both clients are connected:
//     exec coop_mod/cfg/maptest_2player.cfg
//
// Cycles through all coop maps at 60 seconds each.
// Uses coop_maptest 1 (basic dwell cycle) — NOT Phase 2 patrol, so real players
// can explore freely. Stop with: exec coop_mod/cfg/maptest_stop.cfg
//
// coop_maptest_dwell 120 = 2 minutes per map — enough to observe issues
// coop_maptest_batch 999 = disable PHASE_END stops for full-rotation audit
//   (safe with MAX_MSGLEN=131072 engine fix; Issue #14)
seta coop_maptest 1
seta coop_maptest_dwell 300
seta coop_maptest_batch 999
set coop_dbno 0
seta g_scriptcheck 0
exec coop_mod/start_server.cfg
// exec inserts start_server.cfg at front of buffer, so this map command runs after it
// (start_server.cfg's "map $ui_dmmap" fails silently, then this one succeeds)
map m1l1
