// HZM Coop - DUST STORM ROLL-IN TEST [2026-09-26, bug-2963]. Inert until exec'd; binds nothing, ships nothing to others.
//   exec coop_mod/cfg/dusttest.cfg      then:  dust1 / dust2 to load a test map,  duston / dustoff in the map
//
// dust1 = Tunisia - Battle of Kasserine Pass II (e1l2): day storm, tan wall.
// dust2 = Lighting the Torch - Desert Road (m1l3a): night storm, dark wall.
// duston  = force a FULL storm now (coop_dustNow 1): ~20 s the distance + sky go tan, then the sand sheet and
//           blowing sand fade in over your view and the wind swells. It holds while forced.
// dustoff = force it off (coop_dustNow 0): ~25 s later the map looks exactly as before (sheet + wind leave first).
// coop_dustNow is cleared at every map load, so type duston AFTER you are in the map, not while it loads.
// Only the host's console reaches the server. Watch the log for ^~^~^ DUST start / hold / restore (developer 1).
// Maps start through the real coop path: coop_mod/start_server.cfg ends with ui_startdmmap 2.

alias dust1 "set ui_dmmap e1l2; exec coop_mod/start_server.cfg"
alias dust2 "set ui_dmmap m1l3a; exec coop_mod/start_server.cfg"
alias duston "set coop_dustNow 1; echo ^3DUST STORM forced ON - about 20 s to roll in. Try third person and a building. dustoff to end it."
alias dustoff "set coop_dustNow 0; echo ^3DUST STORM forced OFF - about 25 s to roll out, then the fog must be exactly as before."

echo "Dust storm test ready: dust1 = Kasserine Pass II (day) / dust2 = Lighting the Torch - Desert Road (night)."
echo "In the map: stand outside facing the longest view, type duston (about 20 s roll-in), then dustoff (about 25 s roll-out)."
