// HZM coop - DEFAULT BINDS #2 (one-time, bug-4187): the lobby-only binds. Same alias one-shot as coop_defbinds1.cfg (alias coop_defBinds2).
// PAD0_X / PAD0_Y read a cvar (reload / weapnext everywhere, LOADOUT / SERVICE RECORD while the co-op lobby is up); keys L / J do the
// lobby actions and nothing outside it. A profile that already ran #1 gets these once; after that the player owns the keys.
bind PAD0_X "vstr coop_padX"   // X = reload (LOADOUT in the lobby)
bind PAD0_Y "vstr coop_padY"   // Y = swap weapon (SERVICE RECORD in the lobby)
bind l "vstr coop_lbLoadout"   // lobby only: LOADOUT (no-op outside the lobby)
bind j "vstr coop_lbRecord"    // lobby only: SERVICE RECORD (no-op outside the lobby)
alias coop_defBinds2 ""
echo "^3[keys] lobby buttons bound (one time only - Options - Controls stays yours)"
