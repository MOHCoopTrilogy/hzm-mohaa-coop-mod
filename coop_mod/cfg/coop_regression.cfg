// ============================================================================
// COOP REGRESSION GATE - arm every self-test battery at once.
//
// WHY THIS EXISTS (2026-08-30). Eleven self-test batteries ship in coop_mod/
// (coop_selftest*.scr - 121 labels, ~4,775 lines), each inert behind its own
// cvar at main.scr:218-260. Forty-three harness cfgs existed and NOT ONE armed
// them, so the suite had never been run as a suite. That was acceptable while
// co-op was the only product. It stops being acceptable the moment standard-MP
// work starts touching shared code - sentient.cpp, autoexec.cfg, the statemap,
// global/*.scr - because co-op is the shipping product and a regression there
// costs more than anything MP gains.
//
// HOW TO USE IT
//   1. exec coop_mod/cfg/coop_regression.cfg      (then start a coop map normally)
//   2. play/idle until the batteries stop printing
//   3. python docs/tools/coop_regression.py --baseline   <- BEFORE any MP change
//   4. after each MP change, re-run 1-2 then:
//      python docs/tools/coop_regression.py --check      <- diffs against baseline
//
// The batteries emit MEASUREMENTS, not verdicts - their PASS criteria live in
// comments inside each script. So the gate is a BEFORE/AFTER DIFFER, not an
// assertion engine: what matters for MP work is "did co-op change", and that
// question a diff can answer honestly without re-deriving 121 expectations.
//
// coop_maptest and coop_wintest are DELIBERATELY NOT armed here - they move the
// player and change maps, which would end the session the other batteries are
// measuring. Run those separately (maptest_start.cfg).
// ============================================================================

// ---- the eleven per-subsystem batteries ----
set coop_st_scaling 1
set coop_st_engine 1
set coop_st_vehicles 1
set coop_st_objectives 1
set coop_st_triggers 1
set coop_st_dbno 1
set coop_st_keyitems 1
set coop_st_officer 1
set coop_st_weapons 1
set coop_st_xp 1

// ---- the older single-purpose probes ----
set coop_weaptest 1
set coop_dbnotest 1
set coop_dbnoteam 1
set coop_xptest 1
set coop_scaletest 1

// developer 1 is REQUIRED: script println and compile errors are gated behind it,
// so without it the batteries run and say nothing.
set developer 1
set logfile 2

echo "^~^~^ REGRESSION armed: 15 batteries. Start a coop map, let it settle, then run"
echo "^~^~^ REGRESSION   python docs/tools/coop_regression.py --baseline   (or --check)"
