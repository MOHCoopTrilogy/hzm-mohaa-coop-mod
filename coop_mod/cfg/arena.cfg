// =========================================================================
// LAUNCH THE HOLDOUT ARENA                            [user 2026-08-05]
//
//   exec coop_mod/cfg/arena.cfg
//
// Starts e3l4_arena - the DEDICATED arena map. Its geometry is a copy of e3l4
// but it is its own map with its own saves, so nothing here can ever touch the
// e3l4 campaign.
//
// This runs the SAME start path the coop menu uses. Do NOT use "map e3l4_arena":
// a raw map command takes the single-player load path even with g_gametype 2
// latched, which skips coop init entirely.
//
// Once the map is up:
//   exec coop_mod/cfg/arena_tools.cfg     <- arms all three toolsets
// =========================================================================

exec coop_mod/start_server.cfg
set ui_dmmap e3l4_arena
ui_startdmmap 2
