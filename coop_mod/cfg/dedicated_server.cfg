// HZM coop - the coop start screen's DEDICATED path, run ON THE DEDICATED SERVER (omohaaded.exe).
// [dedicated_launch 2026-10-04] The client's coop_dedStart (openmohaa.exe, code/client/cl_dedicated.cpp) launches
//   omohaaded.exe +set dedicated 1 +set g_gametype 2 +set sv_maxclients <n> +set net_port <free port>
//                 +set sv_hostname/password/coop_health/coop_lmsLives/<HOST RULES> <the screen's values>
//                 +set coop_campaign 0|1 +exec coop_mod/cfg/dedicated_server.cfg +map <map>
// so by the time this runs every menu value is already set: put nothing here that would undo one.
