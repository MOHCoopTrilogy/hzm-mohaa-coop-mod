// HZM coop - RAGDOLL A/B: bone driver OFF  [bound to F10]
// Turns off the child-driven bone rotation fix (every limb reverts to being aimed by the segment
// ARRIVING at it instead of the one its own mesh runs along). Kill a few, compare, then press F8
// to switch it back on. If both look identical, the mesh defect is somewhere else entirely and
// that is a genuinely useful answer.
coop_ragdollDrive 0
echo "RAGDOLL A/B: bone driver OFF. Kill a few, then press F8 to turn it back ON."
