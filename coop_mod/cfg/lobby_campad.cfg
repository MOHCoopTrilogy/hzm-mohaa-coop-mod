// ===== LOBBY CAMERA TUNING PAD =====
// Exec this WHILE IN THE LOBBY to rebind the numpad to the camera pad (mirrors the ADS pad layout).
// The camera re-frames live (coop_mod/lobby.scr re-reads the cvars every 0.5s). When you're happy, press
// NUM 1 to dump the values, paste them to Claude, and RELAUNCH to restore the normal ADS numpad pad.
//
//    NUM 7 = MOVE mode      NUM 8 = up          NUM 9 = FRAME mode
//    NUM 4 = left           NUM 5 = AIM mode     NUM 6 = right
//    NUM 1 = SAVE (dump)    NUM 2 = down         NUM 3 = tuning ON/OFF (toggle)
//
//  MOVE : 8/2 = camera height,   4/6 = dolly in / out
//  FRAME: 8/2 = FOV zoom,        4/6 = slide camera sideways
//  AIM  : 8/2 = aim up / down,   4/6 = aim left / right

bind KP_HOME       lcamm_move
bind KP_PGUP       lcamm_frame
bind KP_5          lcamm_aim
bind KP_UPARROW    lcamn_up
bind KP_DOWNARROW  lcamn_down
bind KP_LEFTARROW  lcamn_left
bind KP_RIGHTARROW lcamn_right
bind KP_END        lcamsave
bind KP_PGDN       "toggle coop_lobbyCamTune"

set coop_lobbyCamTune 1
echo "^2LOBBY CAM PAD ON^7 - 7=MOVE 9=FRAME 5=AIM | 8/2/4/6=nudge | 1=SAVE | 3=toggle"
