// HZM Coop - Phase 2 active patrol tester.
// Teleports player through all MP spawn points with godmode, then tests officer
// waves and death/respawn. ~5 minutes per map. Use same watchdog + spawn clicker.
//
// Usage: update ui_dmmap below to desired start map, then exec this cfg.
seta coop_maptest 2
seta coop_maptest_dwell 300
seta coop_maptest_waypoints 20
seta coop_maptest_dwell_wpt 8
seta g_scriptcheck 0
set ui_dmmap m4l3
exec coop_mod/start_server.cfg
