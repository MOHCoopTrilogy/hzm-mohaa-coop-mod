// HZM coop - POST-FX DEFAULTS. Exec'd by the "DEFAULTS" button in ui/coop_postfx.urc to restore the
// shipping look (matches the values autoexec.cfg re-asserts on every launch). The r_pp* cvars are
// CVAR_ARCHIVE, so plain `set` here both applies live AND persists. The linkcvar sliders/checkboxes in
// the menu snap to these values as soon as this runs.
set r_postProcess 1

set r_ppBloom 1
set r_ppBloomThreshold 0.6
set r_ppBloomIntensity 1.3

set r_ppSSAO 1
set r_ppSSAODepthAware 1
set r_ppSSAORadius 16
set r_ppSSAOIntensity 1.0
set r_ppSSAOBias 0.5

set r_ppDoF 1
set r_ppDoFFocus 0
set r_ppDoFRange 1200
set r_ppDoFIntensity 0.6

set r_ppTonemap 1
set r_ppExposure 1.0
set r_ppContrast 1.0
set r_ppSaturation 1.0
set r_ppGrade 0

set r_ppFXAA 1

set r_ppLowHealth 1
set r_ppLowHealthStart 0.5
set r_ppLowHealthAmount 1.0

set r_ppSuppression 1
set r_ppSuppressAmount 1.0

set r_ppHeatHaze 1
set r_ppHeatAmount 1.0

set r_ppSunShafts 1
set r_ppSunShaftIntensity 0.5
set r_ppSunShaftDecay 0.95
set r_ppSunShaftThreshold 0.6

print "Post-FX settings restored to defaults.\n"
