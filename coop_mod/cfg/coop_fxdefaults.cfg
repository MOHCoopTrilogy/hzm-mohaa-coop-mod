// HZM coop - POST-FX SHIPPING DEFAULTS. This is the canonical post-processing look:
//  - the "DEFAULTS" button in ui/coop_postfx.urc execs this to restore the shipping look, and
//  - autoexec.cfg force-sets these same values each launch (see its POST-FX block), so a fresh install
//    gets the curated look instead of the engine's raw defaults.
// The postfx MENU still tunes everything LIVE for the current session; to change the SHIPPED default, edit
// the values here AND the matching seta lines in autoexec.cfg. Captured from the finalized look
// (SSAO + tonemap OFF; bloom / DoF / FXAA / sun shafts / heat haze / rain / low-health / suppression ON).
set r_postProcess 1

set r_ppBloom 1
set r_ppBloomThreshold 0.6
set r_ppBloomIntensity 1.3

// SSAO OFF (finalized look)
set r_ppSSAO 0
set r_ppSSAODepthAware 0
set r_ppSSAORadius 2
set r_ppSSAOIntensity 1.32
set r_ppSSAOBias 1.17

set r_ppDoF 1
set r_ppDoFFocus 0
set r_ppDoFRange 1200
set r_ppDoFIntensity 0.6

// Tonemap OFF (finalized look); exposure/contrast/saturation kept for when it's toggled on live
set r_ppTonemap 0
set r_ppExposure 0.80
set r_ppContrast 0.96
set r_ppSaturation 1.16
set r_ppGrade 0

set r_ppFXAA 1

set r_ppLowHealth 1
set r_ppLowHealthStart 0.5
set r_ppLowHealthAmount 1.0
set r_ppLowHealthBeat 0.5

set r_ppSuppression 1
set r_ppSuppressAmount 1.0

set r_ppHeatHaze 1
set r_ppHeatAmount 1.0

set r_ppSunShafts 1
set r_ppSunShaftIntensity 0.5
set r_ppSunShaftDecay 0.95
set r_ppSunShaftThreshold 0.6

set r_ppRainDrops 1
set r_ppRainAmount 0.5

set r_ppMuzzleHeat 0
set r_ppMuzzleX 0.5
set r_ppMuzzleY 0.4
set r_ppMuzzleRadius 0.10

print "Post-FX settings restored to defaults.\n"
