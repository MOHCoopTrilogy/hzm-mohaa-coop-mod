// HZM coop - ONE-TIME BIND CLEANUP #1  [bug-3190, 2026-09-28]
// Run once per profile by the alias coop_bindFix1: coop_defaults.cfg defines it armed (exec this file), the SAVED
// config - which loads after coop_defaults.cfg and stores aliases (qcommon/cmd.c Cmd_WriteAliases) - holds it
// disarmed after the first run, and autoexec.cfg invokes it. Same alias one-shot as coop_gfxfix1.cfg: a server can
// neither write nor run an alias (qcommon/cmd_filter.c).
// Until v1.10.x autoexec.cfg re-bound eleven keys to ragdoll / reload-feel TEST cfgs on every launch, and the engine
// saved those binds into every profile, so dropping them from autoexec alone would leave them live. This hands the
// keys back: F1 to retail's vote yes (maintt default.cfg), F8 to the admin panel (installer/omconfig_default.cfg),
// the other nine unbound as retail ships them. A key the player binds after this run stays theirs. A later cleanup
// is a NEW file and a NEW alias name (coop_bindFix2): this one stays disarmed in every saved config.
bind F1 "vote y"
bind F8 "append name ,6ua"
unbind i
unbind b
unbind n
unbind 9
unbind 8
unbind k
unbind j
unbind l
unbind 0
alias coop_bindFix1 ""
echo "^3[keys] one-time cleanup: developer test binds removed - F1 votes yes and F8 opens the admin panel again"
