// ============================================================================
// ADS TUNING WORKBENCH - numpad bindings (DEVELOPER TOOL, never bound by default)  [bug-3299]
//
//   exec coop_mod/cfg/adstune.cfg       turn it on (binds the numpad, shows the green reticle + readout)
//   exec coop_mod/cfg/adstune_off.cfg   give the numpad back and hide the reticle
//
// Until v1.10.4 these binds lived in autoexec.cfg and re-applied on every launch, so players who brushed the numpad
// got a green crosshair they could not get rid of. Hold/aim a gun, pick what to tune, nudge it, then save:
//    NUM 7 = tune PITCH     NUM 8 = up          NUM 9 = tune YAW
//    NUM 4 = left           NUM 5 = tune SHIFT  NUM 6 = right
//    NUM 1 = SAVE           NUM 2 = down        NUM 3 = tuning ON/OFF (toggle)
//    NUM 0 = tune ROLL (un-tilt, stand + crouch)
// The active STANCE is auto-detected, so stand and crouch keep their own values. SAVE (adssave) dumps the gun's
// stand + crouch state to the console/log for baking (cg_modelanim.c adsGunTune table).
// autoexec.cfg sets cg_adsTune 0 at every launch, so the reticle never survives a restart.
// ============================================================================
bind KP_HOME adsm_pitch
bind KP_PGUP adsm_yaw
bind KP_5 adsm_shift
bind KP_INS adsm_roll
bind KP_UPARROW adsn_up
bind KP_DOWNARROW adsn_down
bind KP_LEFTARROW adsn_left
bind KP_RIGHTARROW adsn_right
bind KP_END adssave
bind KP_PGDN "toggle cg_adsTune"
set cg_adsTune 1
echo "ADS TUNER ON - numpad bound (7 pitch, 9 yaw, 5 shift, 0 roll, 8/2/4/6 nudge, 1 save, 3 on/off). exec coop_mod/cfg/adstune_off.cfg to stop"
