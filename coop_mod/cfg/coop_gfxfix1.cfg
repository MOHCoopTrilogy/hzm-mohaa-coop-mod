// HZM coop - ONE-TIME GRAPHICS REPAIR #1. GENERATED by docs/tools/gen_menu_graphics.py - DO NOT HAND-EDIT.
// [2026-09-27 bug-3115/3116/3118/3119] Run once per profile by the alias coop_gfxFix1: coop_defaults.cfg defines it
// armed (exec this file), the SAVED config - which loads after coop_defaults.cfg and stores aliases - holds
// it disarmed after the first run, and autoexec.cfg invokes it. The r_resAutoDetected recipe (fire once, keep
// a flag, never fight a later pick) done with an alias, because a server cannot write or run an alias
// (qcommon/cmd_filter.c), whereas a vstr'd cvar needs a SEC2 guard-list entry and a new exe.
// It only touches cvars that NO menu offers any more, so it can never undo a player's choice. A later repair
// is a NEW file and a NEW alias name (coop_gfxFix2): this one stays disarmed in every saved config.
seta r_ext_compressed_textures 1    // 0 stops every HD .dds pack loading (renderergl2/tr_image.c:2488)
seta r_colorbits 32    // 16-bit banding and a forced farclip; 0 and 32 are the same
seta r_texturebits 32    // 16-bit textures and no HD sky layers; 0 and 32 are the same
seta vss_draw 1    // 0 makes volumetric smoke invisible (cgame/cg_view.c:8852)
seta r_drawstaticdecals 1    // 0 hides the maps' own decals
seta r_ext_multisample 0    // window MSAA: gl2 blits into it, clamps to 4 (bug-3119)
seta r_ext_framebuffer_multisample 0    // MSAA above Off draws the bug-1298 halos (D1, until the gfx flip)
seta r_overBrightBits 0    // row removed; gl2 world gain is r_mapOverBrightBits
seta r_drawSunRays 0    // row hidden: no visible sun under the coop fog, square glow on fogged skies
alias coop_gfxFix1 ""
echo "^3[gfx] one-time graphics repair: HD textures, 3D smoke and map decals on; window MSAA and sun rays off"
