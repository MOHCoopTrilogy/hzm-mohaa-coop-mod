// HZM coop - DEFAULT BINDS #1 (one-time, bug-4187). Run once per profile by the alias coop_defBinds1: coop_defaults.cfg arms it
// (exec this file), the SAVED config holds it disarmed after the first run, autoexec.cfg invokes it. Everything a player can
// rebind in Options > Controls lives here and ONLY here, so a custom bind is never overwritten on a later launch.
// A fresh profile gets all of them; an existing profile gets them once on the first launch after the update.
// To add a default later (e.g. a new action): NEW file coop_defbinds2.cfg + NEW alias coop_defBinds2; this one stays disarmed.
bind f "+use"
bind q "+leanleft"
bind e "+leanright"
bind PAD0_LEFTSTICK_UP    "+forward"
bind PAD0_LEFTSTICK_DOWN  "+back"
bind PAD0_LEFTSTICK_LEFT  "+moveleft"
bind PAD0_LEFTSTICK_RIGHT "+moveright"
bind PAD0_RIGHTSTICK_LEFT  "+left"
bind PAD0_RIGHTSTICK_RIGHT "+right"
bind PAD0_RIGHTSTICK_UP    "+lookup"
bind PAD0_RIGHTSTICK_DOWN  "+lookdown"
bind PAD0_RIGHTTRIGGER  "+attackprimary"   // RT = fire
bind PAD0_LEFTTRIGGER   "+button13"        // LT = aim down sights (same COOPADS command as mouse2)
bind PAD0_RIGHTSHOULDER "+coopnade"        // RB = quick grenade
bind PAD0_LEFTSHOULDER  "+use"             // LB = use / interact
bind PAD0_A "+moveup"          // A = jump
bind PAD0_B "+movedown"        // B = crouch / prone
bind PAD0_X "reload"           // X = reload
bind PAD0_Y "weapnext"         // Y = swap weapon
bind PAD0_LEFTSTICK_CLICK  "+speed"            // L3 = sprint / breath-hold
bind PAD0_RIGHTSTICK_CLICK "+attacksecondary"  // R3 = melee / bash
bind PAD0_DPAD_UP    "append name ,8mk"   // medkit
bind PAD0_DPAD_DOWN  "append name ,9cv"   // take cover
bind PAD0_DPAD_LEFT  "+coopsidearm"       // quick-draw sidearm
bind PAD0_DPAD_RIGHT "append name ,abx"   // ammo box
bind PAD0_BACK  "+scores"       // View/Back = scoreboard
bind PAD0_START "pushmenu main"  // Menu/Start = pause menu (the engine's ESC target is "main", cl_keys.cpp UI_MenuEscape)
bind PAD0_PADDLE1 "+leanleft"
bind PAD0_PADDLE2 "+leanright"
bind PAD0_PADDLE3 "+coopsidearm"
bind PAD0_PADDLE4 "+use"
bind SHIFT "+speed"
bind ALT "+button12"
bind mouse2 "+button13"
bind mouse3 "shoulderswap"
bind v "+attacksecondary"
bind x "instamsg_main"
bind o "vstr coop_obj"
bind F7 "hzm_armory"
bind g "+coopnade"
bind h "+coopsidearm"
alias coop_defBinds1 ""
echo "^3[keys] default key / button binds applied (one time only - Options - Controls stays yours)"
