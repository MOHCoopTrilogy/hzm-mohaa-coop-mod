// HZM coop - menu Apply for a single mission/map tile [user 2026-10-18].
// Same start as coop_mod/start_server.cfg, plus the one-shot coop_lobbyFresh: the first map that loads sends the
// squad through the pre-mission lobby (co_lobby1: uniforms, Armory, ready-up) and the lobby then launches the
// picked map (main.scr::lobbyAlwaysRedirect, lobby.scr::lobbyLaunch via coop_campaignNext). Opt out with
// coop_lobbyAlways 0. campaign_start.cfg, arena.cfg, test cfgs and dedicated servers never exec this file.
set coop_lobbyFresh 1
exec coop_mod/start_server.cfg
