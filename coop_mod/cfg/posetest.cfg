// HZM coop lobby DEV: pose finder.
// Cycle the candidate standing-idle anims to visually identify the hands-on-hips pose.
//   numpad +  = next pose
//   numpad -  = previous pose
// The anim's name prints on screen (top) and in the console each step. Note the name when you
// see the hands-on-hips pose and tell me - I'll lock that one in as the lobby pose.
//
// Usage: in the lobby (exec coop_mod/cfg/campaign_start.cfg), open console (~) and: exec coop_mod/cfg/posetest.cfg
bind KP_PLUS  "coop_lobbycycleanim 1"
bind KP_MINUS "coop_lobbycycleanim -1"
echo "POSE FINDER armed: numpad + = next anim, numpad - = prev anim. Watch the pose name on screen."
