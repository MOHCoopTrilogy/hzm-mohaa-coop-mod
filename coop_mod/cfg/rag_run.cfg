// HZM coop - RAGDOLL SETTLE TEST  [bound to F8]
// The real thing: the authored MOHAA death animation plays out untouched, then physics settles
// the landed body onto whatever it actually came to rest on. Also the reset key - press F8 any
// time to return every ragdoll cvar to the standard test values.
developer 1
r_ragdollDebug 1
coop_corpseShootable 1
coop_ragdollTest 0
coop_ragdollMode 1
coop_ragdollStiff 0.25
coop_ragdollDrive 1
// full reset: any knob left over from a previous experiment silently poisons this session
coop_ragdollTruss 1
coop_ragdollRotLock 1
coop_ragdollSlew 0.12
coop_ragdollCarry 0.85
coop_ragdollVelCap 8
coop_ragdollLeash 128
coop_ragdollLimits 1
coop_ragdollSelf 0.85
coop_ragdollFeet 1
coop_ragdollStick 1
coop_ragdollStickMax 12
// [2026-08-21] these four were MISSING from the "full reset" above. rag_hard.cfg moves Couple
// and Linear, so every A/B after one press of the harder key was measuring a contaminated
// baseline while this file claimed to have reset everything. Engine defaults, restated.
coop_ragdollCouple 1.1
coop_ragdollLinear 0.30
coop_ragdollAnchor 0.10
coop_ragdollImpact 1
coop_ragdoll 1
// living soldiers too: the flinch layer up where it can be judged, with its map printed
coop_hitReactDebug 1
coop_aiHitReact 100
coop_aiHitReactWait 0.4
echo "RAGDOLL SETTLE test armed (stiff 0.25, bone-driver ON)."
echo "Kill men near sandbags / crates / rubble / slopes / ledges. Flat ground should look vanilla."
