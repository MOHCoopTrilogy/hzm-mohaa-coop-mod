// HZM coop - A/B: how far damage may rearrange a corpse  [bound to 8]
// Cycles the cap on how far a struck limb's resting place may be rewritten from the pose the
// man actually died in. Low = damage barely sticks; high = bodies mangle into impossible poses.
coop_ragdollStickMax 24
echo "RAGDOLL: damage may rearrange a limb up to 24u (loose). F8 = 12 (default), 9 = no stick at all."
