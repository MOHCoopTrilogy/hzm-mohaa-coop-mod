// HZM Coop - BUILD MODE stop.
//     exec coop_mod/cfg/buildmode_stop.cfg
// Leaves build mode (ghost removed, notarget/god restored) and clears the numpad binds.
// Placed objects stay in the world and the capture file is kept:
//     %APPDATA%/openmohaa/maintt/coop_mod/save/build_<map>.dat
// NOTE: if you had your own numpad binds, re-add them (this unbinds outright).
// To also disarm the map-start monitor hook entirely, additionally run:
//     seta coop_build_boot 0

set coop_build 0
set coop_build_cmd ""

unbind KP_LEFTARROW
unbind KP_RIGHTARROW
unbind KP_END
unbind KP_PGDN
unbind KP_HOME
unbind KP_PGUP
unbind KP_SLASH
unbind KP_STAR
unbind KP_UPARROW
unbind KP_DOWNARROW
unbind KP_PLUS
unbind KP_MINUS
unbind KP_5
unbind KP_INS
unbind KP_ENTER
unbind KP_DEL
unbind [
unbind ]

echo "BUILD MODE stopped (placements + capture file kept)"
