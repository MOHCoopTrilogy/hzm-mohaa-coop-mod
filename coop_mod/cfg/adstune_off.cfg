// ============================================================================
// ADS TUNING WORKBENCH - off. Hides the green reticle + readout and clears the numpad binds.  [bug-3299]
// The tuned VALUES (cg_adsPitch, cg_adsYaw, ...) are untouched.
// ============================================================================
set cg_adsTune 0
unbind KP_HOME
unbind KP_PGUP
unbind KP_5
unbind KP_INS
unbind KP_UPARROW
unbind KP_DOWNARROW
unbind KP_LEFTARROW
unbind KP_RIGHTARROW
unbind KP_END
unbind KP_PGDN
echo "ADS TUNER OFF - numpad released, reticle hidden"
