// HZM Coop - LIGHTNING A/B TEST (gl2). Inert until exec'd; ships nothing to other players.
//   exec coop_mod/cfg/lttest.cfg     then play m3l2 (or any rain map) as host:  M = next look,  ltdone = finish
//
// M cycles, live, between strikes (each is read at the next strike):
//   TODAY      the shipped lightning (HUD sheet + fog stamp)
//   QUICK FIX  no sheet, a faint capped fog pulse               (coop_ltQuick 1)
//   REALISTIC  the lit cloud where the strike is, outdoor light, far bolts, thunder by distance   (coop_ltMode 2)
// The console prints which one is on. The storm is held at full (coop_weatherPin 3), so a strike comes every ~5-15 s.
// REALISTIC needs the lightning game.dll + cgame.dll + renderer (the log shows three "LTBUILD" lines); with older
// DLLs it is simply silent. Player setting to try in REALISTIC: seta cg_hzmLightningMode 2 (reduced flashing) / 0 (off).
// Key M is free in the shipped binds (vet F28 of the headlight test found the same); ltdone unbinds it again.
set cg_hzmLightning 1
set r_hzmLightning 1
set cg_hzmLightningBolts 1
set coop_weatherPin 3
set lt_today "set coop_ltMode 0; set coop_ltQuick 0; set lt_next vstr lt_quick; echo ^3LIGHTNING: TODAY (shipped)"
set lt_quick "set coop_ltMode 0; set coop_ltQuick 1; set lt_next vstr lt_real; echo ^3LIGHTNING: QUICK FIX"
set lt_real "set coop_ltMode 2; set coop_ltQuick 0; set lt_next vstr lt_today; echo ^3LIGHTNING: REALISTIC"
set lt_next "vstr lt_quick"
bind m "vstr lt_next"
set ltdone "set coop_ltMode 0; set coop_ltQuick 0; reset coop_weatherPin; set cg_hzmLightning -1; set r_hzmLightning -1; set cg_hzmLightningBolts -1; unbind m; echo ^3LIGHTNING test finished (back to the shipped look)"
vstr lt_today
