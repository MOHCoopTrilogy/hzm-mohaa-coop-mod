// =========================================================================
// Put the barrier tool away.                          [user 2026-08-04]
//
//   exec coop_mod/cfg/wallgun_off.cfg
//
// Hides the preview crate, stops F9 from placing anything, and gives the keys
// back. Placed barriers are NOT removed and NOT unsaved - this only stows the
// tool. Re-arm any time with:  exec coop_mod/cfg/wallgun.cfg
// =========================================================================

seta coop_wall 0

unbind F9
unbind F10
unbind F11
unbind F12
unbind PGUP
unbind PGDN
unbind INS
unbind DEL
unbind HOME

echo "-------------------------------------------------------------"
echo " BARRIER TOOL stowed. Placed barriers are untouched."
echo "   holdout: exec coop_mod/cfg/holdout.cfg   (F5/F6/F7/F8)"
echo "   build:   exec coop_mod/cfg/buildmode.cfg (numpad)"
echo "-------------------------------------------------------------"
