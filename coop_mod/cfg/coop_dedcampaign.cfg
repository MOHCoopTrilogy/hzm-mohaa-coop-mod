// HZM coop - "Begin Full Campaign" with Dedicated ticked [dedicated_launch 2026-10-04].
// Same campaign setup as campaign_start.cfg (4 players, the co_lobby1 pre-mission lobby, campaign chain on),
// but hosted by a separate omohaaded.exe that this game then joins: coop_dedStart (cl_dedicated.cpp) reads
// sv_maxclients and ui_dmmap from here and passes coop_campaign 1 on the server's command line.
// The client itself is never switched to dedicated.
set sv_maxclients 4
set ui_maxclients 4
set ui_dmmap co_lobby1
coop_dedStart campaign
