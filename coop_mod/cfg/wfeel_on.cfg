// HZM coop - RELOAD FEEL test  [bound to F2? no - see autoexec]
// The question this answers: does a Kar98 reload feel different from a Garand reload?
// Every reload used to run its whole camera move in the first fifth of the animation and then
// PARK at full lift - up to 2.5 motionless seconds on a bolt rifle - which is why they all felt
// identical. The phase now follows the real animation length of the gun in your hands.
developer 1
coop_reloadDebug 1
coop_reloadRetime 1
coop_reloadHook 1
coop_reloadWeight 1
coop_reloadSway 1.6
echo "RELOAD FEEL on. Reload a GARAND, then a KAR98, standing still, first person."
echo "Console prints WFEEL len= per reload: they must DIFFER (about 2.00 vs 3.37)."
