// ============================================================================
// HZM Coop - DEDICATED SERVER example config
//
// Start the server with (all on one line):
//   omohaaded.exe +set dedicated 1 +set com_target_game 2 +set g_gametype 2
//                 +set sv_maxclients 8 +set fs_homepath "<your server folder>"
//                 +exec dedicated_example.cfg
//
// TWO THINGS THAT WILL BITE YOU IF YOU IMPROVISE:
//
// 1. g_gametype MUST be on the COMMAND LINE. It is a latched cvar, so setting it from a cfg after
//    the server is already up does not apply to the map you are about to load - and the coop
//    framework only initialises under gametype 2. Get this wrong and you get a silent, empty
//    server with no coop.
//
// 2. Do NOT copy coop_mod/start_server.cfg verbatim. That file is for the in-game menu and ends
//    with `ui_startdmmap 2`, which is a CLIENT UI command. It does not exist on a dedicated server,
//    so a host who copies it gets a server that loads nothing at all. Use a plain `map <name>`,
//    as the last line of this file does.
//
// com_target_game 2 mounts main + mainta + maintt, so maps from all three games are available:
// m-series (Allied Assault), t-series (Spearhead), e-series (Breakthrough).
// ============================================================================

seta sv_hostname "HZM Coop Dedicated"
seta sv_maxclients 8
seta g_gametype 2
seta sv_fps 40

// --- network ---------------------------------------------------------------
// Reasoning is in docs/proposals/server_topology_and_limits.md.
seta sv_maxRate 0            // 0 = uncapped. Set a real value only on a genuinely thin uplink.
seta sv_floodProtect 1

// Uncomment to make LAN clients go through the normal rate gate. By default sv_lanForceRate is 1,
// and LAN addresses (10/8, 172.16/12, 192.168/16) bypass rate limiting entirely - which quietly
// hides bandwidth problems when you are testing from a machine on your own network.
//seta sv_lanForceRate 0

// --- coop gameplay ---------------------------------------------------------
// Same cvar names the in-game coop settings menu uses.
seta coop_health 750
seta coop_dbno 1
seta coop_lmsLives 0

// --- admin -----------------------------------------------------------------
// Set a real password, or leave it empty to disable remote admin entirely.
seta rconpassword ""

// Load the first map LAST. `map`, never `ui_startdmmap`.
map m1l1
