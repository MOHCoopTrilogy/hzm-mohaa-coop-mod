// HZM Coop - BUILD MODE start (dev tool; docs: _research/build_mode.md)
//
// Run from the console (~) on the listen-server host (this cfg enables coop_dev itself):
//     exec coop_mod/cfg/buildmode.cfg
//
// FIRST-EVER USE ONLY: restart the map afterwards (coop menu Apply / ui_startdmmap 2) so
// main.scr threads the build monitor at map init. coop_build_boot is archived (seta),
// so every later map start is armed automatically and this cfg then toggles build
// mode on instantly. Stop with: exec coop_mod/cfg/buildmode_stop.cfg
//
// Every key just writes ONE command cvar (coop_build_cmd); buildmode.scr polls and
// clears it each frame. Numpad layout:
//     KP7 yaw-15   KP8 raise    KP9 yaw+15
//     KP4 prev     KP5 reset    KP6 next        (model)
//     KP1 cat prev KP2 lower    KP3 cat next
//     KP0 solid    KP. undo     KP_ENTER place
//     KP_SLASH pitch-15  KP_STAR pitch+15  KP_PLUS/KP_MINUS scale

bind KP_LEFTARROW "set coop_build_cmd prev"
bind KP_RIGHTARROW "set coop_build_cmd next"
bind KP_END "set coop_build_cmd catprev"
bind KP_PGDN "set coop_build_cmd catnext"
bind KP_HOME "set coop_build_cmd yawminus"
bind KP_PGUP "set coop_build_cmd yawplus"
bind KP_SLASH "set coop_build_cmd pitchminus"
bind KP_STAR "set coop_build_cmd pitchplus"
bind KP_UPARROW "set coop_build_cmd up"
bind KP_DOWNARROW "set coop_build_cmd down"
bind KP_PLUS "set coop_build_cmd scaleup"
bind KP_MINUS "set coop_build_cmd scaledown"
bind KP_5 "set coop_build_cmd reset"
bind KP_INS "set coop_build_cmd solid"
bind KP_ENTER "set coop_build_cmd place"
bind KP_DEL "set coop_build_cmd undo"

set coop_build_cmd ""
seta coop_build_boot 1
// coop_dev is force-reset to 0 by start_server.cfg at every server start (safety default),
// so it CANNOT be armed from the saved config - it must be set here, after the map is up.
// The monitor (threaded at map load via coop_build_boot) polls every 0.5s and flips ON.
set coop_dev 1
set coop_build 1
echo "BUILD MODE armed: coop_dev 1 + coop_build 1 (no restart needed once coop_build_boot is set)"
