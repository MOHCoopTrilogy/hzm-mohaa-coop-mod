// HZM coop - RAGDOLL settle FIRM  [bound to F1]
// Tightens the hold on the authored pose: the corpse keeps the animator's shape almost exactly
// and only the contact points give. Use this if bodies sag, melt, or lose their pose after
// landing.
coop_ragdollStiff 0.50
echo "RAGDOLL settle FIRM (0.50) - holds the authored pose harder. F8 = back to 0.25."
