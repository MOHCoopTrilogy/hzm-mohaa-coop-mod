// HZM coop - ONE-TIME QUICK-DRAW TIMING #1  [user 2026-10-05: "the whole point is to make it faster than switching
// weapons manually"]
// Run once per profile by the alias coop_qdrawFix1: coop_defaults.cfg defines it armed (exec this file), the SAVED
// config - which loads after coop_defaults.cfg and stores aliases (qcommon/cmd.c Cmd_WriteAliases) - holds it disarmed
// after the first run, and autoexec.cfg invokes it. Same alias one-shot as coop_bindfix2.cfg: a server can neither
// write nor run an alias (qcommon/cmd_filter.c).
// WHY A ONE-SHOT: the three are CVAR_ARCHIVE, so every existing profile holds the old values in its saved config, and
// that loads AFTER the new coop_defaults.cfg seeds - the seeds alone would never reach an existing install. No menu
// offers them, so this cannot undo a choice made in the game; a value set by console afterwards stays yours.
// The new values match the new quick-draw look (cg_qdrawmotion.c): the pistol is in the sight picture ~0.18 s after
// the press and the long gun back ~0.25 s after the release, so it fires when it looks ready.
seta coop_qdrawDelay 0.18
seta coop_qdrawReturn 0.25
seta coop_qdrawMinHold 0.30
alias coop_qdrawFix1 ""
echo "^3[coop] quick draw retimed: pistol 0.18 s, back to the primary 0.25 s, minimum hold 0.3 s (one time only)"
