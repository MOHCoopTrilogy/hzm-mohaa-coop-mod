// [user 2026-09-16, bug-2671] FORCE A LISTEN SERVER. UI_StartDMMap_f (cl_ui.cpp) builds the server-start
// command from ui_dedicated: `set dedicated <ui_dedicated>; ... map <x>`. A host whose config has a stale
// ui_dedicated 1 (e.g. from toggling the menu's Dedicated option, or a GameSpy default) therefore runs
// `set dedicated 1` when they click Start - which makes the engine SHUT DOWN THE CLIENT and renderer
// (common.c: com_dedicated modified -> CL_Shutdown "dedicated set to 1" -> RE_Shutdown(1)) on a machine
// that is trying to PLAY. On a recent NVIDIA driver that full renderer teardown crashed inside the GPU
// shader compiler (nvgpucomp64.dll) - a repeated crash for a buddy whose config had ui_dedicated 1, while
// hosts with ui_dedicated 0 never saw it. The in-game coop start is ALWAYS a listen host (a genuine
// dedicated server is launched separately via omohaaded.exe / dedicated_example.cfg), so pin both to 0
// here before the start. Harmless for hosts already at 0.
set ui_dedicated 0
set dedicated 0

// ui_startdmmap 2 reads ui_dmmap directly (not via $-substitution, so it works with
// dynamically-set cvars). It starts a proper multiplayer listen server - no SP
// "Continue" button - and sets g_gametype 2 (Team Match) internally.
// ui_dmmap is set by the map-button stuffcommand (e.g. "set ui_dmmap m1l1").
set g_mpHardcore 0		// [2026-09-25] hygiene: an MP Hardcore session never zeroes it on the way out
ui_startdmmap 2

// ===== [user 2026-08-10] T1.3 - HOST render pacing =====
// This file runs only when THIS machine starts a coop server, so it affects the host, never a
// joiner. On a listen server SV_SendClientMessages() is called once per main-loop iteration
// (sv_main.c:1221), so the host's frame rate sets how often snapshots actually LEAVE the box.
// The simulation is fine either way - SV_Frame drains sv.timeResidual in exact 25ms chunks - but
// DELIVERY is gated by the render loop. With vsync on, one missed refresh halves a 60Hz loop to
// 30fps, which drops remote players from 40 snapshots/sec to 30 and pins the "slow server" icon.
// [2026-09-27 bug-3017/bug-3104] The `seta r_swapInterval 0` that used to sit here is gone. r_swapInterval
// is ARCHIVE|LATCH and read only at GLimp_SetMode, so it never changed vsync for the session being
// hosted - it only latched, got written to the saved config, and switched vsync off at the NEXT
// launch, silently overriding the Advanced Graphics VSync row. A host who wants the pacing sets
// VSync Off in that menu. A live vsync switch is the live_graphics_settings plan's P1(e).
// [2026-09-27 graphics menu Phase 1, D3] The 125 cap is for THIS hosted session only. com_maxfps is archived, so
// the 125 still reaches the saved config, but the player's Frame Rate Limit pick lives in the alias
// coop_fpsRestore, which autoexec.cfg re-applies at the next launch. Never touch that alias here (gated by
// docs/tools/gen_menu_graphics.py). `set`, not `seta`: this is a session cap, not a saved choice.
set com_maxfps 125
